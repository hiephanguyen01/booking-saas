# ROLLBACK PATH — no longer the staging host's TLS terminator.
#
# Superseded by docker/caddy/Caddyfile: this config can only serve the certbot
# certificate for stg.bookingos.vn + *.stg.bookingos.vn, so a tenant custom
# domain fails at the TLS handshake and never reaches the app. Caddy's on-demand
# TLS obtains a certificate per hostname instead.
#
# Kept because the certbot certificates are still on disk and the cron renewal
# still runs, so falling back is one command:
#   sudo systemctl stop caddy && sudo systemctl start nginx
#
# Delete this file (and the certbot cron) only after Caddy has been stable for
# 1–2 weeks — see docs/deployment.md → TLS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name stg.bookingos.vn *.stg.bookingos.vn;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name stg.bookingos.vn *.stg.bookingos.vn;

  ssl_certificate /etc/letsencrypt/live/stg.bookingos.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stg.bookingos.vn/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
