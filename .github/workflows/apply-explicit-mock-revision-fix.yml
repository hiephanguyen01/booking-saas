name: Apply Explicit Mock Revision Fix (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/payment-provider-routing-separation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply regression test and minimal fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          spec = Path('apps/api/src/modules/payments/application/use-cases/checkout.use-case.spec.ts')
          s = spec.read_text()

          old_import = "import type { GatewayConfigRecord } from '../../domain/ports/gateway-config-repository.port';"
          new_import = """import type {
            GatewayConfigRecord,
            IGatewayConfigRepository,
          } from '../../domain/ports/gateway-config-repository.port';"""
          if old_import not in s:
            raise SystemExit('gateway-config import marker not found')
          s = s.replace(old_import, new_import, 1)

          old_import2 = "import type { IRefundPolicyRepository } from '../../domain/ports/refund-policy-repository.port';\nimport { CheckoutUseCase } from './checkout.use-case';"
          new_import2 = """import type { IRefundPolicyRepository } from '../../domain/ports/refund-policy-repository.port';
          import type { IPaymentMethodRouteRepository } from '../../domain/ports/payment-method-route-repository.port';
          import { GatewayRegistry } from '../../infrastructure/gateway-registry';
          import { MockGatewayAdapter } from '../../infrastructure/gateways/mock-gateway.adapter';
          import { CheckoutUseCase } from './checkout.use-case';"""
          if old_import2 not in s:
            raise SystemExit('refund-policy import marker not found')
          s = s.replace(old_import2, new_import2, 1)

          old_options = "  gatewayTxnId?: string | null;\n}"
          new_options = "  gatewayTxnId?: string | null;\n  registry?: GatewayRegistryPort;\n}"
          if old_options not in s:
            raise SystemExit('Options marker not found')
          s = s.replace(old_options, new_options, 1)

          old_registry = "    fakePort<GatewayRegistryPort>({\n      resolveActiveForMethod:"
          new_registry = "    options.registry ?? fakePort<GatewayRegistryPort>({\n      resolveActiveForMethod:"
          if old_registry not in s:
            raise SystemExit('registry injection marker not found')
          s = s.replace(old_registry, new_registry, 1)

          describe_marker = "\n\ndescribe('CheckoutUseCase', () => {"
          helper = r'''

function explicitMockRegistry(): GatewayRegistryPort {
  const mockConfig = config('mock', ['bank_transfer']);
  return new GatewayRegistry(
    new MockGatewayAdapter(),
    fakePort<IGatewayConfigRepository>({
      findActiveAll: () => Promise.resolve([mockConfig]),
      findActiveByGateway: (_tx, _tenantId, gateway) =>
        Promise.resolve(gateway === 'mock' ? mockConfig : null),
      findById: (_tx, _tenantId, id) => Promise.resolve(id === mockConfig.id ? mockConfig : null),
      findByGateway: () => Promise.resolve(mockConfig),
    }),
    fakePort<IPaymentMethodRouteRepository>({
      findEnabledByMethod: (_tx, _tenantId, method) =>
        Promise.resolve(
          method === 'bank_transfer' ? { method, gateway: 'mock', enabled: true } : null,
        ),
      hasConfiguredRoutes: () => Promise.resolve(true),
    }),
  );
}
'''
          if describe_marker not in s:
            raise SystemExit('describe marker not found')
          s = s.replace(describe_marker, helper + describe_marker, 1)

          test_marker = "  it('refuses the mock gateway in production', async () => {"
          test = r'''  it('snapshots the exact config revision for an explicit mock route', async () => {
    vi.stubEnv('NODE_ENV', 'development');
    vi.stubEnv('ALLOW_MOCK_PAYMENTS', 'true');
    const { useCase, created } = harness({
      gatewayKey: 'mock',
      registry: explicitMockRegistry(),
    });

    await useCase.execute(HOST, BOOKING_ID, 'bank_transfer');

    expect(created[0]).toMatchObject({
      gateway: 'mock',
      gatewayConfigRevisionId: 'config-mock',
      refundStrategySnapshot: 'manual',
      manualRefundSlaHoursSnapshot: 72,
    });
  });

'''
          if test_marker not in s:
            raise SystemExit('test insertion marker not found')
          s = s.replace(test_marker, test + test_marker, 1)
          spec.write_text(s)

          registry = Path('apps/api/src/modules/payments/infrastructure/gateway-registry.ts')
          r = registry.read_text()
          old = """  private resolveConfig(cfg: GatewayConfigRecord | null): ResolvedGateway {
            if (!cfg || cfg.gateway === 'mock') {
              return {
                gateway: this.mock,
                configRevisionId: null,
                settings: DEFAULT_GATEWAY_PAYMENT_SETTINGS,
              };
            }
            return {
              gateway: this.adapterForConfig(cfg),
              configRevisionId: cfg.id,
              settings: cfg.settings,
            };
          }
"""
          old = old.replace('            ', '')
          new = """  private resolveConfig(cfg: GatewayConfigRecord | null): ResolvedGateway {
    if (!cfg) {
      return {
        gateway: this.mock,
        configRevisionId: null,
        settings: DEFAULT_GATEWAY_PAYMENT_SETTINGS,
      };
    }
    return {
      gateway: cfg.gateway === 'mock' ? this.mock : this.adapterForConfig(cfg),
      configRevisionId: cfg.id,
      settings: cfg.settings,
    };
  }
"""
          if old not in r:
            raise SystemExit('resolveConfig block not found')
          registry.write_text(r.replace(old, new, 1))

          Path('apps/api/src/modules/payments/application/use-cases/checkout-explicit-mock-revision.use-case.spec.ts').unlink()
          PY

      - name: Remove helper workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-explicit-mock-revision-fix.yml
          git config user.name 'bookingos-ci'
          git config user.email 'bookingos-ci@users.noreply.github.com'
          git add apps/api/src/modules/payments/application/use-cases/checkout.use-case.spec.ts \
                  apps/api/src/modules/payments/application/use-cases/checkout-explicit-mock-revision.use-case.spec.ts \
                  apps/api/src/modules/payments/infrastructure/gateway-registry.ts \
                  .github/workflows/apply-explicit-mock-revision-fix.yml
          git commit -m 'fix(payments): retain explicit mock config revision'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
