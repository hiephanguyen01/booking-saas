name: Agent Payment Final Fixes

on:
  push:
    branches:
      - refactor/payment-provider-routing-separation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/payment-provider-routing-separation
          fetch-depth: 0
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('apps/api/src/modules/payments/application/use-cases/execute-refund.use-case.spec.ts')
          text = spec.read_text()
          old = "succeeded: payment({ gatewayConfigRevisionId: 'config-1' }),"
          new = "succeeded: payment({ gatewayConfigRevisionId: 'config-1', gateway: 'momo' }),"
          if text.count(old) != 1:
              raise SystemExit(f'historical payment fixture match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_expected = "expect(resolvedPayments).toEqual(['sepay:config-1']);"
          # Two revision assertions exist; replace the second one, paired with the historical test.
          idx = text.find("it('uses the exact historical config revision")
          if idx < 0:
              raise SystemExit('historical test marker missing')
          before, tail = text[:idx], text[idx:]
          if tail.count(old_expected) != 1:
              raise SystemExit(f'historical expected match count={tail.count(old_expected)}')
          tail = tail.replace(old_expected, "expect(resolvedPayments).toEqual(['momo:config-1']);", 1)
          spec.write_text(before + tail)

          ui = Path('apps/dashboard/app/features/tenant/components/settings/checkout-method-settings-card.tsx')
          text = ui.read_text()
          old = 'text-amber-700 dark:text-amber-400'
          if text.count(old) != 1:
              raise SystemExit(f'palette class match count={text.count(old)}')
          ui.write_text(text.replace(old, 'text-warning', 1))

          Path('.github/workflows/agent-payment-final-fixes.yml').unlink()
          PY
      - name: Commit fixes and cleanup helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(payments): align historical refund fixture and theme token"
          git push origin HEAD:refactor/payment-provider-routing-separation
