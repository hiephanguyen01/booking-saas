name: SePay refund retry proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SePay duplicate-void recovery proof
        shell: bash
        run: |
          cat > apps/api/src/modules/payments/infrastructure/gateways/.sepay-retry-proof.cjs <<'JS'
          const { SepayGatewayAdapter } = require('./sepay-gateway.adapter.ts');

          (async () => {
            const calls = [];
            const responses = [
              new Response('', { status: 409 }),
              new Response(JSON.stringify({ data: { order_status: 'VOIDED', order_amount: '100000' } }), {
                status: 200,
                headers: { 'content-type': 'application/json' },
              }),
            ];
            global.fetch = async (input, init = {}) => {
              calls.push({ url: String(input), method: init.method ?? 'GET' });
              const response = responses.shift();
              if (!response) throw new Error(`unexpected fetch ${String(input)}`);
              return response;
            };

            const adapter = new SepayGatewayAdapter({
              merchantId: 'merchant',
              secretKey: 'secret',
              environment: 'sandbox',
            });
            const result = await adapter.refund({
              refundId: 'refund-1',
              gatewayTxnId: '12345',
              gatewayOrderRef: 'ORDER-1',
              amountVnd: 100000n,
              reason: 'booking_cancellation',
            });

            const failures = [];
            if (result.status !== 'succeeded') {
              failures.push(`expected succeeded after 409 + VOIDED, actual=${result.status}`);
            }
            if (result.refundId !== 'sepay:void:ORDER-1') {
              failures.push(`unexpected refundId=${String(result.refundId)}`);
            }
            if (calls.length !== 2) failures.push(`expected 2 provider calls, actual=${calls.length}`);
            if (!calls[0]?.url.endsWith('/v1/order/voidTransaction')) {
              failures.push(`first call must be voidTransaction: ${calls[0]?.url}`);
            }
            if (!calls[1]?.url.includes('/v1/order/detail/ORDER-1')) {
              failures.push(`second call must reconcile order detail: ${calls[1]?.url}`);
            }

            if (failures.length) {
              console.error(JSON.stringify({ sepayRetryProof: false, failures, calls }, null, 2));
              process.exit(1);
            }
            console.log(JSON.stringify({
              sepayRetryProof: true,
              duplicateVoidReconciled: true,
              crashAfterProviderSuccessSafe: true,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(2); });
          JS
          cd apps/api
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"Node"}' \
            node -r ts-node/register/transpile-only src/modules/payments/infrastructure/gateways/.sepay-retry-proof.cjs
