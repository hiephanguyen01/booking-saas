name: Payment Foundation Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookingos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookingos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookingos?schema=public
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@localhost:5432/bookingos?schema=public
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@localhost:5432/bookingos?schema=public
      PAYMENTS_ENC_KEY: payment-foundation-proof-key
      NODE_ENV: test
      OUTBOX_RELAY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy migrations on clean Postgres
        run: pnpm --filter=@booking/api prisma:deploy
      - name: Generate Prisma client
        run: pnpm --filter=@booking/api prisma:generate
      - name: Full static gate
        run: |
          pnpm check:no-tests
          pnpm check:module-cycles
          pnpm check:frontend-structure
          pnpm check:theme-tokens
          pnpm check:tenant-surfaces
          pnpm --filter=@booking/storefront security
          pnpm turbo lint typecheck build
          pnpm --filter=@booking/api check:rls
      - name: Runtime payment-foundation smoke
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          cat > .payment-foundation-smoke.ts <<'TS'
          import assert from 'node:assert/strict';
          import { PrismaClient } from '@prisma/client';
          import { defaultGatewayPaymentSettings } from '@booking/contracts';
          import { AesGcmCryptoService } from './src/modules/payments/infrastructure/aes-gcm-crypto.service';
          import { MockGatewayAdapter } from './src/modules/payments/infrastructure/gateways/mock-gateway.adapter';
          import { PrismaGatewayConfigRepository } from './src/modules/payments/infrastructure/repositories/prisma-gateway-config.repository';
          import { GatewayRegistry } from './src/modules/payments/infrastructure/gateway-registry';
          import { ExecuteAutomaticRefundUseCase } from './src/modules/payments/application/use-cases/execute-automatic-refund.use-case';

          async function main() {
            const prisma = new PrismaClient({
              datasources: { db: { url: process.env.MIGRATE_DATABASE_URL } },
            });
            const crypto = new AesGcmCryptoService();
            const configs = new PrismaGatewayConfigRepository(crypto);
            const registry = new GatewayRegistry(new MockGatewayAdapter(), configs);

            try {
              const tenant = await prisma.tenant.create({
                data: { name: 'Payment Foundation Proof', slug: `payment-proof-${Date.now()}` },
              });

              const payosASettings = {
                ...defaultGatewayPaymentSettings('payos'),
                manualRefundSlaHours: 48,
              };

              const payosA = await prisma.$transaction((tx) =>
                configs.upsert(tx, tenant.id, {
                  gateway: 'payos',
                  environment: 'sandbox',
                  credentials: {
                    clientId: 'proof-client-a',
                    apiKey: 'proof-api-a',
                    checksumKey: 'proof-checksum-key-a-1234567890',
                  },
                  settings: payosASettings,
                }),
              );
              const rawA = await prisma.tenantGatewayConfig.findUniqueOrThrow({ where: { id: payosA.id } });
              const encryptedA = JSON.stringify(rawA.credentials);

              const payosB = await prisma.$transaction((tx) =>
                configs.upsert(tx, tenant.id, {
                  gateway: 'payos',
                  environment: 'sandbox',
                  credentials: {
                    clientId: 'proof-client-b',
                    apiKey: 'proof-api-b',
                    checksumKey: 'proof-checksum-key-b-1234567890',
                  },
                }),
              );

              let payosRows = await prisma.tenantGatewayConfig.findMany({
                where: { tenantId: tenant.id, gateway: 'payos' },
                orderBy: { createdAt: 'asc' },
              });
              assert.equal(payosRows.length, 2, 'credential rotation must append a second revision');
              assert.equal(payosRows.filter((row) => row.isActive).length, 1, 'exactly one payOS revision active');
              assert.equal(payosRows.find((row) => row.id === payosA.id)?.isActive, false);
              assert.equal(payosRows.find((row) => row.id === payosB.id)?.isActive, true);
              assert.equal(JSON.stringify(payosRows.find((row) => row.id === payosA.id)?.credentials), encryptedA,
                'historical encrypted credentials must remain unchanged');
              assert.equal((payosB.settings as any).manualRefundSlaHours, 48,
                'credential-only rotation must preserve current settings');

              const payosSettingsRevision = await prisma.$transaction((tx) =>
                configs.updateSettings(tx, tenant.id, 'payos', {
                  ...defaultGatewayPaymentSettings('payos'),
                  manualRefundSlaHours: 96,
                }),
              );
              assert.ok(payosSettingsRevision, 'settings update must create a successor revision');
              payosRows = await prisma.tenantGatewayConfig.findMany({
                where: { tenantId: tenant.id, gateway: 'payos' },
              });
              assert.equal(payosRows.length, 3, 'settings update must append, not mutate');
              assert.equal(payosRows.filter((row) => row.isActive).length, 1);

              await prisma.$transaction((tx) =>
                configs.upsert(tx, tenant.id, {
                  gateway: 'sepay',
                  environment: 'sandbox',
                  credentials: {
                    merchantId: 'proof-merchant-a',
                    secretKey: 'proof-sepay-secret-key-a-1234567890',
                  },
                }),
              );
              const reactivatedPayos = await prisma.$transaction((tx) =>
                configs.upsert(tx, tenant.id, {
                  gateway: 'payos',
                  environment: 'sandbox',
                  credentials: {
                    clientId: 'proof-client-c',
                    apiKey: 'proof-api-c',
                    checksumKey: 'proof-checksum-key-c-1234567890',
                  },
                }),
              );
              assert.equal(reactivatedPayos.settings.manualRefundSlaHours, 96,
                'reactivating an inactive gateway must preserve its latest settings');

              await Promise.all([
                prisma.$transaction((tx) =>
                  configs.upsert(tx, tenant.id, {
                    gateway: 'payos',
                    environment: 'production',
                    credentials: {
                      clientId: 'proof-client-d',
                      apiKey: 'proof-api-d',
                      checksumKey: 'proof-checksum-key-d-1234567890',
                    },
                  }),
                ),
                prisma.$transaction((tx) =>
                  configs.upsert(tx, tenant.id, {
                    gateway: 'sepay',
                    environment: 'production',
                    credentials: {
                      merchantId: 'proof-merchant-b',
                      secretKey: 'proof-sepay-secret-key-b-1234567890',
                    },
                  }),
                ),
              ]);
              let activeBase = await prisma.tenantGatewayConfig.findMany({
                where: {
                  tenantId: tenant.id,
                  isActive: true,
                  gateway: { notIn: ['momo', 'zalopay'] },
                },
              });
              assert.equal(activeBase.length, 1, 'concurrent base-gateway saves must leave one active base gateway');

              await prisma.$transaction((tx) =>
                configs.upsert(tx, tenant.id, {
                  gateway: 'momo',
                  environment: 'sandbox',
                  credentials: {
                    partnerCode: 'proof-partner',
                    accessKey: 'proof-access',
                    secretKey: 'proof-momo-secret-key-1234567890',
                  },
                }),
              );
              const finalPayos = await prisma.$transaction((tx) =>
                configs.upsert(tx, tenant.id, {
                  gateway: 'payos',
                  environment: 'sandbox',
                  credentials: {
                    clientId: 'proof-client-final',
                    apiKey: 'proof-api-final',
                    checksumKey: 'proof-checksum-key-final-1234567890',
                  },
                }),
              );
              activeBase = await prisma.tenantGatewayConfig.findMany({
                where: {
                  tenantId: tenant.id,
                  isActive: true,
                  gateway: { notIn: ['momo', 'zalopay'] },
                },
              });
              const activeMomo = await prisma.tenantGatewayConfig.count({
                where: { tenantId: tenant.id, gateway: 'momo', isActive: true },
              });
              assert.equal(activeBase.length, 1);
              assert.equal(activeBase[0]?.id, finalPayos.id);
              assert.equal(activeMomo, 1, 'wallet config must remain active while base gateway rotates');

              const historical = await prisma.$transaction((tx) =>
                registry.resolveForPayment(tx, {
                  id: '00000000-0000-7000-8000-000000000001',
                  tenantId: tenant.id,
                  gateway: 'payos',
                  gatewayConfigRevisionId: payosA.id,
                }),
              );
              assert.equal(historical.configRevisionId, payosA.id, 'historical payment must resolve revision A');
              assert.equal(historical.gateway.key, 'payos');

              const legacy = await prisma.$transaction((tx) =>
                registry.resolveForPayment(tx, {
                  id: '00000000-0000-7000-8000-000000000002',
                  tenantId: tenant.id,
                  gateway: 'payos',
                  gatewayConfigRevisionId: null,
                }),
              );
              assert.equal(legacy.configRevisionId, finalPayos.id, 'legacy payment must resolve current matching config');

              const refundRecord = {
                id: '00000000-0000-7000-8000-000000000010',
                tenantId: tenant.id,
                paymentId: '00000000-0000-7000-8000-000000000011',
                bookingId: '00000000-0000-7000-8000-000000000012',
                amount: 1000n,
                status: 'pending',
                gatewayRefundId: null,
                reason: 'booking_cancellation',
                affectsBookingStatus: true,
                evidence: null,
                executionMode: 'automatic',
                dueAt: null,
                completedAt: null,
              } as const;
              const sourcePayment = {
                id: refundRecord.paymentId,
                tenantId: tenant.id,
                bookingId: refundRecord.bookingId,
                gateway: 'momo',
                kind: 'full',
                amount: 1000n,
                capturedAmount: 1000n,
                status: 'succeeded',
                checkoutState: 'ready',
                gatewayConfigRevisionId: null,
                gatewayOrderRef: 'proof-order',
                gatewayOrderId: null,
                gatewayTxnId: 'proof-txn',
                paymentMethod: 'momo_wallet',
                idempotencyKey: 'proof-idempotency',
                paidAt: new Date(),
              } as const;
              let requestedPaymentId: string | null = null;
              let completedAutomatic = false;
              const fakePayments = {
                findById: async (_tx: unknown, id: string) => {
                  requestedPaymentId = id;
                  return sourcePayment;
                },
                findSucceededByBooking: async () => {
                  throw new Error('automatic refund must not query latest booking payment');
                },
              };
              const fakeRefunds = {
                findById: async () => refundRecord,
                lockForBooking: async () => undefined,
                completeAutomatic: async () => {
                  completedAutomatic = true;
                  return { ...refundRecord, status: 'succeeded' as const };
                },
              };
              const fakeGateway = {
                key: 'momo',
                refund: async () => ({ supported: true, refundId: 'proof-refund' }),
              };
              const fakeRegistry = {
                resolveForPayment: async () => ({
                  gateway: fakeGateway,
                  configRevisionId: null,
                  settings: defaultGatewayPaymentSettings('momo'),
                }),
              };
              const fakeTenantDb = {
                forTenant: async (_tenantId: string, fn: (tx: unknown) => Promise<unknown>) => fn({}),
              };
              const fakeOutbox = { emit: async () => undefined };
              const refundUseCase = new ExecuteAutomaticRefundUseCase(
                fakePayments as any,
                fakeRefunds as any,
                fakeRegistry as any,
                fakeTenantDb as any,
                fakeOutbox as any,
              );
              await refundUseCase.execute(tenant.id, refundRecord.id);
              assert.equal(requestedPaymentId, refundRecord.paymentId,
                'automatic refund must load its durable refund.paymentId source');
              assert.equal(completedAutomatic, true);

              console.log(JSON.stringify({
                immutableRevisions: true,
                settingsRevision: true,
                inactiveReactivationPreservesSettings: true,
                concurrentBaseActiveCount: activeBase.length,
                walletCoexistsWithBase: activeMomo === 1,
                historicalRevisionResolved: historical.configRevisionId === payosA.id,
                legacyFallbackResolvedCurrent: legacy.configRevisionId === finalPayos.id,
                refundUsesDurablePaymentId: requestedPaymentId === refundRecord.paymentId,
              }));
            } finally {
              await prisma.$disconnect();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          pnpm exec ts-node --transpile-only .payment-foundation-smoke.ts
          rm -f .payment-foundation-smoke.ts
