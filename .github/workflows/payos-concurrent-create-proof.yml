name: payOS Concurrent Create Proof

on:
  push:
    branches: [refactor/durable-checkout-payos]
  pull_request:
    branches: [refactor/payment-foundation]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@booking/contracts build
      - run: pnpm --filter=@booking/api prisma:generate
      - name: Concurrent provider create convergence
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          cat > .payos-concurrent-proof.ts <<'TS'
          import assert from 'node:assert/strict';
          import { PayosGatewayAdapter } from './src/modules/payments/infrastructure/gateways/payos-gateway.adapter';

          async function main() {
            const payos = new PayosGatewayAdapter({
              clientId: 'proof-client',
              apiKey: 'proof-api',
              checksumKey: 'proof-checksum-key-1234567890',
            });
            const paymentId = '00000000-0000-7000-8000-000000000301';
            const gatewayOrderRef = payos.prepareOrderReference(paymentId);
            const orderCode = Number(gatewayOrderRef);
            const input = {
              paymentId,
              gatewayOrderRef,
              amountVnd: 4_000n,
              description: 'Booking BK-RACE',
              returnUrl: 'https://shop.example/return',
              errorUrl: 'https://shop.example/error',
              cancelUrl: 'https://shop.example/cancel',
              expiresInSec: 900,
              paymentMethod: 'bank_transfer' as const,
            };

            const originalFetch = globalThis.fetch;
            let initialGets = 0;
            let releaseInitialGets!: () => void;
            const bothInitialGets = new Promise<void>((resolve) => { releaseInitialGets = resolve; });
            let providerCreated = false;
            let postCount = 0;

            globalThis.fetch = (async (_request: string | URL | Request, init?: RequestInit) => {
              const method = init?.method ?? 'GET';
              if (method === 'GET' && !providerCreated) {
                initialGets++;
                if (initialGets === 2) releaseInitialGets();
                await bothInitialGets;
                return new Response('{}', { status: 404 });
              }
              if (method === 'POST') {
                postCount++;
                if (!providerCreated) {
                  providerCreated = true;
                  return new Response(JSON.stringify({
                    code: '00',
                    data: {
                      paymentLinkId: 'race-link',
                      orderCode,
                      amount: 4_000,
                      status: 'PENDING',
                    },
                  }), { status: 200, headers: { 'content-type': 'application/json' } });
                }
                return new Response('{}', { status: 409 });
              }
              assert.equal(providerCreated, true);
              return new Response(JSON.stringify({
                code: '00',
                data: {
                  id: 'race-link',
                  orderCode,
                  amount: 4_000,
                  amountPaid: 0,
                  status: 'PENDING',
                },
              }), { status: 200, headers: { 'content-type': 'application/json' } });
            }) as typeof fetch;

            try {
              const [a, b] = await Promise.all([payos.createPayment(input), payos.createPayment(input)]);
              assert.equal(initialGets, 2);
              assert.equal(postCount, 2, 'both requests reached POST after simultaneous lookup miss');
              assert.equal(a.gatewayOrderRef, gatewayOrderRef);
              assert.equal(b.gatewayOrderRef, gatewayOrderRef);
              assert.equal(a.gatewayTxnId, 'race-link');
              assert.equal(b.gatewayTxnId, 'race-link');
              assert.equal(
                a.destination.type === 'redirect' ? a.destination.paymentUrl : '',
                'https://pay.payos.vn/web/race-link',
              );
              assert.deepEqual(a.destination, b.destination);
              console.log(JSON.stringify({ concurrentPayosCreateConverges: true, oneProviderResource: true }));
            } finally {
              globalThis.fetch = originalFetch;
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          pnpm exec ts-node --transpile-only .payos-concurrent-proof.ts
          rm -f .payos-concurrent-proof.ts
