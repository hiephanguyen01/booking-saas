name: Smoke Local Hardening Proof

on:
  pull_request:
    branches:
      - main
      - refactor/durable-checkout-payos

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify smoke-local hardening invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync('scripts/smoke-local.mjs', 'utf8');
          const required = [
            ['all four compose services are required', /REQUIRED_COMPOSE_SERVICES/],
            ['encrypted MoMo credentials require credentials.enc', /credentials\?\.enc|credentials\.enc|\.credentials\?\.enc/],
            ['public callback URL is explicitly HTTPS-only', /protocol\s*!==\s*["']https:["']|protocol\s*===\s*["']https:["']/],
            ['HTTP requests are destroyed on timeout', /req\.destroy\(/],
            ['tunnel probe is described as health reachability, not webhook delivery', /Public HTTPS Tunnel Health|Tunnel Health Reachability|public HTTPS tunnel health/i],
          ];

          const failures = required.filter(([, pattern]) => !pattern.test(source)).map(([name]) => name);
          if (failures.length) {
            console.error(JSON.stringify({ smokeLocalHardeningProof: false, failures }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ smokeLocalHardeningProof: true }, null, 2));
          NODE
