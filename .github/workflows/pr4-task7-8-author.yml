name: PR4 Task7-8 Author

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-task7-8:
    if: github.event.pull_request.head.ref == 'feat/refund-allocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply Finance guard and commit Task 7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/modules/finance/infrastructure/http/finance.module.ts')
          s = p.read_text()
          old = '''    this.registry.register('refund.requested', (event) => {\n      const p = event.payload as {\n        bookingId: string;\n        amount: string;\n        reason?: string;\n        affectsBookingStatus?: boolean;\n      };\n      if (p.affectsBookingStatus === false) return Promise.resolve();'''
          new = '''    this.registry.register('refund.requested', (event) => {\n      const p = event.payload as {\n        refundBatchId?: string;\n        bookingId: string;\n        amount: string;\n        reason?: string;\n        affectsBookingStatus?: boolean;\n      };\n      // Batched child requests are operational execution units. The full business\n      // amount was already prepared by cancellation/dispute handling.\n      if (p.refundBatchId) return Promise.resolve();\n      if (p.affectsBookingStatus === false) return Promise.resolve();'''
          if s.count(old) != 1:
              raise SystemExit(f'finance handler match count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/finance/infrastructure/http/finance.module.ts
          git commit -m "fix(finance): ignore refund batch child requests"
      - name: Apply recovery semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          refund_repo = 'apps/api/src/modules/payments/infrastructure/repositories/prisma-refund.repository.ts'
          replace_once(
              refund_repo,
              '''        WHERE status = 'succeeded'::refund_status\n          AND reason IS DISTINCT FROM 'security_deposit'\n        ORDER BY booking_id, updated_at DESC, created_at DESC, id DESC''',
              '''        WHERE status = 'succeeded'::refund_status\n          AND refund_batch_id IS NULL\n          AND reason IS DISTINCT FROM 'security_deposit'\n        ORDER BY booking_id, updated_at DESC, created_at DESC, id DESC''',
          )

          payment_repo = 'apps/api/src/modules/payments/infrastructure/repositories/prisma-payment.repository.ts'
          old = '''             (b.status IN ('cancelled', 'refunded') OR EXISTS (\n                SELECT 1 FROM refunds r\n                WHERE r.booking_id = b.id\n                  AND r.status = 'succeeded'::refund_status\n                  AND r.reason <> 'security_deposit'\n              )) AS "skipBookingConfirmation"\n      FROM payments p\n      JOIN bookings b ON b.id = p.booking_id\n      LEFT JOIN booking_settlements bs ON bs.payment_id = p.id\n      WHERE p.status = 'succeeded'\n        AND (\n          (b.status IN ('pending_payment', 'expired') AND NOT EXISTS (\n            SELECT 1 FROM refunds r\n            WHERE r.booking_id = b.id\n              AND r.status = 'succeeded'::refund_status\n              AND r.reason <> 'security_deposit'\n          ))\n          OR bs.id IS NULL\n        )'''
          new = '''             (b.status IN ('cancelled', 'refunded') OR EXISTS (\n                SELECT 1 FROM refunds r\n                WHERE r.booking_id = b.id\n                  AND r.refund_batch_id IS NULL\n                  AND r.status = 'succeeded'::refund_status\n                  AND r.reason <> 'security_deposit'\n              ) OR EXISTS (\n                SELECT 1 FROM refund_batches rb\n                WHERE rb.booking_id = b.id\n                  AND rb.status = 'completed'::refund_batch_status\n                  AND rb.affects_booking_status = true\n              )) AS "skipBookingConfirmation"\n      FROM payments p\n      JOIN bookings b ON b.id = p.booking_id\n      LEFT JOIN booking_settlements bs ON bs.payment_id = p.id\n      WHERE p.status = 'succeeded'\n        AND (\n          (b.status IN ('pending_payment', 'expired') AND NOT EXISTS (\n            SELECT 1 FROM refunds r\n            WHERE r.booking_id = b.id\n              AND r.refund_batch_id IS NULL\n              AND r.status = 'succeeded'::refund_status\n              AND r.reason <> 'security_deposit'\n          ) AND NOT EXISTS (\n            SELECT 1 FROM refund_batches rb\n            WHERE rb.booking_id = b.id\n              AND rb.status = 'completed'::refund_batch_status\n              AND rb.affects_booking_status = true\n          ))\n          OR bs.id IS NULL\n        )'''
          replace_once(payment_repo, old, new)

          reconciliation = 'apps/api/src/modules/payments/infrastructure/reconciliation.worker.ts'
          replace_once(
              reconciliation,
              '''import { REFUND_REPOSITORY, type IRefundRepository } from '../domain/ports/refund-repository.port';''',
              '''import {\n  REFUND_BATCH_REPOSITORY,\n  type IRefundBatchRepository,\n} from '../domain/ports/refund-batch-repository.port';\nimport { REFUND_REPOSITORY, type IRefundRepository } from '../domain/ports/refund-repository.port';''',
          )
          replace_once(
              reconciliation,
              '''    @Inject(GATEWAY_REGISTRY) private readonly registry: GatewayRegistryPort,\n    @Inject(REFUND_REPOSITORY) private readonly refunds: IRefundRepository,''',
              '''    @Inject(GATEWAY_REGISTRY) private readonly registry: GatewayRegistryPort,\n    @Inject(REFUND_BATCH_REPOSITORY) private readonly refundBatches: IRefundBatchRepository,\n    @Inject(REFUND_REPOSITORY) private readonly refunds: IRefundRepository,''',
          )
          marker = '''    const missingRefunds = await this.refunds.findBookingsMissingRefund(100);'''
          insertion = '''    const batchRecoveries = await this.refundBatches.findCompletedNeedingRecovery(100);\n    for (const batch of batchRecoveries) {\n      try {\n        await this.tenantDb.forTenant(batch.tenantId, async (tx) => {\n          await this.outbox.emit(tx, {\n            tenantId: batch.tenantId,\n            eventType: 'refund.completed',\n            payload: {\n              refundId: batch.id,\n              refundBatchId: batch.id,\n              bookingId: batch.bookingId,\n              amount: batch.requestedAmount.toString(),\n              reason: batch.reason,\n              affectsBookingStatus: batch.affectsBookingStatus,\n              recovery: true,\n            },\n          });\n        });\n        reconciled++;\n      } catch (err) {\n        this.logger.debug(\n          `refund batch recovery emit ${batch.id} failed: ${err instanceof Error ? err.message : String(err)}`,\n        );\n      }\n    }\n\n    const missingRefunds = await this.refunds.findBookingsMissingRefund(100);'''
          replace_once(reconciliation, marker, insertion)
          PY
          git diff --check
      - name: Commit Task 8 and remove authoring workflow
        run: |
          rm .github/workflows/pr4-task7-8-author.yml
          git add apps/api/src/modules/payments/infrastructure/reconciliation.worker.ts \
                  apps/api/src/modules/payments/infrastructure/repositories/prisma-refund.repository.ts \
                  apps/api/src/modules/payments/infrastructure/repositories/prisma-payment.repository.ts \
                  .github/workflows/pr4-task7-8-author.yml
          git commit -m "fix(payments): recover refund batch completion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
