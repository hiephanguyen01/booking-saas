name: Agent Payment Contract Cleanup

on:
  push:
    branches:
      - refactor/payment-provider-routing-separation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/payment-provider-routing-separation
          fetch-depth: 0
      - name: Remove implicit wallet routing helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/contracts/src/contracts/payment.ts')
          text = p.read_text()
          old = """/** Legacy helpers retained only for compatibility until implicit routing callers are removed. */
          export const WALLET_GATEWAYS = ['momo', 'zalopay'] as const;
          export function isWalletGateway(gateway: GatewayKey): boolean {
            return (WALLET_GATEWAYS as readonly string[]).includes(gateway);
          }
          export function walletGatewayForMethod(method: CustomerPaymentMethod): GatewayKey | null {
            return method === 'momo_wallet' ? 'momo' : method === 'zalopay_wallet' ? 'zalopay' : null;
          }

          """
          if text.count(old) != 1:
              raise SystemExit(f'wallet helper block count={text.count(old)}')
          p.write_text(text.replace(old, '', 1))
          Path('.github/workflows/agent-payment-contract-cleanup.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(contracts): remove implicit wallet routing helpers"
          git push origin HEAD:refactor/payment-provider-routing-separation
