name: Partial Dispute Refund Recovery Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-db-recovery:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/refund-allocation'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      PAYMENTS_ENC_KEY: pr4-partial-dispute-recovery-key-change-me
      OUTBOX_RELAY_DISABLED: 'true'
      ALLOW_MOCK_PAYMENTS: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refund-allocation
          fetch-depth: 1
      - name: Record exact tested head
        run: echo "partial_dispute_recovery_head=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migration and seed
        run: |
          cp .env.example .env
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate
          pnpm --filter=@booking/api seed
      - name: Run focused real-DB recovery smoke
        working-directory: apps/api
        run: |
          cat > pr4-partial-dispute-recovery-smoke.ts <<'TS'
          import 'reflect-metadata';
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { NestFactory } from '@nestjs/core';
          import { AppModule } from './src/app.module';
          import { PrismaService } from './src/shared/prisma/prisma.service';
          import { TenantDbService } from './src/shared/tenant-context/tenant-db.service';
          import { OutboxHandlerRegistry } from './src/shared/outbox/outbox-handler.registry';
          import { ExecuteRefundUseCase } from './src/modules/payments/application/use-cases/execute-refund.use-case';
          import { ConfirmManualRefundUseCase } from './src/modules/payments/application/use-cases/confirm-manual-refund.use-case';
          import { ReconciliationWorker } from './src/modules/payments/infrastructure/reconciliation.worker';
          import {
            REFUND_BATCH_REPOSITORY,
            type IRefundBatchRepository,
          } from './src/modules/payments/domain/ports/refund-batch-repository.port';
          import { RecordHeldSettlementUseCase } from './src/modules/finance/application/use-cases/record-held-settlement.use-case';
          import { PrepareSettlementRefundUseCase } from './src/modules/finance/application/use-cases/prepare-settlement-refund.use-case';

          async function main() {
            const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
            const prisma = app.get(PrismaService);
            const tenantDb = app.get(TenantDbService);
            const registry = app.get(OutboxHandlerRegistry);
            const executeRefund = app.get(ExecuteRefundUseCase);
            const confirmManual = app.get(ConfirmManualRefundUseCase);
            const reconciliation = app.get(ReconciliationWorker);
            const batches = app.get<IRefundBatchRepository>(REFUND_BATCH_REPOSITORY, { strict: false });
            const recordHeld = app.get(RecordHeldSettlementUseCase, { strict: false });
            const prepareSettlementRefund = app.get(PrepareSettlementRefundUseCase, { strict: false });

            const tenant = await prisma.admin.tenant.findUnique({ where: { slug: 'studiohub' } });
            const owner = await prisma.admin.user.findUnique({ where: { email: 'owner@studiohub.vn' } });
            const template = tenant
              ? await prisma.admin.booking.findFirst({ where: { tenantId: tenant.id } })
              : null;
            if (!tenant || !owner || !template) throw new Error('StudioHub seed prerequisites missing');

            const check = (name: string, condition: unknown) => {
              assert.ok(condition, name);
              console.log(`PASS ${name}`);
            };

            async function createBooking(
              label: string,
              status: 'completed' | 'cancelled',
              securityDeposit = 0n,
            ) {
              const {
                id: _id,
                code: _code,
                idempotencyKey: _idem,
                createdAt: _created,
                updatedAt: _updated,
                ...copy
              } = template;
              const suffix = `${Date.now()}-${randomUUID().slice(0, 8)}`;
              return prisma.admin.booking.create({
                data: {
                  ...copy,
                  code: `PR4-REC-${label}-${suffix}`,
                  idempotencyKey: `pr4-rec-${label}-${suffix}`,
                  status,
                  securityDeposit,
                  refundDueAmount: null,
                  refundPercent: null,
                  paidAmount: 0n,
                },
              });
            }

            async function createManualPayment(bookingId: string, amount: bigint) {
              return prisma.admin.payment.create({
                data: {
                  tenantId: tenant.id,
                  bookingId,
                  gateway: 'payos',
                  kind: 'full',
                  amount,
                  capturedAmount: amount,
                  status: 'succeeded',
                  checkoutState: 'ready',
                  refundStrategySnapshot: 'manual',
                  manualRefundSlaHoursSnapshot: 72,
                  paymentMethod: 'bank_transfer',
                  idempotencyKey: `pr4-rec-payment-${randomUUID()}`,
                  paidAt: new Date(),
                },
              });
            }

            async function batchFor(bookingId: string, reason: string) {
              return tenantDb.forTenant(tenant.id, (tx) =>
                batches.findByBookingReason(tx, bookingId, reason),
              );
            }

            async function completeManualBatch(
              bookingId: string,
              amount: bigint,
              reason: string,
              affectsBookingStatus: boolean,
            ) {
              await executeRefund.execute(tenant.id, bookingId, amount, reason, affectsBookingStatus);
              const batch = await batchFor(bookingId, reason);
              assert.ok(batch, `batch ${reason} missing`);
              const child = await prisma.admin.refund.findFirst({
                where: { refundBatchId: batch.id },
              });
              assert.ok(child, `child ${reason} missing`);
              await confirmManual.execute(
                tenant.id,
                child.id,
                { reference: `PR4-REC-${randomUUID()}` },
                owner.id,
              );
              const completed = await prisma.admin.refundBatch.findUnique({ where: { id: batch.id } });
              check(`${reason} batch completed`, completed?.status === 'completed');
              return batch;
            }

            function payloadObject(value: unknown): Record<string, unknown> | null {
              return value && typeof value === 'object' && !Array.isArray(value)
                ? (value as Record<string, unknown>)
                : null;
            }

            async function batchCompletionEvents(batchId: string, recoveryOnly = false) {
              const rows = await prisma.admin.outboxEvent.findMany({
                where: { tenantId: tenant.id, eventType: 'refund.completed' },
                orderBy: { createdAt: 'asc' },
              });
              return rows.filter((row) => {
                const payload = payloadObject(row.payload);
                return (
                  payload?.refundBatchId === batchId &&
                  (!recoveryOnly || payload.recovery === true)
                );
              });
            }

            async function deliverRefundCompleted(payload: unknown) {
              for (const handler of registry.handlersFor('refund.completed')) {
                await handler({
                  id: randomUUID(),
                  tenantId: tenant.id,
                  eventType: 'refund.completed',
                  payload,
                  attempts: 0,
                  createdAt: new Date(),
                });
              }
            }

            // Partial dispute: provider/business completion exists, but delivery is lost.
            const partialBooking = await createBooking('partial-dispute', 'completed');
            const partialPayment = await createManualPayment(partialBooking.id, 500_000n);
            await recordHeld.execute(tenant.id, partialPayment.id);
            await prepareSettlementRefund.execute(tenant.id, partialBooking.id, 200_000n);
            const partialBatch = await completeManualBatch(
              partialBooking.id,
              200_000n,
              'dispute_refund',
              false,
            );
            const pendingSettlement = await prisma.admin.bookingSettlement.findUnique({
              where: { bookingId: partialBooking.id },
            });
            check('partial dispute settlement starts refund_pending', pendingSettlement?.status === 'refund_pending');
            check('partial dispute booking remains completed before delivery', (await prisma.admin.booking.findUnique({ where: { id: partialBooking.id } }))?.status === 'completed');

            const directRecoverableBefore = await batches.findCompletedNeedingRecovery(100);
            check(
              'partial dispute batch selected for recovery while Finance is stale',
              directRecoverableBefore.some((batch) => batch.id === partialBatch.id),
            );

            await reconciliation.sweep();
            const recoveryEvents = await batchCompletionEvents(partialBatch.id, true);
            check('first sweep emits partial dispute batch recovery', recoveryEvents.length === 1);
            const recoveryPayload = recoveryEvents[0]?.payload;
            assert.ok(recoveryPayload, 'partial dispute recovery payload missing');
            await deliverRefundCompleted(recoveryPayload);

            const partialBookingAfter = await prisma.admin.booking.findUnique({
              where: { id: partialBooking.id },
            });
            const partialSettlementAfter = await prisma.admin.bookingSettlement.findUnique({
              where: { bookingId: partialBooking.id },
            });
            check('partial dispute does not change booking status', partialBookingAfter?.status === 'completed');
            check(
              'partial dispute finalizes Finance with business batch id',
              partialSettlementAfter?.refundId === partialBatch.id &&
                partialSettlementAfter.refundedAmount === 200_000n &&
                partialSettlementAfter.status === 'dispute_window',
            );

            const directRecoverableAfter = await batches.findCompletedNeedingRecovery(100);
            check(
              'partial dispute stops being recoverable after Finance converges',
              !directRecoverableAfter.some((batch) => batch.id === partialBatch.id),
            );
            const recoveryCountBeforeSecondSweep = (await batchCompletionEvents(partialBatch.id, true)).length;
            await reconciliation.sweep();
            const recoveryCountAfterSecondSweep = (await batchCompletionEvents(partialBatch.id, true)).length;
            check(
              'second sweep does not replay converged partial dispute batch',
              recoveryCountAfterSecondSweep === recoveryCountBeforeSecondSweep,
            );

            // Security-deposit batches are operational-only for Finance and stay excluded.
            const securityBooking = await createBooking('security', 'completed', 100_000n);
            await createManualPayment(securityBooking.id, 500_000n);
            const securityBatch = await completeManualBatch(
              securityBooking.id,
              100_000n,
              'security_deposit',
              false,
            );
            const securityRecoverable = await batches.findCompletedNeedingRecovery(100);
            check(
              'security-deposit batch is excluded from Finance recovery',
              !securityRecoverable.some((batch) => batch.id === securityBatch.id),
            );
            await reconciliation.sweep();
            check(
              'security-deposit batch emits no batch recovery event',
              (await batchCompletionEvents(securityBatch.id, true)).length === 0,
            );

            // Existing status-changing branch still needs both Booking and Finance convergence.
            const fullBooking = await createBooking('status-changing', 'cancelled');
            const fullPayment = await createManualPayment(fullBooking.id, 500_000n);
            await recordHeld.execute(tenant.id, fullPayment.id);
            await prepareSettlementRefund.execute(tenant.id, fullBooking.id, 300_000n, 'cancellation_fee');
            const fullBatch = await completeManualBatch(
              fullBooking.id,
              300_000n,
              'booking_cancellation',
              true,
            );
            await reconciliation.sweep();
            const fullRecovery = await batchCompletionEvents(fullBatch.id, true);
            check('status-changing batch still emits recovery while stale', fullRecovery.length === 1);
            const fullPayload = fullRecovery[0]?.payload;
            assert.ok(fullPayload, 'status-changing recovery payload missing');
            await deliverRefundCompleted(fullPayload);
            const fullBookingAfter = await prisma.admin.booking.findUnique({ where: { id: fullBooking.id } });
            const fullSettlementAfter = await prisma.admin.bookingSettlement.findUnique({ where: { bookingId: fullBooking.id } });
            check('status-changing recovery still finalizes booking', fullBookingAfter?.status === 'refunded');
            check('status-changing recovery still finalizes Finance', fullSettlementAfter?.refundId === fullBatch.id);
            const fullRecoveryCount = (await batchCompletionEvents(fullBatch.id, true)).length;
            await reconciliation.sweep();
            check(
              'status-changing converged batch also stops replaying',
              (await batchCompletionEvents(fullBatch.id, true)).length === fullRecoveryCount,
            );

            console.log('PARTIAL_DISPUTE_REFUND_RECOVERY_SMOKE=PASS');
            await app.close();
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          TS
          node ./node_modules/ts-node/dist/bin.js --transpile-only pr4-partial-dispute-recovery-smoke.ts
          rm pr4-partial-dispute-recovery-smoke.ts
      - name: Cleanup
        if: always()
        run: rm -f apps/api/pr4-partial-dispute-recovery-smoke.ts
