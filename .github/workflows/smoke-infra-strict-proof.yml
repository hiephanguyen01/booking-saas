name: Smoke Infra Strict Proof

on:
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict staging-parity smoke invariants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('scripts/smoke-infra-local.mjs', 'utf8');
          const checks = [
            ['schema-derived tenant table set', /function\s+tenantScopedTables\s*\(/],
            ['RLS fails on any offender', /rlsOffenders\.length\s*===\s*0/],
            ['AES-256-GCM decrypt verification', /createDecipheriv\(\s*["']aes-256-gcm["']/],
            ['12-byte GCM IV verification', /iv\.length\s*===\s*12/],
            ['16-byte GCM auth tag verification', /tag\.length\s*===\s*16/],
            ['ephemeral Caddy network harness', /dockerArgs\(\s*["']network["']\s*,\s*["']create["']/],
            ['production Caddyfile local-CA probe', /local_certs/],
            ['runtime HTTPS request through Caddy', /httpsGetViaCaddy\s*\(/],
            ['Caddy upstream route marker check', /x-smoke-upstream/],
          ];
          const failed = checks.filter(([, re]) => !re.test(src));
          for (const [name] of checks) console.log(`${failed.some(([n]) => n === name) ? 'FAIL' : 'PASS'}: ${name}`);
          if (failed.length) {
            console.error(`Strict proof failed ${failed.length}/${checks.length}: ${failed.map(([n]) => n).join(', ')}`);
            process.exit(1);
          }
          NODE
