name: Agent Checkout Routing GREEN Patch

on:
  push:
    branches:
      - refactor/payment-provider-routing-separation
    paths:
      - .github/workflows/agent-checkout-routing-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/payment-provider-routing-separation
          fetch-depth: 0
      - name: Patch payment persistence and checkout spec harness
        run: python scripts/agent-patch-checkout-routing-green.py
      - name: Remove one-shot helpers
        run: rm scripts/agent-patch-checkout-routing-green.py .github/workflows/agent-checkout-routing-green.yml
      - name: Commit GREEN support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(payments): migrate checkout harness to explicit routing"
          git push origin HEAD:refactor/payment-provider-routing-separation
