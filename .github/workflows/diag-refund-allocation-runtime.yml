name: Refund Allocation Runtime Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-db-runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/refund-allocation'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      PAYMENTS_ENC_KEY: pr4-runtime-smoke-encryption-key-change-me
      OUTBOX_RELAY_DISABLED: 'true'
      ALLOW_MOCK_PAYMENTS: 'true'
      NODE_ENV: test
      PORT: '18080'
      PUBLIC_API_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refund-allocation
          fetch-depth: 2
      - name: Record exact tested head
        run: echo "refund_allocation_head=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply hand-written migration and seed
        run: |
          cp .env.example .env
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate
          pnpm --filter=@booking/api seed
      - name: Current-repo static gate
        env:
          ALLOW_MOCK_PAYMENTS: 'false'
        run: |
          pnpm test
          pnpm turbo run lint typecheck build
      - name: Start API and verify health
        run: |
          pnpm --filter=@booking/api start >/tmp/pr4-api.log 2>&1 &
          echo $! >/tmp/pr4-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              echo 'local_api_ready=true'
              exit 0
            fi
            sleep 1
          done
          tail -n 120 /tmp/pr4-api.log || true
          exit 1
      - name: Run real-DB refund allocation scenarios
        working-directory: apps/api
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/diag-refund-allocation-runtime.yml'],
              cwd='../..',
              text=True,
          )
          start_marker = "          cat > pr4-refund-runtime-smoke.ts <<'TS'\n"
          end_marker = "\n          TS\n"
          if source.count(start_marker) != 1:
              raise SystemExit(f'expected one runtime-script start marker, found {source.count(start_marker)}')
          after = source.split(start_marker, 1)[1]
          if after.count(end_marker) != 1:
              raise SystemExit(f'expected one runtime-script end marker, found {after.count(end_marker)}')
          body = after.split(end_marker, 1)[0]
          lines = body.splitlines()
          if not lines or any(not line.startswith('          ') for line in lines if line):
              raise SystemExit('unexpected runtime-script indentation in parent diagnostic workflow')
          rendered = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          if "REFUND_ALLOCATION_RUNTIME_SMOKE=PASS" not in rendered:
              raise SystemExit('runtime smoke completion marker missing from extracted script')
          Path('pr4-refund-runtime-smoke.ts').write_text(rendered)
          print('runtime_scenarios_extracted_from_parent=true')
          PY
          node ./node_modules/ts-node/dist/bin.js --transpile-only pr4-refund-runtime-smoke.ts
          rm pr4-refund-runtime-smoke.ts
      - name: Cleanup
        if: always()
        run: |
          rm -f apps/api/pr4-refund-runtime-smoke.ts
          if [ -f /tmp/pr4-api.pid ]; then kill "$(cat /tmp/pr4-api.pid)" 2>/dev/null || true; fi
