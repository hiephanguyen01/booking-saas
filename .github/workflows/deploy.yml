name: Deploy

# Manual only. The BRANCH is the ref you pick in the "Use workflow from" dropdown
# (or `gh workflow run --ref`), so it is not repeated as an input.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [stg, prod]
        required: true
        default: stg
      app:
        description: Which app to deploy
        type: choice
        options: [all, api, frontends, storefront, dashboard]
        required: true
        default: all
      run_migrations:
        description: Run `prisma migrate deploy` before starting (api / all only)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# One deploy per environment at a time. Never cancel a running one — it may be
# mid-migration.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        app: ${{ inputs.app == 'all' && fromJSON('["api","storefront","dashboard"]') || inputs.app == 'frontends' && fromJSON('["storefront","dashboard"]') || fromJSON(format('["{0}"]', inputs.app)) }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # The deploy targets t3 (x86), which is also what GitHub's runners are, so
      # this builds NATIVELY — no QEMU step, and none wanted: emulated builds of
      # this repo are both far slower and observably flakier (turbo has failed
      # mid-build under emulation).
      #
      # Moving to a Graviton box means `linux/arm64` here plus a
      # `docker/setup-qemu-action` step — unless the runner is ARM too, in which
      # case it stays native and only `platforms` changes.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          # Immutable sha tag is what the server pins to; the moving env tag is
          # only for humans reading `docker images`.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bookingos-${{ matrix.app }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/bookingos-${{ matrix.app }}:${{ inputs.environment }}
          # Scope carries the arch: switching platforms must not reuse the other
          # architecture's layers.
          cache-from: type=gha,scope=${{ matrix.app }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # `prod` should carry required reviewers in Settings → Environments, which is
    # what turns this into an approval gate. `stg` runs straight through.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # Catch a broken Caddyfile HERE, not on the box mid-deploy: a config Caddy
      # refuses to load means the container crashloops and takes public 80/443
      # down with it. Values are dummies — this only checks syntax, and empty
      # placeholders would fail as an empty site address.
      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            -e ACME_EMAIL=ops@example.com \
            -e DASHBOARD_HOST=admin.example.com \
            -e API_HOST=api.example.com \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # The box holds no checkout, so without this every compose or Caddy change
      # would be a manual scp somebody eventually forgets — and a deploy that
      # "succeeded" would silently keep running the previous topology.
      # `.env.<env>` is deliberately NOT synced: it holds the secrets and the
      # image pins this workflow rewrites in place.
      - name: Sync deploy config to the box
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          target: ${{ secrets.DEPLOY_PATH }}
          # COMMA-SEPARATED, one line. drone-scp reads this as a urfave/cli
          # StringSlice from the environment, which splits on `,` and nothing
          # else — a YAML block scalar arrives as one string containing newlines,
          # matches no file, and fails as "tar: Cowardly refusing to create an
          # empty archive". Relative paths are preserved on extraction, so
          # docker/... lands under DEPLOY_PATH/docker/...
          source: 'docker-compose.deploy.yml,docker-compose.stg-data.yml,docker/caddy/Caddyfile'
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ needs.build.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          MIGRATE: ${{ inputs.run_migrations }}
          # GITHUB_TOKEN is only valid inside the runner, so the box pulls with a
          # separate read:packages PAT.
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP,ENVIRONMENT,TAG,OWNER,MIGRATE,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            ENV_FILE=".env.${ENVIRONMENT}"
            if [ "$ENVIRONMENT" = "stg" ]; then
              COMPOSE="docker compose --env-file ${ENV_FILE} -f docker-compose.deploy.yml -f docker-compose.stg-data.yml"
            else
              COMPOSE="docker compose --env-file ${ENV_FILE} -f docker-compose.deploy.yml"
            fi

            test -f "$ENV_FILE" || { echo "::error::${ENV_FILE} missing on the server"; exit 1; }
            if [ "$ENVIRONMENT" = "stg" ]; then
              test -f docker-compose.stg-data.yml || {
                echo "::error::docker-compose.stg-data.yml missing on the staging server"
                exit 1
              }
            fi

            # Did the config the previous step just synced actually change? A
            # bind-mounted file changing content is invisible to compose — the
            # mount path is identical — so `up -d` alone would leave Caddy serving
            # the routes it loaded at its last start. Recreating on every deploy
            # instead would mean needless seconds of downtime at the edge, so
            # compare and only act when something moved.
            CONFIG_SUM=$(
              for f in docker-compose.deploy.yml docker-compose.stg-data.yml \
                       docker/caddy/Caddyfile; do
                if [ -f "$f" ]; then sha256sum "$f"; fi
              done | sha256sum | cut -d' ' -f1
            )
            CONFIG_CHANGED=true
            if [ -f .deploy-config.sha ] && [ "$(cat .deploy-config.sha)" = "$CONFIG_SUM" ]; then
              CONFIG_CHANGED=false
            fi
            echo "config changed: ${CONFIG_CHANGED}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin

            # Pin the env file to this exact digest-stable tag, so a later manual
            # `up -d` on the box runs the SAME image this deploy shipped.
            pin() {
              local var="$1" app="$2"
              local image="ghcr.io/${OWNER_LC}/bookingos-${app}:${TAG}"
              if grep -q "^${var}=" "$ENV_FILE"; then
                sed -i "s|^${var}=.*|${var}=${image}|" "$ENV_FILE"
              else
                echo "${var}=${image}" >> "$ENV_FILE"
              fi
            }
            case "$APP" in
              all)        pin API_IMAGE api; pin STOREFRONT_IMAGE storefront; pin DASHBOARD_IMAGE dashboard ;;
              api)        pin API_IMAGE api ;;
              frontends)  pin STOREFRONT_IMAGE storefront; pin DASHBOARD_IMAGE dashboard ;;
              storefront) pin STOREFRONT_IMAGE storefront ;;
              dashboard)  pin DASHBOARD_IMAGE dashboard ;;
            esac

            # Pull only the images shipped by this run. Pulling the whole stack
            # wastes registry traffic and checks unrelated services.
            case "$APP" in
              all)        $COMPOSE pull ;;
              api)        $COMPOSE pull api ;;
              frontends)  $COMPOSE pull storefront dashboard ;;
              storefront) $COMPOSE pull storefront ;;
              dashboard)  $COMPOSE pull dashboard ;;
            esac

            # Run migrations explicitly rather than leaning on depends_on: an
            # already-exited migrate container counts as "completed", so compose
            # would skip it and start the API against an un-migrated schema.
            if [ "$MIGRATE" = "true" ] && { [ "$APP" = "all" ] || [ "$APP" = "api" ]; }; then
              $COMPOSE run --rm migrate
            fi

            case "$APP" in
              all)        $COMPOSE up -d ;;
              frontends)  $COMPOSE up -d storefront dashboard ;;
              *)          $COMPOSE up -d "$APP" ;;
            esac

            # An `app=api` deploy never touches the edge, so it is recreated here
            # on its own terms. Force, because the Caddyfile is a bind mount:
            # compose sees an identical mount path and Caddy reads its config only
            # at load, so `up -d` alone would keep serving the previous routes.
            if [ "$CONFIG_CHANGED" = "true" ]; then
              # --remove-orphans retires containers whose service was DELETED from
              # the compose file. That is how the old `nginx` goes away on a box
              # deployed before Caddy took over routing — left alone it keeps
              # running and holding its published ports. (`compose rm nginx` cannot
              # do this: the service no longer exists to name.)
              echo "recreating edge: caddy"
              $COMPOSE up -d --remove-orphans --force-recreate caddy
              echo "$CONFIG_SUM" > .deploy-config.sha
            fi

            $COMPOSE ps

      - name: Explain a failed deploy
        if: failure()
        run: |
          echo "::warning::Deploy failed. The env file on the server may already be pinned to ${{ needs.build.outputs.tag }} while the old containers keep running. Re-run this workflow, or roll back by pinning the previous tag and running 'docker compose ... up -d' on the box."
