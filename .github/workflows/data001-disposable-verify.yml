name: DATA-001 Disposable Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data001-disposable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      PORT: 3000
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      PLATFORM_BASE_DOMAIN: bookingos.vn
      PAYMENTS_ENC_KEY: dev-payments-encryption-key-change-me
      ALLOW_MOCK_PAYMENTS: 'true'
      SESSION_SECRET_CURRENT: dev-session-secret-change-me-min-32-chars-long
      SESSION_COOKIE_SECURE: 'false'
      PUBLIC_API_URL: http://127.0.0.1:3000
      BACKEND_URL: http://127.0.0.1:3000
      DASHBOARD_URL: http://127.0.0.1:5174
      DASHBOARD_HOST: localhost
      PLATFORM_STOREFRONT_URL: http://127.0.0.1:5173
      EMAIL_FROM: no-reply@bookingos.vn
      OUTBOX_RELAY_DISABLED: 'false'
      NOTIFICATION_REMINDER_DISABLED: 'true'
      BOOKING_SCHEDULER_DISABLED: 'true'
      SETTLEMENT_RELEASE_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
          psql --version
          redis-cli --version

      - name: Prepare disposable database and seed
        run: |
          set -euo pipefail
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api seed

      - name: Run static gates missing from normal CI
        run: |
          set -euo pipefail
          pnpm check:no-tests
          pnpm check:module-cycles
          pnpm --filter=@booking/api lint
          pnpm --filter=@booking/api typecheck
          pnpm --filter=@booking/api build
          pnpm --filter=@booking/api check:rls
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Start API
        run: |
          set -euo pipefail
          pnpm --filter=@booking/api start > /tmp/data001-api.log 2>&1 &
          echo $! > /tmp/data001-api.pid
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null http://127.0.0.1:3000/__data001_ready_probe__; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/data001-api.log
          exit 1

      - name: Run DATA-001 disposable smoke
        shell: bash
        run: |
          set -euo pipefail
          API_BASE=http://127.0.0.1:3000
          DATA001_PASSWORD='SmokePass123'

          seed_completion() {
            local token="$1"
            local payload="$2"
            local digest
            digest="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
            redis-cli -u "$REDIS_URL" SET "identity:auth-completion:${digest}" "$payload" EX 1200 >/dev/null
            printf '%s\n' "$digest"
          }

          post_json() {
            local path="$1"
            local body="$2"
            local outfile="$3"
            curl -sS -o "$outfile" -w '%{http_code}' -X POST "$API_BASE$path" \
              -H 'content-type: application/json' \
              --data "$body"
          }

          sql_scalar() {
            psql "$MIGRATE_DATABASE_URL" -Atc "$1"
          }

          echo 'CASE 1: non-tenant happy path'
          REG_EMAIL="data001-happy-${GITHUB_RUN_ID}@example.com"
          REG_TOKEN='data001-happy-completion-token-000001'
          REG_PAYLOAD="{\"purpose\":\"registration\",\"email\":\"${REG_EMAIL}\",\"fullName\":\"DATA001 Happy\",\"locale\":\"vi\"}"
          REG_DIGEST="$(seed_completion "$REG_TOKEN" "$REG_PAYLOAD")"
          CODE="$(post_json /auth/registration/complete "{\"completionToken\":\"${REG_TOKEN}\",\"password\":\"${DATA001_PASSWORD}\"}" /tmp/data001-happy.json)"
          test "$CODE" = 200
          test "$(redis-cli -u "$REDIS_URL" EXISTS "identity:auth-completion:${REG_DIGEST}")" = 0
          test "$(sql_scalar "select count(*) from users where email='${REG_EMAIL}';")" = 1

          echo 'CASE 2: derive real tenant and published legal versions'
          ROW="$(psql "$MIGRATE_DATABASE_URL" -At -F '|' -c "
            SELECT
              d.tenant_id,
              max(d.current_version_id::text) FILTER (WHERE d.doc_type = 'customer_terms'),
              max(d.current_version_id::text) FILTER (WHERE d.doc_type = 'privacy_policy')
            FROM legal_documents d
            JOIN legal_document_versions v
              ON v.id = d.current_version_id
             AND v.published_at IS NOT NULL
            WHERE d.doc_type IN ('customer_terms', 'privacy_policy')
            GROUP BY d.tenant_id
            HAVING count(*) = 2
            LIMIT 1;")"
          IFS='|' read -r TENANT_ID CUSTOMER_TERMS_ID PRIVACY_ID <<< "$ROW"
          test -n "$TENANT_ID"
          test -n "$CUSTOMER_TERMS_ID"
          test -n "$PRIVACY_ID"
          VERSION_IDS_JSON="[\"${CUSTOMER_TERMS_ID}\",\"${PRIVACY_ID}\"]"

          echo 'CASE 3: forced outbox failure rolls back user and preserves token'
          psql "$MIGRATE_DATABASE_URL" <<'SQL'
          CREATE OR REPLACE FUNCTION smoke_fail_registration_consent()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            IF NEW.event_type = 'user.registration_consent' THEN
              RAISE EXCEPTION 'DATA001 forced registration-consent failure';
            END IF;
            RETURN NEW;
          END;
          $$;
          DROP TRIGGER IF EXISTS smoke_fail_registration_consent ON outbox_events;
          CREATE TRIGGER smoke_fail_registration_consent
          BEFORE INSERT ON outbox_events
          FOR EACH ROW EXECUTE FUNCTION smoke_fail_registration_consent();
          SQL
          ROLLBACK_EMAIL="data001-rollback-${GITHUB_RUN_ID}@example.com"
          ROLLBACK_TOKEN='data001-rollback-completion-token-0001'
          ROLLBACK_PAYLOAD="{\"purpose\":\"registration\",\"email\":\"${ROLLBACK_EMAIL}\",\"fullName\":\"DATA001 Rollback\",\"locale\":\"vi\",\"tenantId\":\"${TENANT_ID}\",\"acceptedVersionIds\":${VERSION_IDS_JSON},\"acceptedLocale\":\"vi\"}"
          ROLLBACK_DIGEST="$(seed_completion "$ROLLBACK_TOKEN" "$ROLLBACK_PAYLOAD")"
          CODE="$(post_json /auth/registration/complete "{\"completionToken\":\"${ROLLBACK_TOKEN}\",\"password\":\"${DATA001_PASSWORD}\"}" /tmp/data001-rollback-fail.json)"
          test "$CODE" -ge 500
          test "$(sql_scalar "select count(*) from users where email='${ROLLBACK_EMAIL}';")" = 0
          test "$(redis-cli -u "$REDIS_URL" EXISTS "identity:auth-completion:${ROLLBACK_DIGEST}")" = 1
          psql "$MIGRATE_DATABASE_URL" <<'SQL'
          DROP TRIGGER IF EXISTS smoke_fail_registration_consent ON outbox_events;
          DROP FUNCTION IF EXISTS smoke_fail_registration_consent();
          SQL
          CODE="$(post_json /auth/registration/complete "{\"completionToken\":\"${ROLLBACK_TOKEN}\",\"password\":\"${DATA001_PASSWORD}\"}" /tmp/data001-rollback-retry.json)"
          test "$CODE" = 200
          test "$(sql_scalar "select count(*) from users where email='${ROLLBACK_EMAIL}';")" = 1
          test "$(redis-cli -u "$REDIS_URL" EXISTS "identity:auth-completion:${ROLLBACK_DIGEST}")" = 0

          echo 'CASE 4: cleanup failure after durable commit and retry reconciliation'
          CLEANUP_EMAIL="data001-cleanup-${GITHUB_RUN_ID}@example.com"
          CLEANUP_TOKEN='data001-cleanup-completion-token-0001'
          CLEANUP_PAYLOAD="{\"purpose\":\"registration\",\"email\":\"${CLEANUP_EMAIL}\",\"fullName\":\"DATA001 Cleanup\",\"locale\":\"vi\",\"tenantId\":\"${TENANT_ID}\",\"acceptedVersionIds\":${VERSION_IDS_JSON},\"acceptedLocale\":\"vi\"}"
          CLEANUP_DIGEST="$(seed_completion "$CLEANUP_TOKEN" "$CLEANUP_PAYLOAD")"
          redis-cli -u "$REDIS_URL" ACL SETUSER default -getdel >/dev/null
          trap 'redis-cli -u "$REDIS_URL" ACL SETUSER default +getdel >/dev/null 2>&1 || true; psql "$MIGRATE_DATABASE_URL" -c "DROP TRIGGER IF EXISTS smoke_fail_registration_consent ON outbox_events; DROP FUNCTION IF EXISTS smoke_fail_registration_consent();" >/dev/null 2>&1 || true' EXIT
          CODE="$(post_json /auth/registration/complete "{\"completionToken\":\"${CLEANUP_TOKEN}\",\"password\":\"${DATA001_PASSWORD}\"}" /tmp/data001-cleanup-first.json)"
          test "$CODE" = 200
          test "$(sql_scalar "select count(*) from users where email='${CLEANUP_EMAIL}';")" = 1
          test "$(redis-cli -u "$REDIS_URL" EXISTS "identity:auth-completion:${CLEANUP_DIGEST}")" = 1
          redis-cli -u "$REDIS_URL" ACL SETUSER default +getdel >/dev/null
          CODE="$(post_json /auth/registration/complete "{\"completionToken\":\"${CLEANUP_TOKEN}\",\"password\":\"${DATA001_PASSWORD}\"}" /tmp/data001-cleanup-retry.json)"
          test "$CODE" = 200
          test "$(sql_scalar "select count(*) from users where email='${CLEANUP_EMAIL}';")" = 1
          test "$(redis-cli -u "$REDIS_URL" EXISTS "identity:auth-completion:${CLEANUP_DIGEST}")" = 0
          ! grep -F "$CLEANUP_TOKEN" /tmp/data001-api.log
          ! grep -F "$DATA001_PASSWORD" /tmp/data001-api.log
          grep -F 'registration completed durably but completion-token cleanup failed' /tmp/data001-api.log

          echo 'CASE 5: unrelated existing account returns EMAIL_TAKEN and preserves password'
          CONFLICT_EMAIL="data001-conflict-${GITHUB_RUN_ID}@example.com"
          CODE="$(post_json /auth/register "{\"email\":\"${CONFLICT_EMAIL}\",\"password\":\"ExistingPass123\",\"fullName\":\"Existing Account\",\"locale\":\"vi\"}" /tmp/data001-register-existing.json)"
          test "$CODE" = 201 -o "$CODE" = 200
          CONFLICT_TOKEN='data001-conflict-completion-token-0001'
          CONFLICT_PAYLOAD="{\"purpose\":\"registration\",\"email\":\"${CONFLICT_EMAIL}\",\"fullName\":\"Conflict Attempt\",\"locale\":\"vi\"}"
          seed_completion "$CONFLICT_TOKEN" "$CONFLICT_PAYLOAD" >/dev/null
          CODE="$(post_json /auth/registration/complete "{\"completionToken\":\"${CONFLICT_TOKEN}\",\"password\":\"DifferentPass123\"}" /tmp/data001-conflict.json)"
          test "$CODE" = 409
          grep -F 'EMAIL_TAKEN' /tmp/data001-conflict.json
          CODE="$(post_json /auth/login "{\"email\":\"${CONFLICT_EMAIL}\",\"password\":\"ExistingPass123\"}" /tmp/data001-conflict-login.json)"
          test "$CODE" = 200

          echo 'CASE 6: concurrent same-token completion yields one user'
          CONCURRENT_EMAIL="data001-concurrent-${GITHUB_RUN_ID}@example.com"
          CONCURRENT_TOKEN='data001-concurrent-completion-token-0001'
          CONCURRENT_PAYLOAD="{\"purpose\":\"registration\",\"email\":\"${CONCURRENT_EMAIL}\",\"fullName\":\"DATA001 Concurrent\",\"locale\":\"vi\"}"
          seed_completion "$CONCURRENT_TOKEN" "$CONCURRENT_PAYLOAD" >/dev/null
          for i in 1 2; do
            curl -sS -o "/tmp/data001-concurrent-${i}.json" -w '%{http_code}' \
              -X POST "$API_BASE/auth/registration/complete" \
              -H 'content-type: application/json' \
              --data "{\"completionToken\":\"${CONCURRENT_TOKEN}\",\"password\":\"${DATA001_PASSWORD}\"}" \
              > "/tmp/data001-concurrent-${i}.code" &
          done
          wait
          test "$(sql_scalar "select count(*) from users where email='${CONCURRENT_EMAIL}';")" = 1
          for i in 1 2; do
            CODE="$(cat "/tmp/data001-concurrent-${i}.code")"
            test "$CODE" = 200 -o "$CODE" = 410
          done

          echo 'CASE 7: password-reset completion remains destructive'
          RESET_USER_ID="$(sql_scalar "select id from users where email='${CONFLICT_EMAIL}';")"
          RESET_TOKEN='data001-password-reset-completion-0001'
          RESET_PAYLOAD="{\"purpose\":\"password_reset\",\"email\":\"${CONFLICT_EMAIL}\",\"locale\":\"vi\",\"userId\":\"${RESET_USER_ID}\"}"
          seed_completion "$RESET_TOKEN" "$RESET_PAYLOAD" >/dev/null
          CODE="$(post_json /auth/password-reset/complete "{\"completionToken\":\"${RESET_TOKEN}\",\"password\":\"ResetPass123\"}" /tmp/data001-reset-first.json)"
          test "$CODE" = 200
          CODE="$(post_json /auth/password-reset/complete "{\"completionToken\":\"${RESET_TOKEN}\",\"password\":\"ResetPass123\"}" /tmp/data001-reset-second.json)"
          test "$CODE" = 410

          echo 'CASE 8: eventual legal acceptance for tenant-scoped registration'
          CONSENT_USER_ID="$(sql_scalar "select id from users where email='${ROLLBACK_EMAIL}';")"
          ACCEPTED=0
          for i in $(seq 1 40); do
            ACCEPTED="$(sql_scalar "select count(distinct document_version_id) from agreement_acceptances where user_id='${CONSENT_USER_ID}' and tenant_id='${TENANT_ID}' and document_version_id in ('${CUSTOMER_TERMS_ID}','${PRIVACY_ID}') and accepted_locale='vi';")"
            if [ "$ACCEPTED" = 2 ]; then
              break
            fi
            sleep 1
          done
          test "$ACCEPTED" = 2

          echo 'CASE 9: fault injection fully reverted'
          test -z "$(sql_scalar "select tgname from pg_trigger where tgname='smoke_fail_registration_consent';")"
          redis-cli -u "$REDIS_URL" ACL GETUSER default | grep -E '(^| )\+@all|\+getdel' >/dev/null
          trap - EXIT

          echo 'DATA-001 disposable smoke: PASS'

      - name: Show API log on failure
        if: failure()
        run: |
          cat /tmp/data001-api.log 2>/dev/null || true
          for f in /tmp/data001-*.json /tmp/data001-*.code; do
            if [ -f "$f" ]; then
              echo "--- $f"
              cat "$f"
              echo
            fi
          done

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/data001-api.pid ]; then
            kill "$(cat /tmp/data001-api.pid)" 2>/dev/null || true
          fi
