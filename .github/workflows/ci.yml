name: Frontend CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:no-tests
      - run: pnpm check:module-cycles
      - run: pnpm check:frontend-structure
      - run: pnpm --filter=@booking/storefront security
      - name: API typecheck
        # Run through Turbo so workspace dependencies such as contracts are
        # built once and reused by the frontend checks below.
        run: pnpm turbo run typecheck --filter=@booking/api
      - name: Frontend lint and typecheck
        run: pnpm turbo run lint typecheck --filter=@booking/storefront --filter=@booking/dashboard
      - name: Frontend production builds
        # Keep this separate from typecheck: React Router typegen and build both
        # write generated route files and should not race within the same app.
        run: pnpm turbo run build --filter=@booking/storefront --filter=@booking/dashboard
      # Static RLS coverage: every tenant_id table has FORCE RLS + policy in migrations (no DB needed)
      - run: pnpm --filter=@booking/api check:rls
