name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Prisma generate validates that its datasource URL exists but does not
      # connect to PostgreSQL during lint/typecheck/build.
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@booking/storefront security
      - id: quality-check
        continue-on-error: true
        run: pnpm turbo run lint typecheck build --filter=@booking/storefront --filter=@booking/dashboard --filter=@booking/api > quality-diagnostics.log 2>&1
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: quality-diagnostics.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when quality check failed
        if: steps.quality-check.outcome == 'failure'
        run: exit 1
      # Static RLS coverage: every tenant_id table has FORCE RLS + policy in migrations (no DB needed)
      - run: pnpm --filter=@booking/api check:rls

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          tags: booking-storefront:ci
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          tags: booking-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
