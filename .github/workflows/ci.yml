name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@booking/storefront security
      - name: Storefront lint
        run: pnpm turbo run lint --filter=@booking/storefront
      - name: Storefront typecheck
        id: storefront_typecheck
        continue-on-error: true
        run: pnpm turbo run typecheck --filter=@booking/storefront > storefront-typecheck.log 2>&1
      - name: Upload storefront typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-typecheck-log
          path: storefront-typecheck.log
          retention-days: 1
      - name: Fail on storefront typecheck error
        if: steps.storefront_typecheck.outcome == 'failure'
        run: exit 1
      - name: Storefront build
        run: pnpm turbo run build --filter=@booking/storefront
      - name: Dashboard lint
        run: pnpm turbo run lint --filter=@booking/dashboard
      - name: Dashboard typecheck
        run: pnpm turbo run typecheck --filter=@booking/dashboard
      - name: Dashboard build
        run: pnpm turbo run build --filter=@booking/dashboard
      # Static RLS coverage: every tenant_id table has FORCE RLS + policy in migrations (no DB needed)
      - run: pnpm --filter=@booking/api check:rls

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          tags: booking-storefront:ci
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          tags: booking-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
