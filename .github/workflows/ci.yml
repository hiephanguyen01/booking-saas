name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@booking/storefront security
      - run: pnpm --filter=@booking/contracts build
      - name: Storefront baseline security tests
        run: >-
          pnpm --filter=@booking/storefront exec node --experimental-strip-types --test
          app/lib/tenant-availability.test.ts app/lib/refresh-lock.server.test.ts
      - name: Storefront date-range tests
        run: >-
          pnpm --filter=@booking/storefront exec node --experimental-strip-types
          --experimental-specifier-resolution=node --test app/lib/daily-range.test.ts
      - name: Storefront optional-data tests
        run: >-
          pnpm --filter=@booking/storefront exec node --experimental-strip-types --test
          app/lib/optional-data.server.test.ts
      - name: Storefront search-input tests
        run: >-
          pnpm --filter=@booking/storefront exec node --experimental-strip-types
          --experimental-specifier-resolution=node --test app/features/search/search-state.test.ts
      - run: pnpm turbo run lint typecheck build --filter=@booking/storefront --filter=@booking/dashboard
      # Static RLS coverage: every tenant_id table has FORCE RLS + policy in migrations (no DB needed)
      - run: pnpm --filter=@booking/api check:rls

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          tags: booking-storefront:ci
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          tags: booking-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
