name: SEC-001 Disposable Seed Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec001-disposable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      PLATFORM_BASE_DOMAIN: bookingos.vn
      S3_PUBLIC_URL: http://127.0.0.1:9000/bookingos

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Prepare disposable database
        run: |
          set -euo pipefail
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate

      - name: Run SEC-001 seed smoke
        shell: bash
        run: |
          set -euo pipefail

          data_rows() {
            local total=0
            local table
            local count
            while IFS= read -r table; do
              count="$(psql "$MIGRATE_DATABASE_URL" -Atc "select count(*) from public.\"${table}\";")"
              total=$((total + count))
            done < <(psql "$MIGRATE_DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' and tablename <> '_prisma_migrations' order by tablename;")
            printf '%s\n' "$total"
          }

          verify_hash() {
            local hash="$1"
            local password="$2"
            HASH="$hash" PASSWORD="$password" pnpm --filter=@booking/api exec node -e "const argon2=require('argon2'); argon2.verify(process.env.HASH, process.env.PASSWORD).then(ok=>process.exit(ok?0:1)).catch(()=>process.exit(2));"
          }

          BASE_ROWS="$(data_rows)"

          echo 'CASE 1: tenants scope without platform-admin credentials fails before DB writes'
          set +e
          env -u SEED_ADMIN_EMAIL -u SEED_ADMIN_PASSWORD -u SEED_OWNER_PASSWORD \
            SEED_SCOPE=tenants \
            pnpm --filter=@booking/api seed > /tmp/sec001-case1.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -F 'SEED_ADMIN_EMAIL is required when SEED_SCOPE=tenants' /tmp/sec001-case1.log
          test "$(data_rows)" = "$BASE_ROWS"

          echo 'CASE 2: tenants scope without owner password fails before DB writes'
          set +e
          env -u SEED_OWNER_PASSWORD \
            SEED_SCOPE=tenants \
            SEED_ADMIN_EMAIL=sec001-preflight@example.com \
            SEED_ADMIN_PASSWORD='Sec001PreflightAdmin123!' \
            pnpm --filter=@booking/api seed > /tmp/sec001-case2.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -F 'SEED_OWNER_PASSWORD is required when SEED_SCOPE=tenants' /tmp/sec001-case2.log
          test "$(data_rows)" = "$BASE_ROWS"

          echo 'CASE 3A: shared development admin email is rejected before DB writes'
          set +e
          SEED_SCOPE=tenants \
            SEED_ADMIN_EMAIL=admin@bookingos.local \
            SEED_ADMIN_PASSWORD='Sec001SafeAdmin123!' \
            SEED_OWNER_PASSWORD='Sec001Owner123!' \
            pnpm --filter=@booking/api seed > /tmp/sec001-case3a.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -F 'SEED_ADMIN_EMAIL must not use the shared development account admin@bookingos.local' /tmp/sec001-case3a.log
          test "$(data_rows)" = "$BASE_ROWS"

          echo 'CASE 3B: shared development admin password is rejected before DB writes'
          set +e
          SEED_SCOPE=tenants \
            SEED_ADMIN_EMAIL=sec001-safe@example.com \
            SEED_ADMIN_PASSWORD=admin-dev-password \
            SEED_OWNER_PASSWORD='Sec001Owner123!' \
            pnpm --filter=@booking/api seed > /tmp/sec001-case3b.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -F 'SEED_ADMIN_PASSWORD must not use the shared development password' /tmp/sec001-case3b.log
          test "$(data_rows)" = "$BASE_ROWS"

          echo 'CASE 4: full/dev seed remains one-command and uses existing defaults'
          env -u SEED_SCOPE -u SEED_ADMIN_EMAIL -u SEED_ADMIN_PASSWORD -u SEED_OWNER_PASSWORD -u SEED_DEMO_PASSWORD \
            pnpm --filter=@booking/api seed > /tmp/sec001-case4.log 2>&1
          DEFAULT_HASH="$(psql "$MIGRATE_DATABASE_URL" -Atc "select password_hash from users where email='admin@bookingos.local';")"
          test -n "$DEFAULT_HASH"
          verify_hash "$DEFAULT_HASH" 'admin-dev-password'

          echo 'CASE 5: production-shaped seed rotates legacy default-password Super Admin'
          PROD_EMAIL="sec001-prod-${GITHUB_RUN_ID}@example.com"
          PROD_PASSWORD="Sec001Prod-${GITHUB_RUN_ID}-Admin!"
          OWNER_PASSWORD="Sec001Prod-${GITHUB_RUN_ID}-Owner!"
          SEED_SCOPE=tenants \
            SEED_ADMIN_EMAIL="$PROD_EMAIL" \
            SEED_ADMIN_PASSWORD="$PROD_PASSWORD" \
            SEED_OWNER_PASSWORD="$OWNER_PASSWORD" \
            pnpm --filter=@booking/api seed > /tmp/sec001-case5.log 2>&1
          grep -F 'Rotated 1 Super Admin account(s) away from the shared development password.' /tmp/sec001-case5.log

          LEGACY_HASH_AFTER="$(psql "$MIGRATE_DATABASE_URL" -Atc "select password_hash from users where email='admin@bookingos.local';")"
          PROD_HASH="$(psql "$MIGRATE_DATABASE_URL" -Atc "select password_hash from users where email='${PROD_EMAIL}';")"
          test -n "$LEGACY_HASH_AFTER"
          test -n "$PROD_HASH"
          if verify_hash "$LEGACY_HASH_AFTER" 'admin-dev-password'; then
            echo 'legacy Super Admin still accepts admin-dev-password' >&2
            exit 1
          fi
          verify_hash "$LEGACY_HASH_AFTER" "$PROD_PASSWORD"
          verify_hash "$PROD_HASH" "$PROD_PASSWORD"

          echo 'SEC-001 disposable seed smoke passed.'
