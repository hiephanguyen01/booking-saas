name: MoMo proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: MoMo contract proof
        shell: bash
        run: |
          cat > apps/api/src/modules/payments/infrastructure/gateways/.momo-proof.ts <<'TS'
          import { createHash, createHmac } from 'node:crypto';
          import { MomoGatewayAdapter } from './momo-gateway.adapter';

          const failures: string[] = [];
          const check = (condition: unknown, message: string): void => {
            if (!condition) failures.push(message);
          };
          const equal = (actual: unknown, expected: unknown, message: string): void => {
            if (actual !== expected) failures.push(`${message}: expected=${String(expected)} actual=${String(actual)}`);
          };
          const momoId = (prefix: 'MO' | 'MC' | 'MQ' | 'RF' | 'RR' | 'RQ', value: string): string =>
            `${prefix}${createHash('sha256').update(`${prefix}:${value}`).digest('hex').slice(0, 32)}`;
          const sign = (raw: string): string => createHmac('sha256', 'secret').update(raw).digest('hex');
          const json = (body: unknown, status = 200): Response =>
            new Response(JSON.stringify(body), { status, headers: { 'content-type': 'application/json' } });

          type Captured = { url: string; init: RequestInit; body: Record<string, unknown> };
          const captured: Captured[] = [];
          const responders: Array<(url: string, init: RequestInit) => Response> = [];
          globalThis.fetch = (async (input: RequestInfo | URL, init: RequestInit = {}) => {
            const url = String(input);
            let body: Record<string, unknown> = {};
            if (typeof init.body === 'string' && init.body.length > 0) body = JSON.parse(init.body) as Record<string, unknown>;
            captured.push({ url, init, body });
            const responder = responders.shift();
            if (!responder) throw new Error(`unexpected fetch ${url}`);
            return responder(url, init);
          }) as typeof fetch;

          const timeoutCalls: number[] = [];
          const originalTimeout = AbortSignal.timeout.bind(AbortSignal);
          Object.defineProperty(AbortSignal, 'timeout', {
            configurable: true,
            value: (ms: number) => {
              timeoutCalls.push(ms);
              return originalTimeout(ms);
            },
          });

          process.env.PUBLIC_API_URL = 'https://api.example.test';
          const adapter = new MomoGatewayAdapter({
            partnerCode: 'partner',
            accessKey: 'access',
            secretKey: 'secret',
            environment: 'sandbox',
          });
          const paymentId = 'payment-abc';
          const orderId = adapter.prepareOrderReference(paymentId);
          const expectedOrderId = momoId('MO', paymentId);
          equal(orderId, expectedOrderId, 'stable MO orderId');
          check(Boolean(orderId && /^MO[0-9a-f]{32}$/.test(orderId)), 'orderId format');
          check((orderId?.length ?? 999) <= 50, 'orderId <= 50 chars');

          responders.push(() => json({ resultCode: 0, payUrl: 'https://pay.example.test' }));
          await adapter.createPayment({
            paymentId,
            gatewayOrderRef: orderId,
            amountVnd: 100_000n,
            description: 'booking-1',
            returnUrl: 'https://return.example.test',
            errorUrl: 'https://error.example.test',
            cancelUrl: 'https://cancel.example.test',
            expiresInSec: 900,
            paymentMethod: 'momo_wallet' as never,
          });
          const createReq = captured.at(-1)!;
          equal(createReq.url, 'https://test-payment.momo.vn/v2/gateway/api/create', 'create endpoint');
          equal(createReq.body.orderId, expectedOrderId, 'create orderId');
          equal(createReq.body.requestId, momoId('MC', paymentId), 'create requestId');
          check(String(createReq.body.requestId ?? '').length <= 50, 'create requestId <= 50 chars');
          const createRaw =
            `accessKey=access&amount=100000&extraData=&ipnUrl=https://api.example.test/webhooks/momo` +
            `&orderId=${expectedOrderId}&orderInfo=booking-1&partnerCode=partner` +
            `&redirectUrl=https://return.example.test&requestId=${momoId('MC', paymentId)}&requestType=captureWallet`;
          equal(createReq.body.signature, sign(createRaw), 'create signature');

          responders.push(() => json({ resultCode: 9000, amount: 100_000, transId: 12345 }));
          const paymentStatus = await adapter.queryPaymentStatus(expectedOrderId);
          equal(paymentStatus.status, 'succeeded', '9000 payment status');
          const queryReq = captured.at(-1)!;
          equal(queryReq.url, 'https://test-payment.momo.vn/v2/gateway/api/query', 'query endpoint');
          equal(queryReq.body.requestId, momoId('MQ', expectedOrderId), 'payment query requestId');
          const queryRaw = `accessKey=access&orderId=${expectedOrderId}&partnerCode=partner&requestId=${momoId('MQ', expectedOrderId)}`;
          equal(queryReq.body.signature, sign(queryRaw), 'payment query signature');

          const refundId = 'refund-abc';
          const expectedRefundOrder = momoId('RF', refundId);
          responders.push(() => json({ resultCode: 0, transId: 777 }));
          const refund = await adapter.refund({
            refundId,
            gatewayTxnId: '12345',
            gatewayOrderRef: expectedOrderId,
            amountVnd: 10_000n,
            reason: 'booking_cancellation',
          });
          equal(refund.status, 'succeeded', 'refund success status');
          const refundReq = captured.at(-1)!;
          equal(refundReq.url, 'https://test-payment.momo.vn/v2/gateway/api/refund', 'refund endpoint');
          equal(refundReq.body.orderId, expectedRefundOrder, 'refund orderId');
          equal(refundReq.body.requestId, momoId('RR', refundId), 'refund requestId');
          const refundRaw =
            `accessKey=access&amount=10000&description=booking_cancellation&orderId=${expectedRefundOrder}` +
            `&partnerCode=partner&requestId=${momoId('RR', refundId)}&transId=12345`;
          equal(refundReq.body.signature, sign(refundRaw), 'refund signature');

          responders.push(() =>
            json({
              resultCode: 0,
              refundTrans: [{ orderId: expectedRefundOrder, resultCode: 7000, amount: 10_000 }],
            }),
          );
          const refundStatus = await adapter.queryRefundStatus({ refundId, gatewayRefundId: expectedRefundOrder });
          equal(refundStatus.status, 'pending', 'refund query pending classification');
          const refundQueryReq = captured.at(-1)!;
          equal(refundQueryReq.url, 'https://test-payment.momo.vn/v2/gateway/api/refund/query', 'refund query endpoint');
          equal(refundQueryReq.body.orderId, expectedRefundOrder, 'refund query orderId');
          equal(refundQueryReq.body.requestId, momoId('RQ', refundId), 'refund query requestId');
          const refundQueryRaw = `accessKey=access&orderId=${expectedRefundOrder}&partnerCode=partner&requestId=${momoId('RQ', refundId)}`;
          equal(refundQueryReq.body.signature, sign(refundQueryRaw), 'refund query signature');

          responders.push(() => json({ resultCode: 1081 }));
          responders.push(() =>
            json({ resultCode: 0, refundTrans: [{ orderId: expectedRefundOrder, resultCode: 0, transId: 888, amount: 10_000 }] }),
          );
          const recovered = await adapter.refund({
            refundId,
            gatewayTxnId: '12345',
            gatewayOrderRef: expectedOrderId,
            amountVnd: 10_000n,
            reason: 'booking_cancellation',
          });
          equal(recovered.status, 'succeeded', '1081 query recovery status');
          equal(recovered.refundId, '888', '1081 query recovery transId');
          check(captured.at(-1)?.url.endsWith('/v2/gateway/api/refund/query'), '1081 performs refund query');

          const webhook = (resultCode: number, transId: string): ReturnType<MomoGatewayAdapter['verifyWebhook']> => {
            const fields: Record<string, string | number> = {
              partnerCode: 'partner',
              orderId: expectedOrderId,
              requestId: expectedOrderId,
              amount: '100000',
              orderInfo: 'booking-1',
              orderType: 'momo_wallet',
              transId,
              resultCode,
              message: 'status',
              payType: 'qr',
              responseTime: 1,
              extraData: '',
            };
            const raw =
              `accessKey=access&amount=${fields.amount}&extraData=${fields.extraData}` +
              `&message=${fields.message}&orderId=${fields.orderId}&orderInfo=${fields.orderInfo}` +
              `&orderType=${fields.orderType}&partnerCode=${fields.partnerCode}&payType=${fields.payType}` +
              `&requestId=${fields.requestId}&responseTime=${fields.responseTime}` +
              `&resultCode=${fields.resultCode}&transId=${fields.transId}`;
            return adapter.verifyWebhook(Buffer.from(JSON.stringify({ ...fields, signature: sign(raw) })), {});
          };
          const pendingWebhook = webhook(7000, '');
          check(pendingWebhook.valid, 'signed pending webhook is valid');
          equal(pendingWebhook.event, 'pending', '7000 webhook maps pending');
          check(!webhook(0, '').valid, 'success webhook requires positive transId');

          const errorKind = async (code: number): Promise<unknown> => {
            responders.push(() => json({ resultCode: code, message: 'classified' }));
            try {
              await adapter.createPayment({
                paymentId: `payment-${code}`,
                gatewayOrderRef: momoId('MO', `payment-${code}`),
                amountVnd: 100_000n,
                description: 'booking',
                returnUrl: 'https://return.example.test',
                errorUrl: 'https://error.example.test',
                cancelUrl: 'https://cancel.example.test',
                expiresInSec: 900,
                paymentMethod: 'momo_wallet' as never,
              });
              return 'none';
            } catch (error) {
              return (error as { kind?: unknown }).kind;
            }
          };
          equal(await errorKind(11), 'configuration', 'code 11 configuration');
          equal(await errorKind(10), 'retryable', 'code 10 retryable');

          process.env.PUBLIC_API_URL = 'http://localhost:3000';
          const production = new MomoGatewayAdapter({
            partnerCode: 'partner', accessKey: 'access', secretKey: 'secret', environment: 'production',
          });
          let blockedLocalProduction = false;
          try {
            await production.createPayment({
              paymentId: 'prod-payment',
              gatewayOrderRef: momoId('MO', 'prod-payment'),
              amountVnd: 100_000n,
              description: 'booking',
              returnUrl: 'https://return.example.test',
              errorUrl: 'https://error.example.test',
              cancelUrl: 'https://cancel.example.test',
              expiresInSec: 900,
              paymentMethod: 'momo_wallet' as never,
            });
          } catch (error) {
            blockedLocalProduction = String((error as Error).message).includes('public HTTPS');
          }
          check(blockedLocalProduction, 'production callback requires public HTTPS');

          check(timeoutCalls.length >= 7, 'all outbound MoMo calls are bounded');
          check(timeoutCalls.every((ms) => ms === 30_000), 'all MoMo timeouts are 30 seconds');

          Object.defineProperty(AbortSignal, 'timeout', { configurable: true, value: originalTimeout });
          if (failures.length > 0) {
            console.error(JSON.stringify({ momoProof: false, failures }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            momoProof: true,
            stableIds: true,
            signatures: true,
            resultCodes: true,
            refund1081Recovery: true,
            timeout30s: true,
            productionCallbackGuard: true,
          }, null, 2));
          TS
          cd apps/api
          ./node_modules/.bin/ts-node --transpile-only --compiler-options '{"module":"CommonJS","moduleResolution":"Node"}' src/modules/payments/infrastructure/gateways/.momo-proof.ts
