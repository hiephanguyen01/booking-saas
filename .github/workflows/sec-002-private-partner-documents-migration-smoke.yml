name: SEC-002 private document migration smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sec-002-migration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: development
      PORT: 3000
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_COOKIE_SECURE: "false"
      PLATFORM_BASE_DOMAIN: bookingos.vn
      PUBLIC_API_URL: http://127.0.0.1:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: bookingos
      S3_PRIVATE_BUCKET: bookingos-private
      S3_PUBLIC_URL: http://127.0.0.1:9000/bookingos
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGN_EXPIRES_SEC: "300"
      STORAGE_UPLOAD_ORIGINS: http://127.0.0.1:9000
      SEED_ADMIN_EMAIL: smoke-admin@bookingos.local
      SEED_ADMIN_PASSWORD: SmokeAdmin1234
      SEED_OWNER_PASSWORD: demo-password
      SEED_DEMO_PASSWORD: demo-password
      PAYMENTS_ENC_KEY: smoke-payments-encryption-key-not-for-production
      ALLOW_MOCK_PAYMENTS: "true"
      OUTBOX_RELAY_DISABLED: "true"
      NOTIFICATION_REMINDER_DISABLED: "true"
      BOOKING_SCHEDULER_DISABLED: "true"
      SETTLEMENT_RELEASE_DISABLED: "true"
      LOG_PRETTY: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start disposable MinIO
        run: |
          set -euo pipefail
          docker run -d --name sec002-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio12345 \
            minio/minio:latest server /data --console-address ':9001'
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          echo '::error::MinIO did not become ready'
          exit 1

      - name: Prepare disposable database, storage, seed and API
        run: |
          set -euo pipefail
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate
          pnpm --filter=@booking/api storage:init
          pnpm --filter=@booking/api seed
          pnpm --filter=@booking/api build

          cd apps/api
          node - <<'NODE' > /tmp/sec002-ids.json
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const tenant = await prisma.tenant.findUniqueOrThrow({ where: { slug: 'studiohub' } });
            const partner = await prisma.partner.findUniqueOrThrow({
              where: { tenantId_slug: { tenantId: tenant.id, slug: 'giang-studio' } },
            });
            process.stdout.write(JSON.stringify({ tenantId: tenant.id, partnerId: partner.id }));
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          echo "STUDIO_TENANT_ID=$(jq -r .tenantId /tmp/sec002-ids.json)" >> "$GITHUB_ENV"
          echo "GIANG_PARTNER_ID=$(jq -r .partnerId /tmp/sec002-ids.json)" >> "$GITHUB_ENV"

          nohup pnpm --filter=@booking/api start >/tmp/sec002-api.log 2>&1 &
          echo $! >/tmp/sec002-api.pid
          for attempt in $(seq 1 90); do
            if curl -fsS -H 'Host: studiohub.localhost' \
              'http://127.0.0.1:3000/public/legal?locale=vi' >/dev/null; then exit 0; fi
            sleep 1
          done
          echo '::error::API did not become ready'
          exit 1

      - name: Seed managed legacy fixtures
        run: |
          set -euo pipefail
          cd apps/api
          node - <<'NODE'
          const { PutObjectCommand, S3Client } = require('@aws-sdk/client-s3');
          const { PrismaClient } = require('@prisma/client');
          const run = process.env.GITHUB_RUN_ID;
          const validKey = `sec002-migration/${run}/valid.png`;
          const oversizedKey = `sec002-migration/${run}/oversized.png`;
          const missingKey = `sec002-migration/${run}/missing.png`;
          const publicBase = process.env.S3_PUBLIC_URL.replace(/\/$/, '');
          const s3 = new S3Client({
            region: process.env.S3_REGION,
            endpoint: process.env.S3_ENDPOINT,
            forcePathStyle: true,
            credentials: { accessKeyId: process.env.S3_ACCESS_KEY, secretAccessKey: process.env.S3_SECRET_KEY },
          });
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            await s3.send(new PutObjectCommand({
              Bucket: process.env.S3_BUCKET,
              Key: validKey,
              Body: Buffer.alloc(512),
              ContentType: 'image/png',
            }));
            await s3.send(new PutObjectCommand({
              Bucket: process.env.S3_BUCKET,
              Key: oversizedKey,
              Body: Buffer.alloc(5 * 1024 * 1024 + 1),
              ContentType: 'image/png',
            }));
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            const info = partner.businessInfo && typeof partner.businessInfo === 'object' && !Array.isArray(partner.businessInfo)
              ? { ...partner.businessInfo }
              : {};
            Object.assign(info, {
              identityCardFrontUrl: `${publicBase}/${validKey}`,
              identityCardBackUrl: 'https://example.com/sec002-external.png',
              businessLicenseFrontUrl: `${publicBase}/${oversizedKey}`,
              businessLicenseBackUrl: `${publicBase}/${missingKey}`,
            });
            delete info.identityCardFrontKey;
            delete info.identityCardBackKey;
            delete info.businessLicenseFrontKey;
            delete info.businessLicenseBackKey;
            await prisma.partner.update({ where: { id: partner.id }, data: { businessInfo: info } });
          })().finally(async () => {
            await prisma.$disconnect();
            s3.destroy();
          });
          NODE
          cd ../..
          echo "VALID_LEGACY_URL=$S3_PUBLIC_URL/sec002-migration/$GITHUB_RUN_ID/valid.png" >> "$GITHUB_ENV"
          echo "OVERSIZED_LEGACY_URL=$S3_PUBLIC_URL/sec002-migration/$GITHUB_RUN_ID/oversized.png" >> "$GITHUB_ENV"
          echo "MISSING_LEGACY_URL=$S3_PUBLIC_URL/sec002-migration/$GITHUB_RUN_ID/missing.png" >> "$GITHUB_ENV"

      - name: Verify legacy read, dry-run and apply idempotence
        shell: bash
        run: |
          set -euo pipefail
          API='http://127.0.0.1:3000'

          owner_login='{"email":"owner@studiohub.vn","password":"demo-password"}'
          status=$(curl -sS -c /tmp/sec002-owner.cookies -o /tmp/sec002-owner-login.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$owner_login" "$API/auth/login")
          [ "$status" = 200 ] || { echo "::error::tenant owner login returned $status"; exit 1; }

          status=$(curl -sS -b /tmp/sec002-owner.cookies -o /tmp/sec002-before.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" "$API/tenant/partners/$GIANG_PARTNER_ID/documents")
          [ "$status" = 200 ] || { echo "::error::legacy read returned $status"; exit 1; }
          jq -e --arg url "$VALID_LEGACY_URL" \
            '.[] | select(.storage=="legacy_public" and .kind=="identity_card_front" and .url==$url)' \
            /tmp/sec002-before.json >/dev/null
          echo 'PASS case 15 legacy compatibility descriptor'

          pnpm --filter=@booking/api migrate:partner-documents -- --dry-run >/tmp/sec002-dry.log
          grep -Eq '"eligible": [1-9][0-9]*' /tmp/sec002-dry.log
          grep -Eq '"external_url": [1-9][0-9]*' /tmp/sec002-dry.log
          grep -Eq '"missing": [1-9][0-9]*' /tmp/sec002-dry.log
          grep -Eq '"oversized": [1-9][0-9]*' /tmp/sec002-dry.log
          grep -q '"migrated": 0' /tmp/sec002-dry.log
          status=$(curl -sS -o /tmp/sec002-valid-before.bin -w '%{http_code}' "$VALID_LEGACY_URL")
          [ "$status" = 200 ] || { echo "::error::dry-run changed public source ($status)"; exit 1; }
          [ "$(wc -c </tmp/sec002-valid-before.bin | tr -d ' ')" = 512 ]

          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" VALID_LEGACY_URL="$VALID_LEGACY_URL" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            const info = partner.businessInfo ?? {};
            if (info.identityCardFrontUrl !== process.env.VALID_LEGACY_URL) throw new Error('dry-run changed legacy URL');
            if (info.identityCardFrontKey) throw new Error('dry-run wrote canonical key');
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          echo 'PASS migration dry-run has no DB/storage mutation'

          pnpm --filter=@booking/api migrate:partner-documents -- --apply >/tmp/sec002-apply1.log
          grep -Eq '"migrated": [1-9][0-9]*' /tmp/sec002-apply1.log
          status=$(curl -sS -o /tmp/sec002-valid-after.out -w '%{http_code}' "$VALID_LEGACY_URL")
          [ "$status" = 404 ] || { echo "::error::migrated public source still readable ($status)"; exit 1; }

          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" \
          OVERSIZED_LEGACY_URL="$OVERSIZED_LEGACY_URL" \
          MISSING_LEGACY_URL="$MISSING_LEGACY_URL" \
          node - <<'NODE' >/tmp/sec002-key.txt
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            const info = partner.businessInfo ?? {};
            const key = info.identityCardFrontKey;
            if (typeof key !== 'string' || !key.startsWith(`partner-documents/legacy/${partner.id}/`)) {
              throw new Error('eligible legacy object not canonicalized');
            }
            if ('identityCardFrontUrl' in info) throw new Error('migrated legacy URL was not cleaned up');
            if (info.identityCardBackUrl !== 'https://example.com/sec002-external.png') throw new Error('external URL should remain');
            if (info.businessLicenseFrontUrl !== process.env.OVERSIZED_LEGACY_URL) throw new Error('oversized URL should remain');
            if (info.businessLicenseBackUrl !== process.env.MISSING_LEGACY_URL) throw new Error('missing URL should remain');
            process.stdout.write(key);
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          MIGRATED_KEY=$(cat /tmp/sec002-key.txt)
          test -n "$MIGRATED_KEY"
          echo 'PASS first apply canonicalizes only eligible managed object'

          status=$(curl -sS -b /tmp/sec002-owner.cookies -o /tmp/sec002-after.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" "$API/tenant/partners/$GIANG_PARTNER_ID/documents")
          [ "$status" = 200 ] || { echo "::error::post-migration read returned $status"; exit 1; }
          MIGRATED_DOWNLOAD_URL=$(jq -r '.[] | select(.storage=="private" and .kind=="identity_card_front") | .downloadUrl' /tmp/sec002-after.json)
          test -n "$MIGRATED_DOWNLOAD_URL" && test "$MIGRATED_DOWNLOAD_URL" != null
          status=$(curl -sS -o /tmp/sec002-private-copy.bin -w '%{http_code}' "$MIGRATED_DOWNLOAD_URL")
          [ "$status" = 200 ] || { echo "::error::private migrated copy returned $status"; exit 1; }
          [ "$(wc -c </tmp/sec002-private-copy.bin | tr -d ' ')" = 512 ]
          echo 'PASS migrated object reads through short-lived private grant'

          pnpm --filter=@booking/api migrate:partner-documents -- --apply >/tmp/sec002-apply2.log
          grep -q '"migrated": 0' /tmp/sec002-apply2.log
          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" MIGRATED_KEY="$MIGRATED_KEY" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            if (partner.businessInfo?.identityCardFrontKey !== process.env.MIGRATED_KEY) {
              throw new Error('second apply changed canonical key');
            }
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          echo 'PASS second apply is idempotent'
          echo 'SEC-002 migration smoke: PASS'

      - name: Show sanitized diagnostics on failure
        if: failure()
        run: |
          echo 'API process status:'
          if [ -f /tmp/sec002-api.pid ] && kill -0 "$(cat /tmp/sec002-api.pid)" 2>/dev/null; then echo running; else echo stopped; fi
          tail -n 60 /tmp/sec002-api.log || true
