name: AUTH-001 Runtime Smoke

on:
  push:
    branches: [fix/auth-001-login-abuse-protection]

permissions:
  contents: read
  statuses: write

concurrency:
  group: auth-001-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: development
      PORT: 3000
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_RATE_LIMIT_HMAC_KEY: auth001-runtime-smoke-secret-0123456789abcdef
      PLATFORM_BASE_DOMAIN: localhost
      PUBLIC_API_URL: http://127.0.0.1:3000
      DASHBOARD_URL: http://admin.localhost:4174
      DASHBOARD_HOST: admin.localhost
      PLATFORM_STOREFRONT_URL: http://studiohub.localhost:4173
      SESSION_SECRET_CURRENT: auth001-runtime-session-secret-0123456789abcdef
      SESSION_COOKIE_SECURE: 'false'
      ALLOW_MOCK_PAYMENTS: 'true'
      PAYMENT_REDIRECT_ORIGINS: https://example.invalid
      STORAGE_UPLOAD_ORIGINS: http://127.0.0.1:9000
      S3_PUBLIC_URL: http://127.0.0.1:9000/bookingos
      LOG_PRETTY: 'false'
      LOG_LEVEL: info
      SWAGGER_ENABLED: 'false'
      OUTBOX_RELAY_DISABLED: 'true'
      NOTIFICATION_REMINDER_DISABLED: 'true'
      BOOKING_SCHEDULER_DISABLED: 'true'
      SETTLEMENT_RELEASE_DISABLED: 'true'
      TAX_DOCUMENT_CLEANUP_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
          pnpm --filter=@booking/contracts build
          pnpm --filter=@booking/api build
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api seed
          pnpm turbo run build --filter=@booking/storefront --filter=@booking/dashboard
      - name: Run 16 acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          API=http://127.0.0.1:3000
          A=auth001-victim-a@example.test
          B=auth001-victim-b@example.test
          GOOD=Correct123
          BAD=Wrong123

          fail(){ echo "::error::$*"; exit 1; }
          eq(){ [ "$1" = "$2" ] || fail "$3: expected '$1', got '$2'"; }
          flush(){ redis-cli FLUSHDB >/dev/null; }
          login(){
            local ip="$1" email="$2" pass="$3" out="$4" body
            body=$(jq -nc --arg email "$email" --arg password "$pass" '{email:$email,password:$password}')
            local args=(-sS -H 'Content-Type: application/json' -o "$out" -w '%{http_code}')
            [ -z "$ip" ] || args+=(-H "X-BookingOS-Client-IP: $ip")
            curl "${args[@]}" --data "$body" "$API/auth/login"
          }
          derr(){
            jq -e --argjson s "$2" --arg c "$3" --arg m "$4" \
              '.statusCode==$s and .code==$c and .message==$m' "$1" >/dev/null || { cat "$1"; fail "bad error envelope: $1"; }
          }
          stop_api(){
            if [ -f /tmp/api.pid ]; then kill "$(cat /tmp/api.pid)" 2>/dev/null || true; rm -f /tmp/api.pid; sleep 1; fi
          }
          start_api(){
            nohup node apps/api/dist/main.js >>/tmp/api.log 2>&1 & echo $! >/tmp/api.pid
            for _ in $(seq 1 60); do curl -fsS "$API/health" >/dev/null 2>&1 && return; sleep 1; done
            tail -200 /tmp/api.log; fail 'API failed to start'
          }
          restart_api(){ stop_api; start_api; }
          cleanup(){
            for f in /tmp/sf.pid /tmp/db.pid; do [ ! -f "$f" ] || kill "$(cat "$f")" 2>/dev/null || true; done
            stop_api || true
            docker rm -f auth001-edge auth001-echo >/dev/null 2>&1 || true
            docker network rm auth001-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          : >/tmp/api.log
          start_api

          register(){
            local email="$1" name="$2" out="$3" status body
            body=$(jq -nc --arg email "$email" --arg password "$GOOD" --arg fullName "$name" '{email:$email,password:$password,fullName:$fullName,locale:"vi"}')
            status=$(curl -sS -H 'Content-Type: application/json' -o "$out" -w '%{http_code}' --data "$body" "$API/auth/register")
            case "$status" in 200|201) ;; *) cat "$out"; fail "register $email: $status";; esac
          }
          register "$A" 'Victim A' /tmp/reg-a.json
          register "$B" 'Victim B' /tmp/reg-b.json

          # 1-2: pair threshold + unrelated source still succeeds.
          flush
          for i in $(seq 1 5); do s=$(login 203.0.113.10 "$A" "$BAD" /tmp/a.json); eq 401 "$s" "case1/$i"; done
          s=$(login 203.0.113.10 "$A" "$BAD" /tmp/a.json); eq 429 "$s" case1-sixth; derr /tmp/a.json 429 AUTH_RATE_LIMITED 'Too many login attempts. Please try again later.'
          s=$(login 203.0.113.11 "$A" "$GOOD" /tmp/a.json); eq 200 "$s" case2

          # 3: 30 IP failures allowed, 31st request blocked.
          flush
          for i in $(seq 1 30); do s=$(login 203.0.113.20 "spray-$i@example.test" "$BAD" /tmp/a.json); eq 401 "$s" "case3/$i"; done
          s=$(login 203.0.113.20 spray-31@example.test "$BAD" /tmp/a.json); eq 429 "$s" case3-blocked
          s=$(login 203.0.113.21 "$A" "$BAD" /tmp/a.json); eq 401 "$s" case3-fresh-ip
          restart_api

          # 4: success clears exact pair.
          flush
          for i in $(seq 1 4); do s=$(login 203.0.113.30 "$A" "$BAD" /tmp/a.json); eq 401 "$s" "case4/pre$i"; done
          s=$(login 203.0.113.30 "$A" "$GOOD" /tmp/a.json); eq 200 "$s" case4-success
          for i in $(seq 1 5); do s=$(login 203.0.113.30 "$A" "$BAD" /tmp/a.json); eq 401 "$s" "case4/post$i"; done
          s=$(login 203.0.113.30 "$A" "$BAD" /tmp/a.json); eq 429 "$s" case4-blocked

          # 5: success does not clear IP-wide failures.
          flush
          for i in $(seq 1 29); do s=$(login 203.0.113.31 "hist-$i@example.test" "$BAD" /tmp/a.json); eq 401 "$s" "case5/$i"; done
          s=$(login 203.0.113.31 "$A" "$GOOD" /tmp/a.json); eq 200 "$s" case5-success
          s=$(login 203.0.113.31 hist-30@example.test "$BAD" /tmp/a.json); eq 401 "$s" case5-thirtieth
          s=$(login 203.0.113.31 hist-31@example.test "$BAD" /tmp/a.json); eq 429 "$s" case5-blocked
          restart_api

          # 6: unknown email and wrong password are externally identical.
          flush
          su=$(login 203.0.113.40 unknown-auth001@example.test "$BAD" /tmp/u.json)
          sw=$(login 203.0.113.41 "$A" "$BAD" /tmp/w.json)
          eq 401 "$su" case6-unknown; eq 401 "$sw" case6-wrong
          eq "$(jq -c '{statusCode,code,message}' /tmp/u.json)" "$(jq -c '{statusCode,code,message}' /tmp/w.json)" case6-parity
          derr /tmp/u.json 401 INVALID_CREDENTIALS 'Invalid email or password'

          # 7 + 10: production Caddy routes contain canonical overwrite, and runtime overwrite defeats spoof.
          eq 5 "$(grep -c 'header_up X-BookingOS-Client-IP {remote_host}' docker/caddy/Caddyfile)" case7-production-count
          docker run --rm -e ACME_EMAIL=ops@example.invalid -e DASHBOARD_HOST=admin.example.invalid -e API_HOST=api.example.invalid -e PLATFORM_BASE_DOMAIN=example.invalid \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e ACME_EMAIL=ops@example.invalid -e DASHBOARD_HOST=admin.example.invalid -e API_HOST=api.example.invalid -e PLATFORM_BASE_DOMAIN=example.invalid \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --pretty --config /etc/caddy/Caddyfile >/tmp/caddy.json
          [ "$(grep -c 'X-BookingOS-Client-IP' /tmp/caddy.json)" -ge 5 ] || fail 'case10 adapted config missing canonical header'
          cat >/tmp/echo.Caddyfile <<'EOF'
          :8080 { respond "{http.request.header.X-BookingOS-Client-IP}" 200 }
          EOF
          cat >/tmp/edge.Caddyfile <<'EOF'
          :8081 {
            reverse_proxy auth001-echo:8080 {
              header_up X-BookingOS-Client-IP {remote_host}
            }
          }
          EOF
          docker network create auth001-net >/dev/null
          docker run -d --name auth001-echo --network auth001-net -v /tmp/echo.Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine >/dev/null
          docker run -d --name auth001-edge --network auth001-net -p 18081:8081 -v /tmp/edge.Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine >/dev/null
          for _ in $(seq 1 30); do curl -fsS -H 'X-BookingOS-Client-IP: 8.8.8.8' http://127.0.0.1:18081 >/tmp/seen 2>/dev/null && break; sleep 1; done
          seen=$(cat /tmp/seen); [ -n "$seen" ] || fail 'case7 empty upstream canonical IP'; [ "$seen" != 8.8.8.8 ] || fail 'case7 spoof survived Caddy'

          # 8-9: actual BFF parsers forward one literal only and never fall back.
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { trustedClientIpHeaders as sf } from './apps/storefront/app/lib/server/trusted-client-ip.server.ts';
          import { trustedClientIpHeaders as db } from './apps/dashboard/app/lib/trusted-client-ip.server.ts';
          for (const f of [sf, db]) {
            assert.deepEqual(f(new Request('http://x',{headers:{'x-bookingos-client-ip':'203.0.113.50','x-forwarded-for':'8.8.8.8'}})), {'x-bookingos-client-ip':'203.0.113.50'});
            assert.deepEqual(f(new Request('http://x',{headers:{'x-bookingos-client-ip':'2001:db8::50'}})), {'x-bookingos-client-ip':'2001:db8::50'});
            assert.deepEqual(f(new Request('http://x',{headers:{'x-bookingos-client-ip':'203.0.113.50, 198.51.100.2'}})), {});
            assert.deepEqual(f(new Request('http://x',{headers:{'x-forwarded-for':'203.0.113.50'}})), {});
            assert.deepEqual(f(new Request('http://x',{headers:{'x-bookingos-client-ip':'bad'}})), {});
          }
          NODE

          # 11: missing/malformed canonical IP does not collapse onto socket peer.
          flush
          mark=$(( $(wc -l </tmp/api.log)+1 ))
          for i in $(seq 1 31); do s=$(login '' "missing-$i@example.test" "$BAD" /tmp/a.json); eq 401 "$s" "case11/missing$i"; done
          malformed='198.51.100.1, 198.51.100.2'
          for i in $(seq 1 6); do s=$(login "$malformed" "$A" "$BAD" /tmp/a.json); eq 401 "$s" "case11/malformed$i"; done
          logs=$(tail -n +"$mark" /tmp/api.log); echo "$logs" | grep -q auth.login.client_ip_unavailable || fail 'case11 missing telemetry'
          [[ "$(echo "$logs" | grep auth.login.client_ip_unavailable | tail -1)" != *"$malformed"* ]] || fail 'case11 leaked malformed raw header'
          restart_api

          # 12: use-case fail-open plus real dedicated Redis client command rejection.
          node <<'NODE'
          (async () => {
            const assert=require('node:assert/strict');
            const {LoginUseCase}=require('./apps/api/dist/modules/identity-access/application/use-cases/login.use-case.js');
            const {UserAccount}=require('./apps/api/dist/modules/identity-access/domain/entities/user-account.entity.js');
            const {InvalidCredentials}=require('./apps/api/dist/modules/identity-access/domain/errors/identity-access-errors.js');
            const IORedis=require('ioredis'); const Redis=IORedis.default??IORedis;
            const {RedisLoginAbuseProtectionService}=require('./apps/api/dist/modules/identity-access/infrastructure/services/redis-login-abuse-protection.service.js');
            const user=UserAccount.rehydrate({id:'11111111-1111-4111-8111-111111111111',email:'fail-open@example.test',passwordHash:'hash',fullName:'Fail Open',phone:null,avatarUrl:null,locale:'vi',status:'active',failedLoginCount:4,lockedUntil:new Date(Date.now()+60000),emailVerifiedAt:new Date()});
            let created=0;
            const uc=new LoginUseCase({findByEmail:async()=>user},{verify:async(_h,p)=>p==='Correct123'},{create:async()=>{created++;const d=new Date();return{sessionId:'22222222-2222-4222-8222-222222222222',accessToken:'a',accessExpiresAt:d,refreshToken:'r',refreshExpiresAt:d};}},{precheck:async()=>{throw Error('x')},recordFailure:async()=>{throw Error('x')},clearPair:async()=>{throw Error('x')}});
            await uc.execute({email:'fail-open@example.test',password:'Correct123'},{ip:'203.0.113.55'}); assert.equal(created,1);
            await assert.rejects(()=>uc.execute({email:'fail-open@example.test',password:'Wrong123'},{ip:'203.0.113.55'}),e=>e instanceof InvalidCredentials);
            const shared=new Redis(process.env.REDIS_URL); await shared.ping();
            const svc=new RedisLoginAbuseProtectionService(shared); await svc.redis.ping(); svc.redis.disconnect();
            const t=Date.now(); await assert.rejects(()=>svc.precheck({normalizedEmail:'fast-fail@example.test',clientIp:'203.0.113.56'})); assert.ok(Date.now()-t<2000);
            shared.disconnect();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          # 13: 20 failures across >=3 sources emits signal but does not block fresh source.
          flush
          mark=$(( $(wc -l </tmp/api.log)+1 ))
          for ip in 60 61 62 63 64; do for i in $(seq 1 4); do s=$(login "203.0.113.$ip" "$B" "$BAD" /tmp/a.json); eq 401 "$s" "case13/$ip/$i"; done; done
          s=$(login 203.0.113.65 "$B" "$GOOD" /tmp/a.json); eq 200 "$s" case13-success
          tail -n +"$mark" /tmp/api.log | grep -q auth.login.distributed_attack_suspected || fail 'case13 signal missing'

          # 14-15: legacy persistent lockout state is inert and untouched.
          flush
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE users SET failed_login_count=4, locked_until=now()+interval '1 hour' WHERE email='$B'" >/dev/null
          before=$(psql "$MIGRATE_DATABASE_URL" -Atc "SELECT failed_login_count::text||'|'||extract(epoch from locked_until)::bigint::text FROM users WHERE email='$B'")
          s=$(login 203.0.113.70 "$B" "$GOOD" /tmp/a.json); eq 200 "$s" case14
          s=$(login 203.0.113.71 "$B" "$BAD" /tmp/a.json); eq 401 "$s" case15
          after=$(psql "$MIGRATE_DATABASE_URL" -Atc "SELECT failed_login_count::text||'|'||extract(epoch from locked_until)::bigint::text FROM users WHERE email='$B'")
          eq "$before" "$after" case15-columns

          # Production secret guard.
          node <<'NODE'
          (async () => {
            const assert=require('node:assert/strict'); const IORedis=require('ioredis'); const Redis=IORedis.default??IORedis;
            const {RedisLoginAbuseProtectionService}=require('./apps/api/dist/modules/identity-access/infrastructure/services/redis-login-abuse-protection.service.js');
            const shared=new Redis(process.env.REDIS_URL); await shared.ping(); const n=process.env.NODE_ENV,k=process.env.AUTH_RATE_LIMIT_HMAC_KEY; process.env.NODE_ENV='production';
            for(const key of [undefined,'short','dev-auth-rate-limit-hmac-key-not-for-production','CHANGE_ME_generate_with_openssl_rand_hex_32']){if(key===undefined)delete process.env.AUTH_RATE_LIMIT_HMAC_KEY;else process.env.AUTH_RATE_LIMIT_HMAC_KEY=key;assert.throws(()=>new RedisLoginAbuseProtectionService(shared));}
            process.env.AUTH_RATE_LIMIT_HMAC_KEY='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'; const ok=new RedisLoginAbuseProtectionService(shared); ok.redis.disconnect(); process.env.NODE_ENV=n; if(k===undefined)delete process.env.AUTH_RATE_LIMIT_HMAC_KEY;else process.env.AUTH_RATE_LIMIT_HMAC_KEY=k; shared.disconnect();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          restart_api

          # 16: real storefront/dashboard BFFs surface retry copy, not account-lock wording.
          flush
          for i in $(seq 1 5); do s=$(login 203.0.113.90 "$A" "$BAD" /tmp/a.json); eq 401 "$s" "case16/sf-prefill$i"; done
          nohup env NODE_ENV=development HOST=0.0.0.0 PORT=4173 BACKEND_URL="$API" REDIS_URL="$REDIS_URL" DASHBOARD_URL=http://admin.localhost:4174 PLATFORM_BASE_DOMAIN=localhost SESSION_SECRET_CURRENT="$SESSION_SECRET_CURRENT" SESSION_COOKIE_SECURE=false ALLOW_MOCK_PAYMENTS=true PAYMENT_REDIRECT_ORIGINS=https://example.invalid STORAGE_UPLOAD_ORIGINS=http://127.0.0.1:9000 pnpm --filter=@booking/storefront start >/tmp/sf.log 2>&1 & echo $! >/tmp/sf.pid
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/healthz >/dev/null || { cat /tmp/sf.log; fail 'storefront failed to start'; }
          sf=$(curl -sS --resolve studiohub.localhost:4173:127.0.0.1 -H 'Origin: http://studiohub.localhost:4173' -H 'Sec-Fetch-Site: same-origin' -H 'X-BookingOS-Client-IP: 203.0.113.90' -H 'Content-Type: application/x-www-form-urlencoded' -H 'Accept: text/html' --data-urlencode "email=$A" --data-urlencode "password=$BAD" -o /tmp/sf.out -w '%{http_code}' http://studiohub.localhost:4173/vi/auth/login)
          eq 429 "$sf" case16-storefront-status
          grep -q 'Bạn đã thử đăng nhập quá nhiều lần. Vui lòng thử lại sau.' /tmp/sf.out || { head -100 /tmp/sf.out; fail 'case16 storefront copy missing'; }
          ! grep -Eq 'Tài khoản tạm.*khóa|ACCOUNT_LOCKED' /tmp/sf.out || fail 'case16 storefront stale lock copy'

          flush; restart_api
          for i in $(seq 1 5); do s=$(login 203.0.113.91 "$A" "$BAD" /tmp/a.json); eq 401 "$s" "case16/db-prefill$i"; done
          nohup env NODE_ENV=development HOST=0.0.0.0 PORT=4174 BACKEND_URL="$API" REDIS_URL="$REDIS_URL" PLATFORM_STOREFRONT_URL=http://studiohub.localhost:4173 DASHBOARD_URL=http://admin.localhost:4174 DASHBOARD_HOST=admin.localhost SESSION_SECRET_CURRENT="$SESSION_SECRET_CURRENT" SESSION_COOKIE_SECURE=false pnpm --filter=@booking/dashboard start >/tmp/db.log 2>&1 & echo $! >/tmp/db.pid
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:4174/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/healthz >/dev/null || { cat /tmp/db.log; fail 'dashboard failed to start'; }
          db=$(curl -sS --resolve admin.localhost:4174:127.0.0.1 -H 'X-BookingOS-Client-IP: 203.0.113.91' -H 'Content-Type: application/json' -H 'Accept: text/html' --data "$(jq -nc --arg email "$A" --arg password "$BAD" '{email:$email,password:$password}')" -o /tmp/db.out -w '%{http_code}' http://admin.localhost:4174/auth/login)
          eq 400 "$db" case16-dashboard-status
          grep -q 'Bạn đã thử đăng nhập quá nhiều lần. Vui lòng thử lại sau.' /tmp/db.out || { head -100 /tmp/db.out; fail 'case16 dashboard copy missing'; }
          ! grep -Eq 'Tài khoản tạm.*khóa|ACCOUNT_LOCKED' /tmp/db.out || fail 'case16 dashboard stale lock copy'

          echo 'AUTH-001 runtime smoke: all 16 cases passed.'
      - name: Publish runtime status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure; [ "$JOB_STATUS" != success ] || state=success
          jq -nc --arg state "$state" --arg context auth-001/runtime --arg description "AUTH-001 runtime smoke: $state" --arg target_url "$RUN_URL" '{state,context,description,target_url}' >/tmp/status.json
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d @/tmp/status.json
