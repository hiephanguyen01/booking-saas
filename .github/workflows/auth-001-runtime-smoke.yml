name: AUTH-001 Runtime Smoke

on:
  push:
    branches:
      - fix/auth-001-login-abuse-protection

permissions:
  contents: read
  statuses: write

concurrency:
  group: auth-001-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      PORT: 3000
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_RATE_LIMIT_HMAC_KEY: auth001-runtime-smoke-secret-0123456789abcdef
      PLATFORM_BASE_DOMAIN: localhost
      PUBLIC_API_URL: http://127.0.0.1:3000
      DASHBOARD_URL: http://admin.localhost:4174
      DASHBOARD_HOST: admin.localhost
      PLATFORM_STOREFRONT_URL: http://studiohub.localhost:4173
      SESSION_SECRET_CURRENT: auth001-runtime-session-secret-0123456789abcdef
      SESSION_COOKIE_SECURE: 'false'
      ALLOW_MOCK_PAYMENTS: 'true'
      PAYMENT_REDIRECT_ORIGINS: https://example.invalid
      STORAGE_UPLOAD_ORIGINS: http://127.0.0.1:9000
      S3_PUBLIC_URL: http://127.0.0.1:9000/bookingos
      LOG_PRETTY: 'false'
      LOG_LEVEL: info
      SWAGGER_ENABLED: 'false'
      OUTBOX_RELAY_DISABLED: 'true'
      NOTIFICATION_REMINDER_DISABLED: 'true'
      BOOKING_SCHEDULER_DISABLED: 'true'
      SETTLEMENT_RELEASE_DISABLED: 'true'
      TAX_DOCUMENT_CLEANUP_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies and CLI probes
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
      - name: Build, migrate, and seed disposable stack
        run: |
          pnpm --filter=@booking/contracts build
          pnpm --filter=@booking/api build
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api seed
          pnpm turbo run build --filter=@booking/storefront --filter=@booking/dashboard
      - name: Run all 16 AUTH-001 acceptance cases
        shell: bash
        run: |
          set -euo pipefail

          API=http://127.0.0.1:3000
          VICTIM_A=auth001-victim-a@example.test
          VICTIM_B=auth001-victim-b@example.test
          CORRECT_PASSWORD=Correct123
          WRONG_PASSWORD=Wrong123

          fail() {
            echo "::error::$*"
            exit 1
          }

          assert_eq() {
            local expected="$1"
            local actual="$2"
            local label="$3"
            [ "$expected" = "$actual" ] || fail "$label: expected '$expected', got '$actual'"
          }

          assert_domain_error() {
            local file="$1"
            local status="$2"
            local code="$3"
            local message="$4"
            jq -e \
              --argjson status "$status" \
              --arg code "$code" \
              --arg message "$message" \
              '.statusCode == $status and .code == $code and .message == $message' \
              "$file" >/dev/null || {
                cat "$file"
                fail "unexpected domain error envelope in $file"
              }
          }

          api_login() {
            local ip="$1"
            local email="$2"
            local password="$3"
            local out="$4"
            local payload
            payload=$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')
            local args=(-sS -H 'Content-Type: application/json' -o "$out" -w '%{http_code}')
            if [ -n "$ip" ]; then
              args+=(-H "X-BookingOS-Client-IP: $ip")
            fi
            curl "${args[@]}" --data "$payload" "$API/auth/login"
          }

          register_user() {
            local email="$1"
            local name="$2"
            local out="$3"
            local payload status
            payload=$(jq -nc \
              --arg email "$email" \
              --arg password "$CORRECT_PASSWORD" \
              --arg fullName "$name" \
              '{email:$email,password:$password,fullName:$fullName,locale:"vi"}')
            status=$(curl -sS -H 'Content-Type: application/json' -o "$out" -w '%{http_code}' \
              --data "$payload" "$API/auth/register")
            case "$status" in
              200|201) ;;
              *) cat "$out"; fail "register $email returned $status" ;;
            esac
          }

          flush_redis() {
            redis-cli -h 127.0.0.1 -p 6379 FLUSHDB >/dev/null
          }

          stop_api() {
            if [ -f /tmp/auth001-api.pid ]; then
              local pid
              pid=$(cat /tmp/auth001-api.pid)
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
                for _ in $(seq 1 20); do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 0.25
                done
                kill -9 "$pid" 2>/dev/null || true
              fi
              rm -f /tmp/auth001-api.pid
            fi
          }

          start_api() {
            touch /tmp/auth001-api.log
            nohup node apps/api/dist/main.js >>/tmp/auth001-api.log 2>&1 &
            echo $! >/tmp/auth001-api.pid
            for _ in $(seq 1 60); do
              if curl -fsS "$API/health" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            tail -200 /tmp/auth001-api.log || true
            fail 'API did not become healthy'
          }

          restart_api() {
            stop_api
            start_api
          }

          stop_frontends() {
            for file in /tmp/auth001-storefront.pid /tmp/auth001-dashboard.pid; do
              if [ -f "$file" ]; then
                local pid
                pid=$(cat "$file")
                kill "$pid" 2>/dev/null || true
                rm -f "$file"
              fi
            done
          }

          cleanup() {
            stop_frontends || true
            stop_api || true
            docker rm -f auth001-caddy-edge auth001-caddy-upstream >/dev/null 2>&1 || true
            docker network rm auth001-caddy >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          : >/tmp/auth001-api.log
          start_api
          register_user "$VICTIM_A" 'AUTH001 Victim A' /tmp/register-a.json
          register_user "$VICTIM_B" 'AUTH001 Victim B' /tmp/register-b.json

          echo '::group::Cases 1-2 — pair threshold and targeted-DoS regression'
          flush_redis
          for i in $(seq 1 5); do
            status=$(api_login '203.0.113.10' "$VICTIM_A" "$WRONG_PASSWORD" "/tmp/case1-$i.json")
            assert_eq 401 "$status" "pair failure $i"
            assert_domain_error "/tmp/case1-$i.json" 401 INVALID_CREDENTIALS 'Invalid email or password'
          done
          status=$(api_login '203.0.113.10' "$VICTIM_A" "$WRONG_PASSWORD" /tmp/case1-sixth.json)
          assert_eq 429 "$status" 'sixth same pair request'
          assert_domain_error /tmp/case1-sixth.json 429 AUTH_RATE_LIMITED 'Too many login attempts. Please try again later.'
          status=$(api_login '203.0.113.11' "$VICTIM_A" "$CORRECT_PASSWORD" /tmp/case2.json)
          assert_eq 200 "$status" 'correct password from unrelated trusted source'
          echo '::endgroup::'

          echo '::group::Case 3 — IP credential spray threshold'
          flush_redis
          for i in $(seq 1 30); do
            status=$(api_login '203.0.113.20' "spray-$i@example.test" "$WRONG_PASSWORD" "/tmp/case3-$i.json")
            assert_eq 401 "$status" "IP spray failure $i"
          done
          status=$(api_login '203.0.113.20' 'spray-31@example.test' "$WRONG_PASSWORD" /tmp/case3-31.json)
          assert_eq 429 "$status" '31st request from one IP'
          assert_domain_error /tmp/case3-31.json 429 AUTH_RATE_LIMITED 'Too many login attempts. Please try again later.'
          status=$(api_login '203.0.113.21' "$VICTIM_A" "$WRONG_PASSWORD" /tmp/case3-fresh.json)
          assert_eq 401 "$status" 'fresh IP still reaches credential verification'
          echo '::endgroup::'

          restart_api

          echo '::group::Cases 4-5 — pair clear and IP history preservation'
          flush_redis
          for i in $(seq 1 4); do
            status=$(api_login '203.0.113.30' "$VICTIM_A" "$WRONG_PASSWORD" "/tmp/case4-pre-$i.json")
            assert_eq 401 "$status" "pre-success pair failure $i"
          done
          status=$(api_login '203.0.113.30' "$VICTIM_A" "$CORRECT_PASSWORD" /tmp/case4-success.json)
          assert_eq 200 "$status" 'correct password clears exact pair'
          for i in $(seq 1 5); do
            status=$(api_login '203.0.113.30' "$VICTIM_A" "$WRONG_PASSWORD" "/tmp/case4-post-$i.json")
            assert_eq 401 "$status" "post-clear pair failure $i"
          done
          status=$(api_login '203.0.113.30' "$VICTIM_A" "$WRONG_PASSWORD" /tmp/case4-blocked.json)
          assert_eq 429 "$status" 'pair threshold restarts after success'

          flush_redis
          for i in $(seq 1 29); do
            status=$(api_login '203.0.113.31' "ip-history-$i@example.test" "$WRONG_PASSWORD" "/tmp/case5-pre-$i.json")
            assert_eq 401 "$status" "IP history failure $i"
          done
          status=$(api_login '203.0.113.31' "$VICTIM_A" "$CORRECT_PASSWORD" /tmp/case5-success.json)
          assert_eq 200 "$status" 'success within source with 29 IP failures'
          status=$(api_login '203.0.113.31' 'ip-history-30@example.test' "$WRONG_PASSWORD" /tmp/case5-30.json)
          assert_eq 401 "$status" '30th failed attempt is still credential response'
          status=$(api_login '203.0.113.31' 'ip-history-31@example.test' "$WRONG_PASSWORD" /tmp/case5-blocked.json)
          assert_eq 429 "$status" 'success did not clear IP-wide history'
          echo '::endgroup::'

          restart_api

          echo '::group::Case 6 — unknown/wrong external parity'
          flush_redis
          status_unknown=$(api_login '203.0.113.40' 'unknown-auth001@example.test' "$WRONG_PASSWORD" /tmp/case6-unknown.json)
          status_wrong=$(api_login '203.0.113.41' "$VICTIM_A" "$WRONG_PASSWORD" /tmp/case6-wrong.json)
          assert_eq 401 "$status_unknown" 'unknown email status'
          assert_eq 401 "$status_wrong" 'wrong password status'
          unknown_shape=$(jq -c '{statusCode,code,message}' /tmp/case6-unknown.json)
          wrong_shape=$(jq -c '{statusCode,code,message}' /tmp/case6-wrong.json)
          assert_eq "$unknown_shape" "$wrong_shape" 'unknown email / wrong password envelope parity'
          assert_domain_error /tmp/case6-unknown.json 401 INVALID_CREDENTIALS 'Invalid email or password'
          echo '::endgroup::'

          echo '::group::Cases 7 and 10 — Caddy overwrites and public routes inject canonical IP'
          count=$(grep -c 'header_up X-BookingOS-Client-IP {remote_host}' docker/caddy/Caddyfile)
          assert_eq 5 "$count" 'production Caddy public proxy header overwrite count'
          docker run --rm \
            -e ACME_EMAIL=ops@example.invalid \
            -e DASHBOARD_HOST=admin.example.invalid \
            -e API_HOST=api.example.invalid \
            -e PLATFORM_BASE_DOMAIN=example.invalid \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e ACME_EMAIL=ops@example.invalid \
            -e DASHBOARD_HOST=admin.example.invalid \
            -e API_HOST=api.example.invalid \
            -e PLATFORM_BASE_DOMAIN=example.invalid \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --pretty --config /etc/caddy/Caddyfile >/tmp/auth001-caddy.json
          adapted_count=$(grep -c 'X-BookingOS-Client-IP' /tmp/auth001-caddy.json)
          [ "$adapted_count" -ge 5 ] || fail "adapted Caddy config only contains $adapted_count canonical header occurrences"

          cat >/tmp/auth001-upstream.Caddyfile <<'EOF'
          :8080 {
            respond "{http.request.header.X-BookingOS-Client-IP}" 200
          }
          EOF
          cat >/tmp/auth001-edge.Caddyfile <<'EOF'
          :8081 {
            reverse_proxy auth001-caddy-upstream:8080 {
              header_up X-BookingOS-Client-IP {remote_host}
            }
          }
          EOF
          docker network create auth001-caddy >/dev/null
          docker run -d --name auth001-caddy-upstream --network auth001-caddy \
            -v /tmp/auth001-upstream.Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine >/dev/null
          docker run -d --name auth001-caddy-edge --network auth001-caddy -p 18081:8081 \
            -v /tmp/auth001-edge.Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine >/dev/null
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081 >/tmp/caddy-seen.txt 2>/dev/null; then break; fi
            sleep 1
          done
          seen=$(cat /tmp/caddy-seen.txt)
          [ -n "$seen" ] || fail 'Caddy echo upstream received an empty client IP'
          [ "$seen" != '8.8.8.8' ] || fail 'browser-supplied canonical IP survived Caddy unchanged'
          echo "$seen" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]+$' || fail "Caddy produced non-IP remote_host: $seen"
          echo '::endgroup::'

          echo '::group::Cases 8-9 — storefront/dashboard only forward one literal canonical IP'
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { trustedClientIpHeaders as storefrontHeaders } from './apps/storefront/app/lib/server/trusted-client-ip.server.ts';
          import { trustedClientIpHeaders as dashboardHeaders } from './apps/dashboard/app/lib/trusted-client-ip.server.ts';

          for (const headersFor of [storefrontHeaders, dashboardHeaders]) {
            const v4 = headersFor(new Request('http://example.test', {
              headers: { 'x-bookingos-client-ip': '203.0.113.50', 'x-forwarded-for': '8.8.8.8' },
            }));
            assert.deepEqual(v4, { 'x-bookingos-client-ip': '203.0.113.50' });
            const v6 = headersFor(new Request('http://example.test', {
              headers: { 'x-bookingos-client-ip': '2001:db8::50' },
            }));
            assert.deepEqual(v6, { 'x-bookingos-client-ip': '2001:db8::50' });
            assert.deepEqual(headersFor(new Request('http://example.test', {
              headers: { 'x-bookingos-client-ip': '203.0.113.50, 198.51.100.5' },
            })), {});
            assert.deepEqual(headersFor(new Request('http://example.test', {
              headers: { 'x-forwarded-for': '203.0.113.50' },
            })), {});
            assert.deepEqual(headersFor(new Request('http://example.test', {
              headers: { 'x-bookingos-client-ip': 'not-an-ip' },
            })), {});
          }
          NODE
          echo '::endgroup::'

          echo '::group::Case 11 — missing/malformed IP never becomes a shared socket-peer bucket'
          flush_redis
          marker=$(( $(wc -l </tmp/auth001-api.log) + 1 ))
          for i in $(seq 1 31); do
            status=$(api_login '' "missing-ip-$i@example.test" "$WRONG_PASSWORD" "/tmp/case11-missing-$i.json")
            assert_eq 401 "$status" "missing-IP credential attempt $i"
          done
          malformed='198.51.100.1, 198.51.100.2'
          for i in $(seq 1 6); do
            status=$(api_login "$malformed" "$VICTIM_A" "$WRONG_PASSWORD" "/tmp/case11-malformed-$i.json")
            assert_eq 401 "$status" "malformed-IP credential attempt $i"
          done
          new_logs=$(tail -n +"$marker" /tmp/auth001-api.log)
          echo "$new_logs" | grep -q 'auth.login.client_ip_unavailable' || fail 'missing/malformed IP telemetry was not emitted'
          event_line=$(echo "$new_logs" | grep 'auth.login.client_ip_unavailable' | tail -1)
          [[ "$event_line" != *"$malformed"* ]] || fail 'raw malformed client IP leaked into limiter telemetry event'
          echo '::endgroup::'

          restart_api

          echo '::group::Case 12 — limiter failures fail open and dedicated Redis commands fail fast'
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { LoginUseCase } = require('./apps/api/dist/modules/identity-access/application/use-cases/login.use-case.js');
          const { UserAccount } = require('./apps/api/dist/modules/identity-access/domain/entities/user-account.entity.js');
          const { InvalidCredentials } = require('./apps/api/dist/modules/identity-access/domain/errors/identity-access-errors.js');
          const IORedis = require('ioredis');
          const Redis = IORedis.default ?? IORedis;
          const { RedisLoginAbuseProtectionService } = require('./apps/api/dist/modules/identity-access/infrastructure/services/redis-login-abuse-protection.service.js');

          const user = UserAccount.rehydrate({
            id: '11111111-1111-4111-8111-111111111111',
            email: 'fail-open@example.test',
            passwordHash: 'hash',
            fullName: 'Fail Open',
            phone: null,
            avatarUrl: null,
            locale: 'vi',
            status: 'active',
            failedLoginCount: 4,
            lockedUntil: new Date(Date.now() + 60_000),
            emailVerifiedAt: new Date(),
          });
          let sessionsCreated = 0;
          const users = { findByEmail: async () => user };
          const hasher = { verify: async (_hash, password) => password === 'Correct123' };
          const sessions = {
            create: async () => {
              sessionsCreated += 1;
              const now = new Date();
              return {
                sessionId: '22222222-2222-4222-8222-222222222222',
                accessToken: 'access',
                accessExpiresAt: now,
                refreshToken: 'refresh',
                refreshExpiresAt: now,
              };
            },
          };
          const unavailableLimiter = {
            precheck: async () => { throw new Error('unavailable'); },
            recordFailure: async () => { throw new Error('unavailable'); },
            clearPair: async () => { throw new Error('unavailable'); },
          };
          const useCase = new LoginUseCase(users, hasher, sessions, unavailableLimiter);
          await useCase.execute(
            { email: 'fail-open@example.test', password: 'Correct123' },
            { ip: '203.0.113.55' },
          );
          assert.equal(sessionsCreated, 1, 'correct login must reach session creation when limiter throws');
          await assert.rejects(
            () => useCase.execute(
              { email: 'fail-open@example.test', password: 'Wrong123' },
              { ip: '203.0.113.55' },
            ),
            (error) => error instanceof InvalidCredentials,
          );

          const shared = new Redis(process.env.REDIS_URL);
          await shared.ping();
          const service = new RedisLoginAbuseProtectionService(shared);
          await service.redis.ping();
          service.redis.disconnect();
          const started = Date.now();
          await assert.rejects(() => service.precheck({
            normalizedEmail: 'fast-fail@example.test',
            clientIp: '203.0.113.56',
          }));
          const elapsed = Date.now() - started;
          assert.ok(elapsed < 2000, `dedicated limiter command took ${elapsed}ms after disconnect`);
          shared.disconnect();
          NODE
          echo '::endgroup::'

          echo '::group::Case 13 — distributed-account observation is telemetry only'
          flush_redis
          marker=$(( $(wc -l </tmp/auth001-api.log) + 1 ))
          for octet in 60 61 62 63 64; do
            for i in $(seq 1 4); do
              status=$(api_login "203.0.113.$octet" "$VICTIM_B" "$WRONG_PASSWORD" "/tmp/case13-$octet-$i.json")
              assert_eq 401 "$status" "distributed failure source $octet attempt $i"
            done
          done
          status=$(api_login '203.0.113.65' "$VICTIM_B" "$CORRECT_PASSWORD" /tmp/case13-success.json)
          assert_eq 200 "$status" 'correct password from fourth+ unrelated source after distributed signal'
          tail -n +"$marker" /tmp/auth001-api.log | grep -q 'auth.login.distributed_attack_suspected' || \
            fail 'distributed attack telemetry was not emitted at 20 failures / 3+ sources'
          echo '::endgroup::'

          echo '::group::Cases 14-15 — persisted legacy lockout state is inert and no longer written'
          flush_redis
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "UPDATE users SET failed_login_count = 4, locked_until = now() + interval '1 hour' WHERE email = '$VICTIM_B';" >/dev/null
          before=$(psql "$MIGRATE_DATABASE_URL" -Atc \
            "SELECT failed_login_count::text || '|' || extract(epoch from locked_until)::bigint::text FROM users WHERE email = '$VICTIM_B';")
          status=$(api_login '203.0.113.70' "$VICTIM_B" "$CORRECT_PASSWORD" /tmp/case14.json)
          assert_eq 200 "$status" 'legacy locked_until must not block correct password'
          status=$(api_login '203.0.113.71' "$VICTIM_B" "$WRONG_PASSWORD" /tmp/case15.json)
          assert_eq 401 "$status" 'wrong password remains invalid credentials with legacy columns populated'
          after=$(psql "$MIGRATE_DATABASE_URL" -Atc \
            "SELECT failed_login_count::text || '|' || extract(epoch from locked_until)::bigint::text FROM users WHERE email = '$VICTIM_B';")
          assert_eq "$before" "$after" 'password login must not write failed_login_count/locked_until'
          echo '::endgroup::'

          echo '::group::Production HMAC secret guard'
          node <<'NODE'
          const assert = require('node:assert/strict');
          const IORedis = require('ioredis');
          const Redis = IORedis.default ?? IORedis;
          const { RedisLoginAbuseProtectionService } = require('./apps/api/dist/modules/identity-access/infrastructure/services/redis-login-abuse-protection.service.js');
          const shared = new Redis(process.env.REDIS_URL);
          await shared.ping();
          const originalNodeEnv = process.env.NODE_ENV;
          const originalKey = process.env.AUTH_RATE_LIMIT_HMAC_KEY;
          process.env.NODE_ENV = 'production';
          for (const key of [undefined, 'short', 'dev-auth-rate-limit-hmac-key-not-for-production', 'CHANGE_ME_generate_with_openssl_rand_hex_32']) {
            if (key === undefined) delete process.env.AUTH_RATE_LIMIT_HMAC_KEY;
            else process.env.AUTH_RATE_LIMIT_HMAC_KEY = key;
            assert.throws(() => new RedisLoginAbuseProtectionService(shared));
          }
          process.env.AUTH_RATE_LIMIT_HMAC_KEY = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef';
          const valid = new RedisLoginAbuseProtectionService(shared);
          valid.redis.disconnect();
          process.env.NODE_ENV = originalNodeEnv;
          if (originalKey === undefined) delete process.env.AUTH_RATE_LIMIT_HMAC_KEY;
          else process.env.AUTH_RATE_LIMIT_HMAC_KEY = originalKey;
          shared.disconnect();
          NODE
          echo '::endgroup::'

          restart_api

          echo '::group::Case 16 — storefront/dashboard surface source-rate-limit copy'
          flush_redis
          for i in $(seq 1 5); do
            status=$(api_login '203.0.113.90' "$VICTIM_A" "$WRONG_PASSWORD" "/tmp/case16-sf-prefill-$i.json")
            assert_eq 401 "$status" "storefront prefill failure $i"
          done

          nohup env \
            NODE_ENV=development HOST=0.0.0.0 PORT=4173 \
            BACKEND_URL="$API" REDIS_URL="$REDIS_URL" \
            DASHBOARD_URL=http://admin.localhost:4174 \
            PLATFORM_BASE_DOMAIN=localhost \
            SESSION_SECRET_CURRENT="$SESSION_SECRET_CURRENT" SESSION_COOKIE_SECURE=false \
            ALLOW_MOCK_PAYMENTS=true PAYMENT_REDIRECT_ORIGINS=https://example.invalid \
            STORAGE_UPLOAD_ORIGINS=http://127.0.0.1:9000 \
            node apps/storefront/node_modules/@react-router/serve/bin.cjs apps/storefront/build/server/index.js \
            >/tmp/auth001-storefront.log 2>&1 &
          echo $! >/tmp/auth001-storefront.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/healthz >/dev/null || {
            cat /tmp/auth001-storefront.log
            fail 'storefront did not become healthy'
          }

          sf_status=$(curl -sS \
            --resolve studiohub.localhost:4173:127.0.0.1 \
            -H 'Origin: http://studiohub.localhost:4173' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'X-BookingOS-Client-IP: 203.0.113.90' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'Accept: text/html' \
            --data-urlencode "email=$VICTIM_A" \
            --data-urlencode "password=$WRONG_PASSWORD" \
            -o /tmp/case16-storefront.html -w '%{http_code}' \
            http://studiohub.localhost:4173/vi/auth/login)
          assert_eq 429 "$sf_status" 'storefront propagates backend source-rate-limit status'
          grep -q 'Bạn đã thử đăng nhập quá nhiều lần. Vui lòng thử lại sau.' /tmp/case16-storefront.html || {
            head -100 /tmp/case16-storefront.html
            fail 'storefront did not surface Vietnamese rate-limit copy'
          }
          ! grep -Eq 'Tài khoản tạm.*khóa|ACCOUNT_LOCKED' /tmp/case16-storefront.html || \
            fail 'storefront still surfaced account-lock wording'

          flush_redis
          restart_api
          for i in $(seq 1 5); do
            status=$(api_login '203.0.113.91' "$VICTIM_A" "$WRONG_PASSWORD" "/tmp/case16-db-prefill-$i.json")
            assert_eq 401 "$status" "dashboard prefill failure $i"
          done

          nohup env \
            NODE_ENV=development HOST=0.0.0.0 PORT=4174 \
            BACKEND_URL="$API" REDIS_URL="$REDIS_URL" \
            PLATFORM_STOREFRONT_URL=http://studiohub.localhost:4173 \
            DASHBOARD_URL=http://admin.localhost:4174 DASHBOARD_HOST=admin.localhost \
            SESSION_SECRET_CURRENT="$SESSION_SECRET_CURRENT" SESSION_COOKIE_SECURE=false \
            node apps/dashboard/node_modules/@react-router/serve/bin.cjs apps/dashboard/build/server/index.js \
            >/tmp/auth001-dashboard.log 2>&1 &
          echo $! >/tmp/auth001-dashboard.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/healthz >/dev/null || {
            cat /tmp/auth001-dashboard.log
            fail 'dashboard did not become healthy'
          }

          db_status=$(curl -sS \
            --resolve admin.localhost:4174:127.0.0.1 \
            -H 'Origin: http://admin.localhost:4174' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'X-BookingOS-Client-IP: 203.0.113.91' \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/html' \
            --data "$(jq -nc --arg email "$VICTIM_A" --arg password "$WRONG_PASSWORD" '{email:$email,password:$password}')" \
            -o /tmp/case16-dashboard.html -w '%{http_code}' \
            http://admin.localhost:4174/auth/login)
          assert_eq 400 "$db_status" 'dashboard maps backend limiter response to form error response'
          grep -q 'Bạn đã thử đăng nhập quá nhiều lần. Vui lòng thử lại sau.' /tmp/case16-dashboard.html || {
            head -100 /tmp/case16-dashboard.html
            fail 'dashboard did not surface Vietnamese rate-limit copy'
          }
          ! grep -Eq 'Tài khoản tạm.*khóa|ACCOUNT_LOCKED' /tmp/case16-dashboard.html || \
            fail 'dashboard still surfaced account-lock wording'
          echo '::endgroup::'

          echo 'AUTH-001 runtime smoke: all 16 acceptance cases passed.'
      - name: Publish runtime verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          payload=$(jq -nc \
            --arg state "$state" \
            --arg context "auth-001/runtime" \
            --arg description "AUTH-001 runtime smoke: $state" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$payload"
