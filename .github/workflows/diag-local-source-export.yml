name: Diagnostic Local Source Export

on:
  push:
    branches:
      - diag/local-fetch-main-10803f1

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record source commit
        run: git rev-parse HEAD | tee SOURCE_COMMIT.txt

      - name: Upload source tree for local verification
        uses: actions/upload-artifact@v4
        with:
          name: booking-saas-local-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
