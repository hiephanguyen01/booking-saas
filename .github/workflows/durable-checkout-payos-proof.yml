name: Durable Checkout payOS Proof

on:
  push:
    branches: [refactor/durable-checkout-payos]
  pull_request:
    branches: [refactor/payment-foundation]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PAYMENTS_ENC_KEY: durable-checkout-proof-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@booking/contracts build
      - run: pnpm --filter=@booking/api prisma:generate
      - name: API typecheck
        run: pnpm --filter=@booking/api typecheck
      - name: Disposable durable checkout + payOS proof
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          cat > .durable-checkout-payos-proof.ts <<'TS'
          import assert from 'node:assert/strict';
          import { payosGatewayConfigInputSchema } from '@booking/contracts';
          import { amountMatches } from './src/modules/payments/domain/payment-status';
          import { CheckoutUseCase } from './src/modules/payments/application/use-cases/checkout.use-case';
          import { PayosGatewayAdapter } from './src/modules/payments/infrastructure/gateways/payos-gateway.adapter';
          import { GatewayRequestError } from './src/modules/payments/infrastructure/gateways/provider-http';
          import { PrismaPaymentRepository } from './src/modules/payments/infrastructure/repositories/prisma-payment.repository';

          async function main() {
            const payos = new PayosGatewayAdapter({
              clientId: 'proof-client',
              apiKey: 'proof-api',
              checksumKey: 'proof-checksum-key-1234567890',
            });

            const paymentId = '00000000-0000-7000-8000-000000000123';
            const ref = payos.prepareOrderReference(paymentId);
            const numericRef = Number(ref);
            assert.match(ref, /^\d+$/);
            assert.ok(Number.isSafeInteger(numericRef) && numericRef > 0);
            assert.equal(ref, payos.prepareOrderReference(paymentId));

            assert.equal(amountMatches(1_000n, 1_000n), true);
            assert.equal(amountMatches(1_000n, 999n), false);
            assert.equal(amountMatches(1_000n, 1_001n), false, 'overpayment must be quarantined');

            const maliciousConfig = payosGatewayConfigInputSchema.safeParse({
              gateway: 'payos',
              environment: 'sandbox',
              credentials: {
                clientId: 'proof-client',
                apiKey: 'proof-api',
                checksumKey: 'proof-checksum-key-1234567890',
                baseUrl: 'https://attacker.example',
              },
            });
            assert.equal(maliciousConfig.success, false, 'tenant-controlled payOS baseUrl must be rejected');

            const proto = PrismaPaymentRepository.prototype as any;
            for (const method of [
              'lockCheckoutAttempt',
              'findReusableCheckoutAttempt',
              'createPendingCheckout',
              'markCheckoutReady',
              'markCheckoutCreateFailed',
              'recordCapturedAmountIfPending',
            ]) {
              assert.equal(typeof proto[method], 'function', `payment repository must implement ${method}`);
            }

            // payOS lookup-before-create: first GET misses, then one POST creates. Never trust a
            // provider-supplied checkout host; handoff is reconstructed from the fixed host.
            const originalFetch = globalThis.fetch;
            const createCalls: Array<{ url: string; method: string }> = [];
            globalThis.fetch = (async (request: string | URL | Request, init?: RequestInit) => {
              const url = String(request);
              const method = init?.method ?? 'GET';
              createCalls.push({ url, method });
              assert.ok(url.startsWith('https://api-merchant.payos.vn/'));
              if (method === 'GET') return new Response('{}', { status: 404 });
              const body = JSON.parse(String(init?.body ?? '{}')) as Record<string, unknown>;
              assert.equal(body.orderCode, numericRef);
              assert.equal(body.amount, 1_200);
              return new Response(
                JSON.stringify({
                  code: '00',
                  desc: 'success',
                  data: {
                    paymentLinkId: 'created-link-id',
                    orderCode: numericRef,
                    amount: 1_200,
                    status: 'PENDING',
                    checkoutUrl: 'https://attacker.example/ignored',
                  },
                }),
                { status: 200, headers: { 'content-type': 'application/json' } },
              );
            }) as typeof fetch;
            const created = await payos.createPayment({
              paymentId,
              gatewayOrderRef: ref,
              amountVnd: 1_200n,
              description: 'Booking BK-PROOF',
              returnUrl: 'https://shop.example/return',
              errorUrl: 'https://shop.example/error',
              cancelUrl: 'https://shop.example/cancel',
              expiresInSec: 900,
              paymentMethod: 'bank_transfer',
            });
            assert.deepEqual(createCalls.map((call) => call.method), ['GET', 'POST']);
            assert.equal(created.gatewayOrderRef, ref);
            assert.equal(created.destination.type, 'redirect');
            assert.equal(
              created.destination.type === 'redirect' ? created.destination.paymentUrl : '',
              'https://pay.payos.vn/web/created-link-id',
            );

            // Simulate provider accepting POST but our transport losing the response. A retry
            // with the same durable reference must recover via GET and perform no second POST.
            const recoverId = '00000000-0000-7000-8000-000000000124';
            const recoverRef = payos.prepareOrderReference(recoverId);
            const recoverOrderCode = Number(recoverRef);
            let recoveryPhase: 'first' | 'second' = 'first';
            const recoveryCalls: string[] = [];
            globalThis.fetch = (async (request: string | URL | Request, init?: RequestInit) => {
              const url = String(request);
              const method = init?.method ?? 'GET';
              recoveryCalls.push(`${recoveryPhase}:${method}`);
              if (recoveryPhase === 'first' && method === 'GET') {
                return new Response('{}', { status: 404 });
              }
              if (recoveryPhase === 'first' && method === 'POST') {
                throw new Error('simulated response loss');
              }
              assert.equal(method, 'GET');
              return new Response(
                JSON.stringify({
                  code: '00',
                  data: {
                    id: 'recovered-link-id',
                    orderCode: recoverOrderCode,
                    amount: 2_000,
                    status: 'PENDING',
                  },
                }),
                { status: 200, headers: { 'content-type': 'application/json' } },
              );
            }) as typeof fetch;
            const recoveryInput = {
              paymentId: recoverId,
              gatewayOrderRef: recoverRef,
              amountVnd: 2_000n,
              description: 'Booking BK-RECOVER',
              returnUrl: 'https://shop.example/return',
              errorUrl: 'https://shop.example/error',
              cancelUrl: 'https://shop.example/cancel',
              expiresInSec: 900,
              paymentMethod: 'bank_transfer' as const,
            };
            await assert.rejects(
              () => payos.createPayment(recoveryInput),
              (error: unknown) => error instanceof GatewayRequestError && error.kind === 'retryable',
            );
            recoveryPhase = 'second';
            const recovered = await payos.createPayment(recoveryInput);
            assert.deepEqual(recoveryCalls, ['first:GET', 'first:POST', 'second:GET']);
            assert.equal(
              recovered.destination.type === 'redirect' ? recovered.destination.paymentUrl : '',
              'https://pay.payos.vn/web/recovered-link-id',
            );
            globalThis.fetch = originalFetch;

            // Prove checkout's provider call is outside TenantDbService transaction and a
            // retryable failure reuses the same local payment/reference rather than inserting
            // another attempt.
            let inTenantTx = false;
            let storedPayment: any = null;
            let createCount = 0;
            let providerCount = 0;
            const providerInputs: any[] = [];
            let failFirstProviderCall = true;
            const fakeGateway = {
              key: 'payos',
              prepareOrderReference: (id: string) => payos.prepareOrderReference(id),
              providerPaymentMethod: () => 'BANK_TRANSFER',
              createPayment: async (input: any) => {
                assert.equal(inTenantTx, false, 'provider network call must be outside tenant transaction');
                assert.ok(storedPayment, 'local Payment must exist before provider call');
                providerCount++;
                providerInputs.push(input);
                if (failFirstProviderCall) {
                  failFirstProviderCall = false;
                  throw new GatewayRequestError('retryable', 'simulated timeout');
                }
                return {
                  destination: { type: 'redirect' as const, paymentUrl: 'https://pay.payos.vn/web/fake' },
                  gatewayTxnId: 'fake-link',
                  gatewayOrderRef: input.gatewayOrderRef,
                  paymentMethod: 'BANK_TRANSFER',
                };
              },
            };
            const fakeTenantDb = {
              forTenant: async (_tenantId: string, fn: (tx: any) => Promise<any>) => {
                assert.equal(inTenantTx, false, 'tenant transactions must not nest in proof');
                inTenantTx = true;
                try {
                  return await fn({});
                } finally {
                  inTenantTx = false;
                }
              },
            };
            const fakePayments = {
              lockCheckoutAttempt: async () => undefined,
              findReusableCheckoutAttempt: async () =>
                storedPayment ? { payment: storedPayment, destination: null } : null,
              createPendingCheckout: async (_tx: any, tenantId: string, data: any) => {
                createCount++;
                storedPayment = {
                  ...data,
                  tenantId,
                  capturedAmount: null,
                  status: 'pending',
                  gatewayOrderId: null,
                  gatewayTxnId: null,
                  paidAt: null,
                };
                return storedPayment;
              },
              markCheckoutReady: async (_tx: any, _id: string, data: any) => {
                storedPayment = { ...storedPayment, checkoutState: 'ready', ...data };
                return true;
              },
            };
            const fakeBooking = {
              status: 'pending_payment',
              code: 'BK-PROOF',
              depositAmount: 3_000n,
              securityDeposit: 0n,
              finalAmount: 3_000n,
              paidAmount: 0n,
            };
            const fakeConfig = {
              id: 'revision-proof',
              gateway: 'payos',
              settings: {
                enabledMethods: ['bank_transfer'],
                refundStrategy: 'manual',
                manualRefundSlaHours: 72,
              },
            };
            const checkout = new CheckoutUseCase(
              { findById: async () => fakeBooking } as any,
              fakePayments as any,
              {
                resolveActiveForCheckout: async () => ({
                  gateway: fakeGateway,
                  configRevisionId: 'revision-proof',
                  settings: fakeConfig.settings,
                }),
                resolveForPayment: async () => ({
                  gateway: fakeGateway,
                  configRevisionId: 'revision-proof',
                  settings: fakeConfig.settings,
                }),
              } as any,
              { findActiveAll: async () => [fakeConfig] } as any,
              { execute: async () => ({ id: 'tenant-proof', live: true }) } as any,
              fakeTenantDb as any,
            );
            await assert.rejects(
              () => checkout.execute('shop.example', 'booking-proof', 'bank_transfer'),
              (error: unknown) => error instanceof GatewayRequestError && error.kind === 'retryable',
            );
            const firstPaymentId = storedPayment.id;
            const firstOrderRef = storedPayment.gatewayOrderRef;
            const checkoutResult = await checkout.execute(
              'shop.example',
              'booking-proof',
              'bank_transfer',
            );
            assert.equal(createCount, 1, 'retryable provider failure must reuse one durable Payment');
            assert.equal(providerCount, 2);
            assert.equal(providerInputs[0].paymentId, firstPaymentId);
            assert.equal(providerInputs[1].paymentId, firstPaymentId);
            assert.equal(providerInputs[0].gatewayOrderRef, firstOrderRef);
            assert.equal(providerInputs[1].gatewayOrderRef, firstOrderRef);
            assert.equal(checkoutResult.paymentId, firstPaymentId);

            console.log(JSON.stringify({
              deterministicPayosOrderRef: true,
              exactAmountMatch: true,
              payosBaseUrlRejected: true,
              durableRepositorySeams: true,
              payosLookupBeforeCreate: true,
              payosTimeoutRecovery: true,
              providerOutsideDbTransaction: true,
              retryReusesDurablePayment: true,
            }));
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          pnpm exec ts-node --transpile-only .durable-checkout-payos-proof.ts
          rm -f .durable-checkout-payos-proof.ts
