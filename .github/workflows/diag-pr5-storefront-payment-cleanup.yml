name: PR5 Storefront Payment Cleanup Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'refactor/storefront-payment-cleanup'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      PAYMENTS_ENC_KEY: pr5-storefront-payment-cleanup-key-change-me
      OUTBOX_RELAY_DISABLED: 'true'
      ALLOW_MOCK_PAYMENTS: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/storefront-payment-cleanup
          fetch-depth: 1
      - name: Record exact tested head
        run: echo "pr5_runtime_head=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations and seed
        run: |
          cp .env.example .env
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate
          pnpm --filter=@booking/api seed
      - name: Full static gate
        run: pnpm test && pnpm turbo lint typecheck build
      - name: Prepare isolated PR5 runtime assertions
        run: |
          cat > scripts/pr5-storefront-balance-state-smoke.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { deriveBookingPaymentState } from '../apps/storefront/app/features/booking/lib/booking-payment-state.ts';

          const check = (name, condition) => {
            assert.ok(condition, name);
            console.log(`PASS ${name}`);
          };

          const status = (paymentStatus, paymentKind, bookingStatus = 'confirmed') => ({
            bookingCode: 'PR5-SMOKE',
            bookingStatus,
            paymentStatus,
            paymentKind,
            paidAmount: '400000',
          });
          const emptySearch = new URLSearchParams();
          const initialSuccess = deriveBookingPaymentState(status('succeeded', 'deposit'), emptySearch);
          check('initial booking success remains success', initialSuccess.isSuccess);
          check('initial booking success is not balance', !initialSuccess.isBalancePayment);
          const balancePending = deriveBookingPaymentState(status('pending', 'balance'), emptySearch);
          check('confirmed + balance pending is balance', balancePending.isBalancePayment);
          check('confirmed + balance pending is not success', !balancePending.isSuccess);
          check('confirmed + balance pending is pending', balancePending.isPending);
          check('confirmed + balance pending polls provider truth', balancePending.shouldPoll);
          const balanceFailed = deriveBookingPaymentState(status('failed', 'balance'), emptySearch);
          check('confirmed + balance failed is not success', !balanceFailed.isSuccess);
          check('confirmed + balance failed is failed', balanceFailed.paymentFailed);
          check('confirmed + balance failed stops polling', !balanceFailed.shouldPoll);
          const balanceExpired = deriveBookingPaymentState(status('expired', 'balance'), emptySearch);
          check('confirmed + balance expired is failed', balanceExpired.paymentFailed);
          const balanceSucceeded = deriveBookingPaymentState(status('succeeded', 'balance'), emptySearch);
          check('confirmed + balance succeeded is success', balanceSucceeded.isSuccess);
          const legacyConfirmed = deriveBookingPaymentState(status('pending', null), emptySearch);
          check('paymentKind null preserves confirmed booking fallback', legacyConfirmed.isSuccess);
          const spoofedReturn = deriveBookingPaymentState(
            status('pending', 'balance'),
            new URLSearchParams('payment=success'),
          );
          check('payment=success query marker never creates success', !spoofedReturn.isSuccess);
          check('spoofed balance return still polls', spoofedReturn.shouldPoll);
          console.log('PR5 RUNTIME GROUP COMPLETE balance-state');
          JS

          cat > apps/api/scripts/pr5-storefront-payment-cleanup-smoke.ts <<'TS'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const check = (name: string, condition: unknown) => {
            assert.ok(condition, name);
            console.log(`PASS ${name}`);
          };

          async function napasContracts() {
            const contracts = await import('@booking/contracts');
            const { SepayGatewayAdapter } = await import(
              '../src/modules/payments/infrastructure/gateways/sepay-gateway.adapter'
            );
            check('legacy napas_qr parser remains valid', contracts.customerPaymentMethodSchema.parse('napas_qr') === 'napas_qr');
            check(
              'legacy Napas settings remain parseable',
              contracts.gatewayPaymentSettingsSchema.parse({
                enabledMethods: ['napas_qr'],
                refundStrategy: 'manual',
                manualRefundSlaHours: 72,
              }).enabledMethods[0] === 'napas_qr',
            );
            check(
              'legacy Napas routing row remains parseable',
              contracts.paymentMethodRouteSchema.parse({ method: 'napas_qr', gateway: 'sepay', enabled: true }).method === 'napas_qr',
            );
            check('napas_qr is not eligible for new checkout', !contracts.isNewCheckoutPaymentMethod('napas_qr'));
            check('SePay compatibility map retains napas_qr', contracts.GATEWAY_SUPPORTED_METHODS.sepay.includes('napas_qr'));
            const sepay = new SepayGatewayAdapter({
              merchantId: 'legacy-merchant',
              secretKey: '0123456789abcdef0123456789abcdef',
              environment: 'sandbox',
            });
            check(
              'SePay maps legacy napas_qr to NAPAS_BANK_TRANSFER',
              sepay.providerPaymentMethod('napas_qr') === 'NAPAS_BANK_TRANSFER',
            );
          }

          async function publicOptions() {
            const [{ GetPublicPaymentOptionsUseCase }, { PaymentNotConfigured }] = await Promise.all([
              import('../src/modules/payments/application/use-cases/get-public-payment-options.use-case'),
              import('../src/modules/payments/application/payment-http-errors'),
            ]);
            const tenantDb = {
              forTenant: async (_tenantId: string, operation: (tx: object) => unknown) => operation({}),
            };
            const visibleUseCase = new GetPublicPaymentOptionsUseCase(
              { findActiveAll: async () => [{ gateway: 'sepay' }] } as never,
              { execute: async () => ({ id: 'tenant-pr5', live: true }) } as never,
              tenantDb as never,
              {
                list: async () => [
                  { method: 'napas_qr', gateway: 'sepay', enabled: true },
                  { method: 'bank_transfer', gateway: 'sepay', enabled: true },
                ],
              } as never,
            );
            const visible = await visibleUseCase.execute('studiohub.localhost');
            check(
              'public options omit legacy Napas while preserving bank transfer',
              visible.methods.length === 1 && visible.methods[0] === 'bank_transfer',
            );
            const napasOnly = new GetPublicPaymentOptionsUseCase(
              { findActiveAll: async () => [{ gateway: 'sepay' }] } as never,
              { execute: async () => ({ id: 'tenant-pr5', live: true }) } as never,
              tenantDb as never,
              { list: async () => [{ method: 'napas_qr', gateway: 'sepay', enabled: true }] } as never,
            );
            await assert.rejects(
              () => napasOnly.execute('studiohub.localhost'),
              (error: unknown) => error instanceof PaymentNotConfigured,
            );
            console.log('PASS legacy Napas-only route does not resurrect checkout');
          }

          async function directCheckout() {
            const [{ CheckoutUseCase }, { PaymentMethodUnavailable }] = await Promise.all([
              import('../src/modules/payments/application/use-cases/checkout.use-case'),
              import('../src/modules/payments/domain/errors/payment-errors'),
            ]);
            let dependencyTouched = false;
            const poison = new Proxy(
              {},
              {
                get() {
                  dependencyTouched = true;
                  throw new Error('checkout dependency touched before Napas guard');
                },
              },
            );
            const checkout = new CheckoutUseCase(
              poison as never,
              poison as never,
              poison as never,
              poison as never,
              poison as never,
              poison as never,
            );
            await assert.rejects(
              () => checkout.execute('studiohub.localhost', randomUUID(), 'napas_qr'),
              (error: unknown) => error instanceof PaymentMethodUnavailable,
            );
            check('direct Napas checkout is rejected before tenant/provider work', !dependencyTouched);
          }

          async function sourceUi() {
            const dashboardSource = readFileSync(
              resolve(__dirname, '../../dashboard/app/features/tenant/components/settings/checkout-method-settings-card.tsx'),
              'utf8',
            );
            check('dashboard new-checkout settings contain no Napas row', !dashboardSource.includes("['napas_qr'"));
            const storefrontRenderer = readFileSync(
              resolve(__dirname, '../../storefront/app/features/checkout/hooks/use-checkout-form-controller.ts'),
              'utf8',
            );
            check(
              'legacy storefront renderer remains total for Napas data',
              storefrontRenderer.includes("napas_qr: { icon: QrCode"),
            );
            const successSource = readFileSync(
              resolve(__dirname, '../../storefront/app/features/booking/components/booking-success-view.tsx'),
              'utf8',
            );
            check(
              'balance success uses balance-specific copy',
              successSource.includes("isBalancePayment ? t('payment.balanceSucceeded')"),
            );
            check(
              'balance success suppresses initial-booking email confirmation paragraph',
              successSource.includes('{!isBalancePayment ? ('),
            );
          }

          async function dbReadability() {
            const [{ PrismaPaymentRepository }, { PrismaService }] = await Promise.all([
              import('../src/modules/payments/infrastructure/repositories/prisma-payment.repository'),
              import('../src/shared/prisma/prisma.service'),
            ]);
            const prisma = new PrismaService();
            await prisma.onModuleInit();
            let legacyPaymentId: string | null = null;
            try {
              const booking = await prisma.admin.booking.findFirst({ orderBy: { createdAt: 'asc' } });
              assert.ok(booking, 'seeded booking required');
              legacyPaymentId = randomUUID();
              const legacyRef = `PR5-NAPAS-${randomUUID()}`;
              await prisma.admin.payment.create({
                data: {
                  id: legacyPaymentId,
                  tenantId: booking.tenantId,
                  bookingId: booking.id,
                  gateway: 'sepay',
                  kind: 'balance',
                  amount: 1000n,
                  capturedAmount: 1000n,
                  status: 'succeeded',
                  checkoutState: 'ready',
                  gatewayOrderRef: legacyRef,
                  paymentMethod: 'NAPAS_BANK_TRANSFER',
                  idempotencyKey: `pr5-legacy-napas:${legacyPaymentId}`,
                  paidAt: new Date(),
                },
              });
              const repository = new PrismaPaymentRepository(prisma);
              const page = await repository.listPlatform({ page: 1, pageSize: 10, search: legacyRef });
              const historical = page.items.find((item) => item.id === legacyPaymentId);
              check('legacy Napas payment row remains readable through history repository', historical);
              check('legacy Napas provider method is preserved in history', historical?.paymentMethod === 'NAPAS_BANK_TRANSFER');
            } finally {
              if (legacyPaymentId) await prisma.admin.payment.deleteMany({ where: { id: legacyPaymentId } });
              await prisma.onModuleDestroy();
            }
          }

          const groups: Record<string, () => Promise<void>> = {
            'napas-contracts': napasContracts,
            'public-options': publicOptions,
            'direct-checkout': directCheckout,
            'source-ui': sourceUi,
            'db-readability': dbReadability,
          };
          const group = process.argv[2];
          const run = group ? groups[group] : undefined;
          if (!run) throw new Error(`Unknown PR5 smoke group: ${group ?? '<missing>'}`);
          void run()
            .then(() => console.log(`PR5 RUNTIME GROUP COMPLETE ${group}`))
            .catch((error) => {
              console.error(error);
              process.exitCode = 1;
            });
          TS
      - name: Balance payment state assertions
        run: node scripts/pr5-storefront-balance-state-smoke.mjs
      - name: Napas compatibility contract assertions
        run: pnpm --filter=@booking/api exec ts-node --transpile-only scripts/pr5-storefront-payment-cleanup-smoke.ts napas-contracts
      - name: Public options Napas filtering assertions
        run: pnpm --filter=@booking/api exec ts-node --transpile-only scripts/pr5-storefront-payment-cleanup-smoke.ts public-options
      - name: Direct Napas checkout guard assertion
        run: pnpm --filter=@booking/api exec ts-node --transpile-only scripts/pr5-storefront-payment-cleanup-smoke.ts direct-checkout
      - name: Storefront and dashboard source compatibility assertions
        run: pnpm --filter=@booking/api exec ts-node --transpile-only scripts/pr5-storefront-payment-cleanup-smoke.ts source-ui
      - name: Historical Napas real-DB readability assertions
        run: pnpm --filter=@booking/api exec ts-node --transpile-only scripts/pr5-storefront-payment-cleanup-smoke.ts db-readability
      - name: Cleanup temporary PR5 smoke scripts
        if: always()
        run: rm -f scripts/pr5-storefront-balance-state-smoke.mjs apps/api/scripts/pr5-storefront-payment-cleanup-smoke.ts
