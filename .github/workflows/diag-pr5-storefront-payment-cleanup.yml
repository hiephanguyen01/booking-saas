name: PR5 Storefront Payment Cleanup Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'refactor/storefront-payment-cleanup'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      PAYMENTS_ENC_KEY: pr5-storefront-payment-cleanup-key-change-me
      OUTBOX_RELAY_DISABLED: 'true'
      ALLOW_MOCK_PAYMENTS: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/storefront-payment-cleanup
          fetch-depth: 2
      - name: Record exact tested head
        run: echo "pr5_runtime_head=$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations and seed
        run: |
          cp .env.example .env
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate
          pnpm --filter=@booking/api seed
      - name: Full static gate
        run: pnpm test && pnpm turbo lint typecheck build
      - name: Restore exact PR5 runtime assertions from parent diagnostic commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/diag-pr5-storefront-payment-cleanup.yml'],
              text=True,
          )
          start = "          cat > apps/api/scripts/pr5-storefront-payment-cleanup-smoke.ts <<'TS'\n"
          end = "          TS\n"
          begin = workflow.index(start) + len(start)
          finish = workflow.index(end, begin)
          embedded = workflow[begin:finish]
          lines = embedded.splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line for line in lines
          ) + '\n'
          assert 'PR5 RUNTIME SMOKE COMPLETE' in script
          Path('apps/api/scripts/pr5-storefront-payment-cleanup-smoke.ts').write_text(script)
          PY
      - name: Run PR5 runtime assertions
        run: |
          pnpm --filter=@booking/api exec ts-node --transpile-only scripts/pr5-storefront-payment-cleanup-smoke.ts
          rm apps/api/scripts/pr5-storefront-payment-cleanup-smoke.ts
