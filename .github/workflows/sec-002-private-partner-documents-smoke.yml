name: SEC-002 private partner documents smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sec-002-private-docs-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: development
      PORT: 3000
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking
      DATABASE_URL: postgresql://app_user:app_user_dev_pw@127.0.0.1:5432/booking
      ADMIN_DATABASE_URL: postgresql://app_admin:app_admin_dev_pw@127.0.0.1:5432/booking
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_COOKIE_SECURE: "false"
      PLATFORM_BASE_DOMAIN: bookingos.vn
      PUBLIC_API_URL: http://127.0.0.1:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: bookingos
      S3_PRIVATE_BUCKET: bookingos-private
      S3_PUBLIC_URL: http://127.0.0.1:9000/bookingos
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGN_EXPIRES_SEC: "300"
      STORAGE_UPLOAD_ORIGINS: http://127.0.0.1:9000
      SEED_ADMIN_EMAIL: smoke-admin@bookingos.local
      SEED_ADMIN_PASSWORD: SmokeAdmin1234
      SEED_OWNER_PASSWORD: demo-password
      SEED_DEMO_PASSWORD: demo-password
      PAYMENTS_ENC_KEY: smoke-payments-encryption-key-not-for-production
      ALLOW_MOCK_PAYMENTS: "true"
      OUTBOX_RELAY_DISABLED: "true"
      NOTIFICATION_REMINDER_DISABLED: "true"
      BOOKING_SCHEDULER_DISABLED: "true"
      SETTLEMENT_RELEASE_DISABLED: "true"
      LOG_PRETTY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start disposable MinIO
        run: |
          set -euo pipefail
          docker run -d --name sec002-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio12345 \
            minio/minio:latest server /data --console-address ':9001'
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::MinIO did not become ready'
          exit 1

      - name: Prepare disposable database, storage and API
        run: |
          set -euo pipefail
          pnpm --filter=@booking/api prisma:deploy
          pnpm --filter=@booking/api prisma:generate
          pnpm --filter=@booking/api storage:init
          pnpm --filter=@booking/api seed
          pnpm --filter=@booking/api build

          cd apps/api
          node - <<'NODE' > /tmp/sec002-seed-ids.json
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const studio = await prisma.tenant.findUniqueOrThrow({ where: { slug: 'studiohub' } });
            const bookingStad = await prisma.tenant.findUniqueOrThrow({ where: { slug: 'bookingstad' } });
            const giang = await prisma.partner.findUniqueOrThrow({
              where: { tenantId_slug: { tenantId: studio.id, slug: 'giang-studio' } },
            });
            process.stdout.write(JSON.stringify({
              studioTenantId: studio.id,
              bookingStadTenantId: bookingStad.id,
              giangPartnerId: giang.id,
            }));
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..

          echo "STUDIO_TENANT_ID=$(jq -r .studioTenantId /tmp/sec002-seed-ids.json)" >> "$GITHUB_ENV"
          echo "BOOKINGSTAD_TENANT_ID=$(jq -r .bookingStadTenantId /tmp/sec002-seed-ids.json)" >> "$GITHUB_ENV"
          echo "GIANG_PARTNER_ID=$(jq -r .giangPartnerId /tmp/sec002-seed-ids.json)" >> "$GITHUB_ENV"

          nohup pnpm --filter=@booking/api start >/tmp/sec002-api.log 2>&1 &
          echo $! >/tmp/sec002-api.pid
          for attempt in $(seq 1 90); do
            if curl -fsS -H 'Host: studiohub.localhost' \
              'http://127.0.0.1:3000/public/legal?locale=vi' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::API did not become ready'
          exit 1

      - name: Run SEC-002 runtime acceptance smoke
        shell: bash
        run: |
          set -euo pipefail

          API='http://127.0.0.1:3000'
          MAX_BYTES=5242880

          fail_status() {
            local label="$1" expected="$2" actual="$3" body="$4"
            local detail=''
            if [ -s "$body" ]; then
              detail=$(jq -r '.code // .message // empty' "$body" 2>/dev/null || true)
            fi
            echo "::error::$label expected HTTP $expected, got $actual${detail:+ ($detail)}"
            exit 1
          }

          require_status() {
            local label="$1" expected="$2" actual="$3" body="$4"
            if [ "$actual" != "$expected" ]; then
              fail_status "$label" "$expected" "$actual" "$body"
            fi
            echo "PASS $label"
          }

          require_2xx() {
            local label="$1" actual="$2"
            case "$actual" in
              200|201|204) echo "PASS $label" ;;
              *) echo "::error::$label expected 2xx, got $actual"; exit 1 ;;
            esac
          }

          # Resolve the current partner-terms version from the actual seeded tenant.
          curl -fsS -H 'Host: studiohub.localhost' \
            "$API/public/legal/partner_terms?locale=vi" -o /tmp/sec002-partner-terms.json
          PARTNER_TERMS_VERSION=$(jq -r .versionId /tmp/sec002-partner-terms.json)
          test -n "$PARTNER_TERMS_VERSION" && test "$PARTNER_TERMS_VERSION" != null

          # Create two fresh platform users so applicant ownership is isolated from seed partners.
          for who in a b; do
            email="sec002-${who}-${GITHUB_RUN_ID}@example.test"
            body=$(jq -n --arg email "$email" '{email:$email,password:"SmokePass123",fullName:"SEC002 Smoke",locale:"vi"}')
            status=$(curl -sS -c "/tmp/sec002-${who}.cookies" -o "/tmp/sec002-${who}-register.json" \
              -w '%{http_code}' -H 'content-type: application/json' -d "$body" "$API/auth/register")
            require_2xx "register applicant user $who" "$status"
          done
          USER_A_ID=$(jq -r .user.id /tmp/sec002-a-register.json)
          USER_B_ID=$(jq -r .user.id /tmp/sec002-b-register.json)
          test -n "$USER_A_ID" && test -n "$USER_B_ID"

          # 1. Unauthenticated callers cannot mint applicant document grants.
          status=$(curl -sS -o /tmp/sec002-c1.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"contentType":"image/png","sizeBytes":1024}' \
            "$API/partners/application-documents/presign")
          require_status 'case 1 unauthenticated applicant presign rejected' 401 "$status" /tmp/sec002-c1.json

          # 2. Server rejects >5 MiB before minting a grant.
          too_big=$((MAX_BYTES + 1))
          body=$(jq -n --argjson n "$too_big" '{contentType:"image/png",sizeBytes:$n}')
          status=$(curl -sS -b /tmp/sec002-a.cookies -o /tmp/sec002-c2.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$body" \
            "$API/partners/application-documents/presign")
          require_status 'case 2 applicant size cap enforced' 400 "$status" /tmp/sec002-c2.json
          if jq -e 'has("uploadUrl") or has("key")' /tmp/sec002-c2.json >/dev/null 2>&1; then
            echo '::error::oversized request unexpectedly returned a storage grant'
            exit 1
          fi

          # 3. Valid applicant grant is private and owner-scoped.
          body='{"contentType":"image/png","sizeBytes":1024}'
          status=$(curl -sS -b /tmp/sec002-a.cookies -o /tmp/sec002-a-grant.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$body" \
            "$API/partners/application-documents/presign")
          require_status 'case 3 valid applicant grant minted' 200 "$status" /tmp/sec002-a-grant.json
          jq -e '(.publicUrl | not) and .requiredHeaders["content-type"] == "image/png" and .requiredHeaders["if-none-match"] == "*"' \
            /tmp/sec002-a-grant.json >/dev/null
          APPLICANT_KEY=$(jq -r .key /tmp/sec002-a-grant.json)
          APPLICANT_UPLOAD_URL=$(jq -r .uploadUrl /tmp/sec002-a-grant.json)
          case "$APPLICANT_KEY" in
            "partner-documents/applicants/$USER_A_ID/"*) ;;
            *) echo '::error::applicant grant key is outside caller prefix'; exit 1 ;;
          esac
          SIGNED_HEADERS=$(python - "$APPLICANT_UPLOAD_URL" <<'PY'
          import sys
          from urllib.parse import urlparse, parse_qs
          q = parse_qs(urlparse(sys.argv[1]).query)
          print(q.get('X-Amz-SignedHeaders', q.get('x-amz-signedheaders', ['']))[0])
          PY
          )
          for header in content-length content-type if-none-match; do
            case ";$SIGNED_HEADERS;" in
              *";$header;"*) ;;
              *) echo "::error::private grant does not sign $header"; exit 1 ;;
            esac
          done
          echo 'PASS case 3 private grant has caller prefix and signed security headers'

          # 4. Exact-size PUT succeeds.
          head -c 1024 /dev/zero >/tmp/sec002-exact.bin
          status=$(curl -sS -o /tmp/sec002-put-exact.out -w '%{http_code}' -X PUT \
            -H 'content-type: image/png' -H 'if-none-match: *' -H 'content-length: 1024' \
            --data-binary @/tmp/sec002-exact.bin "$APPLICANT_UPLOAD_URL")
          require_2xx 'case 4 exact-size private PUT succeeds' "$status"

          # 5. A fresh URL signed for 1024 bytes rejects a 1023-byte body.
          status=$(curl -sS -b /tmp/sec002-a.cookies -o /tmp/sec002-mismatch-grant.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$body" \
            "$API/partners/application-documents/presign")
          require_status 'case 5 mismatch grant minted' 200 "$status" /tmp/sec002-mismatch-grant.json
          MISMATCH_URL=$(jq -r .uploadUrl /tmp/sec002-mismatch-grant.json)
          head -c 1023 /dev/zero >/tmp/sec002-short.bin
          status=$(curl -sS -o /tmp/sec002-put-short.out -w '%{http_code}' -X PUT \
            -H 'content-type: image/png' -H 'if-none-match: *' -H 'content-length: 1023' \
            --data-binary @/tmp/sec002-short.bin "$MISMATCH_URL")
          if [ "$status" -lt 400 ]; then
            echo "::error::case 5 mismatched signed content-length unexpectedly returned $status"
            exit 1
          fi
          echo 'PASS case 5 signed content-length rejects a different body size'

          # 6. Write-once key rejects the second exact PUT.
          status=$(curl -sS -o /tmp/sec002-put-second.out -w '%{http_code}' -X PUT \
            -H 'content-type: image/png' -H 'if-none-match: *' -H 'content-length: 1024' \
            --data-binary @/tmp/sec002-exact.bin "$APPLICANT_UPLOAD_URL")
          require_status 'case 6 write-once private key enforced' 412 "$status" /tmp/sec002-put-second.out

          # 7. The same key is absent from the public bucket/origin.
          status=$(curl -sS -o /tmp/sec002-public-key.out -w '%{http_code}' \
            "http://127.0.0.1:9000/bookingos/$APPLICANT_KEY")
          require_status 'case 7 private object absent from public bucket' 404 "$status" /tmp/sec002-public-key.out

          # 8. User B cannot attach user A's applicant key.
          apply_b=$(jq -n \
            --arg tenant "$STUDIO_TENANT_ID" --arg key "$APPLICANT_KEY" --arg version "$PARTNER_TERMS_VERSION" \
            --arg slug "sec002-b-${GITHUB_RUN_ID}" \
            '{tenantId:$tenant,name:"SEC002 Cross Owner",slug:$slug,partnerType:"individual",businessInfo:{identityCardFrontKey:$key},contactInfo:{phone:"0900000092",provinceCode:"79",wardCode:"26740",address:"12 Nguyen Hue"},legalConsent:{acceptedVersionIds:[$version],acceptedLocale:"vi"}}')
          status=$(curl -sS -b /tmp/sec002-b.cookies -o /tmp/sec002-cross-owner.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$apply_b" "$API/partners/apply")
          require_status 'case 8 cross-applicant key rejected' 400 "$status" /tmp/sec002-cross-owner.json
          grep -q 'INVALID_PARTNER_DOCUMENT_REFERENCE' /tmp/sec002-cross-owner.json

          # 9. User A persists its own key; tenant reviewer gets a working private read grant.
          apply_a=$(jq -n \
            --arg tenant "$STUDIO_TENANT_ID" --arg key "$APPLICANT_KEY" --arg version "$PARTNER_TERMS_VERSION" \
            --arg slug "sec002-a-${GITHUB_RUN_ID}" \
            '{tenantId:$tenant,name:"SEC002 Valid Applicant",slug:$slug,partnerType:"individual",businessInfo:{identityCardFrontKey:$key},contactInfo:{phone:"0900000091",provinceCode:"79",wardCode:"26740",address:"12 Nguyen Hue"},legalConsent:{acceptedVersionIds:[$version],acceptedLocale:"vi"}}')
          status=$(curl -sS -b /tmp/sec002-a.cookies -o /tmp/sec002-apply-a.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$apply_a" "$API/partners/apply")
          require_status 'case 9 own applicant key persisted' 201 "$status" /tmp/sec002-apply-a.json
          APPLICANT_PARTNER_ID=$(jq -r .id /tmp/sec002-apply-a.json)
          test -n "$APPLICANT_PARTNER_ID" && test "$APPLICANT_PARTNER_ID" != null

          owner_login='{"email":"owner@studiohub.vn","password":"demo-password"}'
          status=$(curl -sS -c /tmp/sec002-owner.cookies -o /tmp/sec002-owner-login.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$owner_login" "$API/auth/login")
          require_status 'login StudioHub tenant owner' 200 "$status" /tmp/sec002-owner-login.json

          status=$(curl -sS -b /tmp/sec002-owner.cookies -o /tmp/sec002-tenant-docs-a.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" \
            "$API/tenant/partners/$APPLICANT_PARTNER_ID/documents")
          require_status 'case 9 authorized tenant reviewer lists documents' 200 "$status" /tmp/sec002-tenant-docs-a.json
          APPLICANT_DOWNLOAD_URL=$(jq -r '.[] | select(.storage=="private" and .kind=="identity_card_front") | .downloadUrl' /tmp/sec002-tenant-docs-a.json)
          test -n "$APPLICANT_DOWNLOAD_URL" && test "$APPLICANT_DOWNLOAD_URL" != null
          status=$(curl -sS -o /tmp/sec002-reviewed-download.bin -w '%{http_code}' "$APPLICANT_DOWNLOAD_URL")
          require_status 'case 9 short-lived reviewer grant works' 200 "$status" /tmp/sec002-reviewed-download.bin
          cmp /tmp/sec002-exact.bin /tmp/sec002-reviewed-download.bin

          # 10. Authenticated but unauthorized caller cannot mint a tenant read grant.
          status=$(curl -sS -b /tmp/sec002-b.cookies -o /tmp/sec002-unauthorized-read.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" \
            "$API/tenant/partners/$APPLICANT_PARTNER_ID/documents")
          require_status 'case 10 unauthorized tenant document read rejected' 403 "$status" /tmp/sec002-unauthorized-read.json

          # Cross-tenant owner is authorized in its own tenant but RLS/not-found blocks StudioHub partner data.
          bookingstad_login='{"email":"owner@bookingstad.vn","password":"demo-password"}'
          status=$(curl -sS -c /tmp/sec002-bookingstad-owner.cookies -o /tmp/sec002-bookingstad-login.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$bookingstad_login" "$API/auth/login")
          require_status 'login BookingStad tenant owner' 200 "$status" /tmp/sec002-bookingstad-login.json
          status=$(curl -sS -b /tmp/sec002-bookingstad-owner.cookies -o /tmp/sec002-cross-tenant-read.json -w '%{http_code}' \
            -H "x-tenant-id: $BOOKINGSTAD_TENANT_ID" \
            "$API/tenant/partners/$APPLICANT_PARTNER_ID/documents")
          require_status 'cross-tenant document read is not found under RLS' 404 "$status" /tmp/sec002-cross-tenant-read.json

          # Login the existing approved partner owner for partner-scope checks.
          giang_login='{"email":"giang@giangstudio.vn","password":"demo-password"}'
          status=$(curl -sS -c /tmp/sec002-giang.cookies -o /tmp/sec002-giang-login.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$giang_login" "$API/auth/login")
          require_status 'login Giang partner owner' 200 "$status" /tmp/sec002-giang-login.json

          # 11. Existing partner cannot attach a key from another partner prefix.
          FOREIGN_KEY="partner-documents/partners/$APPLICANT_PARTNER_ID/11111111-1111-4111-8111-111111111111.png"
          foreign_body=$(jq -n --arg key "$FOREIGN_KEY" '{licenseDocumentKeys:[$key]}')
          status=$(curl -sS -b /tmp/sec002-giang.cookies -o /tmp/sec002-foreign-partner-key.json -w '%{http_code}' \
            -X PATCH -H 'content-type: application/json' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" -H "x-partner-id: $GIANG_PARTNER_ID" \
            -d "$foreign_body" "$API/partner/profile/documents")
          require_status 'case 11 cross-partner key rejected' 400 "$status" /tmp/sec002-foreign-partner-key.json
          grep -q 'INVALID_PARTNER_DOCUMENT_REFERENCE' /tmp/sec002-foreign-partner-key.json

          # 12. Partner owner can mint, upload, attach and read its own document.
          partner_grant_body='{"contentType":"image/png","sizeBytes":2048}'
          status=$(curl -sS -b /tmp/sec002-giang.cookies -o /tmp/sec002-partner-grant.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "x-tenant-id: $STUDIO_TENANT_ID" -H "x-partner-id: $GIANG_PARTNER_ID" \
            -d "$partner_grant_body" "$API/partner/profile/documents/presign")
          require_status 'case 12 partner private grant minted' 200 "$status" /tmp/sec002-partner-grant.json
          PARTNER_KEY=$(jq -r .key /tmp/sec002-partner-grant.json)
          PARTNER_UPLOAD_URL=$(jq -r .uploadUrl /tmp/sec002-partner-grant.json)
          case "$PARTNER_KEY" in
            "partner-documents/partners/$GIANG_PARTNER_ID/"*) ;;
            *) echo '::error::partner grant key is outside current partner prefix'; exit 1 ;;
          esac
          head -c 2048 /dev/zero >/tmp/sec002-partner.bin
          status=$(curl -sS -o /tmp/sec002-partner-put.out -w '%{http_code}' -X PUT \
            -H 'content-type: image/png' -H 'if-none-match: *' -H 'content-length: 2048' \
            --data-binary @/tmp/sec002-partner.bin "$PARTNER_UPLOAD_URL")
          require_2xx 'case 12 partner private PUT succeeds' "$status"
          partner_attach=$(jq -n --arg key "$PARTNER_KEY" '{licenseDocumentKeys:[$key]}')
          status=$(curl -sS -b /tmp/sec002-giang.cookies -o /tmp/sec002-partner-attach.json -w '%{http_code}' \
            -X PATCH -H 'content-type: application/json' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" -H "x-partner-id: $GIANG_PARTNER_ID" \
            -d "$partner_attach" "$API/partner/profile/documents")
          require_status 'case 12 partner attaches own private key' 200 "$status" /tmp/sec002-partner-attach.json
          status=$(curl -sS -b /tmp/sec002-giang.cookies -o /tmp/sec002-partner-docs.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" -H "x-partner-id: $GIANG_PARTNER_ID" \
            "$API/partner/profile/documents")
          require_status 'case 12 partner lists own documents' 200 "$status" /tmp/sec002-partner-docs.json
          PARTNER_DOWNLOAD_URL=$(jq -r --arg key "$PARTNER_KEY" '.[] | select(.storage=="private" and .key==$key) | .downloadUrl' /tmp/sec002-partner-docs.json)
          test -n "$PARTNER_DOWNLOAD_URL" && test "$PARTNER_DOWNLOAD_URL" != null
          status=$(curl -sS -o /tmp/sec002-partner-download.bin -w '%{http_code}' "$PARTNER_DOWNLOAD_URL")
          require_status 'case 12 partner private download works' 200 "$status" /tmp/sec002-partner-download.bin
          cmp /tmp/sec002-partner.bin /tmp/sec002-partner-download.bin

          # 13. Existing generic public partner-logo upload remains public and persistable.
          logo_presign='{"target":"partners","contentType":"image/png"}'
          status=$(curl -sS -b /tmp/sec002-giang.cookies -o /tmp/sec002-logo-grant.json -w '%{http_code}' \
            -H 'content-type: application/json' -d "$logo_presign" "$API/uploads/presign")
          require_status 'case 13 public logo grant minted' 200 "$status" /tmp/sec002-logo-grant.json
          LOGO_UPLOAD_URL=$(jq -r .uploadUrl /tmp/sec002-logo-grant.json)
          LOGO_PUBLIC_URL=$(jq -r .publicUrl /tmp/sec002-logo-grant.json)
          test -n "$LOGO_PUBLIC_URL" && test "$LOGO_PUBLIC_URL" != null
          case "$LOGO_PUBLIC_URL" in
            http://127.0.0.1:9000/bookingos/*) ;;
            *) echo '::error::logo upload did not return a public bucket URL'; exit 1 ;;
          esac
          head -c 128 /dev/zero >/tmp/sec002-logo.bin
          status=$(curl -sS -o /tmp/sec002-logo-put.out -w '%{http_code}' -X PUT \
            -H 'content-type: image/png' -H 'content-length: 128' \
            --data-binary @/tmp/sec002-logo.bin "$LOGO_UPLOAD_URL")
          require_2xx 'case 13 public logo PUT succeeds' "$status"
          status=$(curl -sS -o /tmp/sec002-logo-read.bin -w '%{http_code}' "$LOGO_PUBLIC_URL")
          require_status 'case 13 public logo is readable' 200 "$status" /tmp/sec002-logo-read.bin
          cmp /tmp/sec002-logo.bin /tmp/sec002-logo-read.bin
          logo_attach=$(jq -n --arg logo "$LOGO_PUBLIC_URL" '{logoUrl:$logo}')
          status=$(curl -sS -b /tmp/sec002-giang.cookies -o /tmp/sec002-logo-attach.json -w '%{http_code}' \
            -X PATCH -H 'content-type: application/json' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" -H "x-partner-id: $GIANG_PARTNER_ID" \
            -d "$logo_attach" "$API/partner/profile/documents")
          require_status 'case 13 public logo persists through partner document update' 200 "$status" /tmp/sec002-logo-attach.json

          # 14. Public partner profile stays private-data-free.
          status=$(curl -sS -o /tmp/sec002-public-partner.json -w '%{http_code}' \
            -H 'Host: studiohub.localhost' "$API/public/partners/giang-studio")
          require_status 'case 14 public partner profile loads' 200 "$status" /tmp/sec002-public-partner.json
          if grep -Eq 'businessInfo|identityCard|licenseDocumentKeys|partner-documents|downloadUrl|uploadUrl' /tmp/sec002-public-partner.json; then
            echo '::error::public partner profile exposed private document material'
            exit 1
          fi
          echo 'PASS case 14 public partner profile contains no private document material'

          # Regression: existing tenant tax PDF upload still works with signed exact length + write-once.
          printf '%%PDF-1.4\nSEC002 smoke\n' >/tmp/sec002-tax.pdf
          TAX_SIZE=$(wc -c </tmp/sec002-tax.pdf | tr -d ' ')
          TAX_SHA=$(sha256sum /tmp/sec002-tax.pdf | awk '{print $1}')
          tax_body=$(jq -n --arg checksum "$TAX_SHA" --argjson size "$TAX_SIZE" \
            '{contentType:"application/pdf",sizeBytes:$size,checksum:$checksum}')
          status=$(curl -sS -b /tmp/sec002-owner.cookies -o /tmp/sec002-tax-grant.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "x-tenant-id: $STUDIO_TENANT_ID" \
            -d "$tax_body" "$API/tenant/finance/tax/documents/presign")
          require_status 'tax PDF presign regression' 200 "$status" /tmp/sec002-tax-grant.json
          TAX_UPLOAD_URL=$(jq -r .uploadUrl /tmp/sec002-tax-grant.json)
          status=$(curl -sS -o /tmp/sec002-tax-put.out -w '%{http_code}' -X PUT \
            -H 'content-type: application/pdf' -H 'if-none-match: *' -H "content-length: $TAX_SIZE" \
            --data-binary @/tmp/sec002-tax.pdf "$TAX_UPLOAD_URL")
          require_2xx 'tax PDF exact signed PUT regression' "$status"

          # Audit records for private reads must be sanitized: no URL/key fields in audit data.
          cd apps/api
          STUDIO_TENANT_ID="$STUDIO_TENANT_ID" GIANG_PARTNER_ID="$GIANG_PARTNER_ID" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const rows = await prisma.auditLog.findMany({
              where: {
                tenantId: process.env.STUDIO_TENANT_ID,
                action: { in: [
                  'partner.private_documents.view_requested',
                  'partner.private_documents.self_view_requested',
                ] },
              },
              select: { action: true, data: true },
            });
            if (rows.length < 2) throw new Error('expected private document audit records');
            for (const row of rows) {
              const text = JSON.stringify(row.data ?? {});
              if (/downloadUrl|uploadUrl|partner-documents|\.png|\.jpg|\.webp|\.avif|\.gif/.test(text)) {
                throw new Error(`audit payload for ${row.action} contains document locator material`);
              }
            }
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          echo 'PASS private-document audit payloads are sanitized'

      - name: Run legacy compatibility and migration idempotence smoke
        shell: bash
        run: |
          set -euo pipefail
          API='http://127.0.0.1:3000'

          require_status() {
            local label="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label expected HTTP $expected, got $actual"
              exit 1
            fi
            echo "PASS $label"
          }

          mint_public_png() {
            local file="$1" grant_file="$2"
            local status
            status=$(curl -sS -b /tmp/sec002-giang.cookies -o "$grant_file" -w '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{"target":"partners","contentType":"image/png"}' "$API/uploads/presign")
            require_status 'legacy fixture public presign' 200 "$status"
            local upload_url public_url size
            upload_url=$(jq -r .uploadUrl "$grant_file")
            public_url=$(jq -r .publicUrl "$grant_file")
            size=$(wc -c <"$file" | tr -d ' ')
            status=$(curl -sS -o /tmp/sec002-legacy-put.out -w '%{http_code}' -X PUT \
              -H 'content-type: image/png' -H "content-length: $size" \
              --data-binary @"$file" "$upload_url")
            case "$status" in
              200|201|204) ;;
              *) echo "::error::legacy fixture public PUT failed with $status"; exit 1 ;;
            esac
            printf '%s' "$public_url"
          }

          head -c 512 /dev/zero >/tmp/sec002-legacy-valid.png
          head -c 5242881 /dev/zero >/tmp/sec002-legacy-oversized.png
          VALID_LEGACY_URL=$(mint_public_png /tmp/sec002-legacy-valid.png /tmp/sec002-legacy-valid-grant.json)
          OVERSIZED_LEGACY_URL=$(mint_public_png /tmp/sec002-legacy-oversized.png /tmp/sec002-legacy-oversized-grant.json)
          EXTERNAL_LEGACY_URL='https://example.com/sec002-external.png'
          MISSING_LEGACY_URL="http://127.0.0.1:9000/bookingos/sec002-missing-${GITHUB_RUN_ID}.png"

          # Seed only the four legacy fields under review; preserve unrelated businessInfo.
          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" \
          VALID_LEGACY_URL="$VALID_LEGACY_URL" \
          OVERSIZED_LEGACY_URL="$OVERSIZED_LEGACY_URL" \
          EXTERNAL_LEGACY_URL="$EXTERNAL_LEGACY_URL" \
          MISSING_LEGACY_URL="$MISSING_LEGACY_URL" \
          node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            const info = partner.businessInfo && typeof partner.businessInfo === 'object' && !Array.isArray(partner.businessInfo)
              ? { ...partner.businessInfo }
              : {};
            Object.assign(info, {
              identityCardFrontUrl: process.env.VALID_LEGACY_URL,
              identityCardBackUrl: process.env.EXTERNAL_LEGACY_URL,
              businessLicenseFrontUrl: process.env.OVERSIZED_LEGACY_URL,
              businessLicenseBackUrl: process.env.MISSING_LEGACY_URL,
            });
            delete info.identityCardFrontKey;
            delete info.identityCardBackKey;
            delete info.businessLicenseFrontKey;
            delete info.businessLicenseBackKey;
            await prisma.partner.update({ where: { id: partner.id }, data: { businessInfo: info } });
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..

          # 15. Compatibility reader exposes legacy URLs only to an authorized reviewer.
          status=$(curl -sS -b /tmp/sec002-owner.cookies -o /tmp/sec002-legacy-read-before.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" "$API/tenant/partners/$GIANG_PARTNER_ID/documents")
          require_status 'case 15 authorized legacy compatibility read' 200 "$status"
          jq -e --arg url "$VALID_LEGACY_URL" \
            '.[] | select(.storage=="legacy_public" and .kind=="identity_card_front" and .url==$url)' \
            /tmp/sec002-legacy-read-before.json >/dev/null
          echo 'PASS case 15 legacy field is represented as an explicit legacy_public descriptor'

          # Dry-run must classify fixtures but mutate neither DB nor object storage.
          pnpm --filter=@booking/api migrate:partner-documents -- --dry-run >/tmp/sec002-migration-dry.log
          grep -Eq '"eligible": [1-9][0-9]*' /tmp/sec002-migration-dry.log
          grep -Eq '"external_url": [1-9][0-9]*' /tmp/sec002-migration-dry.log
          grep -Eq '"missing": [1-9][0-9]*' /tmp/sec002-migration-dry.log
          grep -Eq '"oversized": [1-9][0-9]*' /tmp/sec002-migration-dry.log
          status=$(curl -sS -o /tmp/sec002-legacy-still-public.bin -w '%{http_code}' "$VALID_LEGACY_URL")
          require_status 'migration dry-run leaves public source intact' 200 "$status"
          cmp /tmp/sec002-legacy-valid.png /tmp/sec002-legacy-still-public.bin

          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" VALID_LEGACY_URL="$VALID_LEGACY_URL" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            const info = partner.businessInfo ?? {};
            if (info.identityCardFrontUrl !== process.env.VALID_LEGACY_URL) throw new Error('dry-run changed legacy URL');
            if (info.identityCardFrontKey) throw new Error('dry-run wrote canonical key');
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          echo 'PASS migration dry-run is a DB no-op'

          # First apply migrates only the eligible managed object.
          pnpm --filter=@booking/api migrate:partner-documents -- --apply >/tmp/sec002-migration-apply1.log
          grep -Eq '"migrated": [1-9][0-9]*' /tmp/sec002-migration-apply1.log
          status=$(curl -sS -o /tmp/sec002-legacy-deleted.out -w '%{http_code}' "$VALID_LEGACY_URL")
          require_status 'migration removes migrated public original' 404 "$status"

          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" \
          OVERSIZED_LEGACY_URL="$OVERSIZED_LEGACY_URL" \
          EXTERNAL_LEGACY_URL="$EXTERNAL_LEGACY_URL" \
          MISSING_LEGACY_URL="$MISSING_LEGACY_URL" \
          node - <<'NODE' >/tmp/sec002-migrated-key.txt
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            const info = partner.businessInfo ?? {};
            if (typeof info.identityCardFrontKey !== 'string' || !info.identityCardFrontKey.startsWith(`partner-documents/legacy/${partner.id}/`)) {
              throw new Error('eligible legacy document was not canonicalized');
            }
            if ('identityCardFrontUrl' in info) throw new Error('migrated legacy scalar URL was not cleaned up');
            if (info.identityCardBackUrl !== process.env.EXTERNAL_LEGACY_URL) throw new Error('external URL should remain for manual handling');
            if (info.businessLicenseFrontUrl !== process.env.OVERSIZED_LEGACY_URL) throw new Error('oversized URL should remain for manual handling');
            if (info.businessLicenseBackUrl !== process.env.MISSING_LEGACY_URL) throw new Error('missing URL should remain for manual handling');
            process.stdout.write(info.identityCardFrontKey);
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          MIGRATED_KEY=$(cat /tmp/sec002-migrated-key.txt)
          test -n "$MIGRATED_KEY"

          # Authorized reader now returns a private descriptor and its grant serves the copied bytes.
          status=$(curl -sS -b /tmp/sec002-owner.cookies -o /tmp/sec002-legacy-read-after.json -w '%{http_code}' \
            -H "x-tenant-id: $STUDIO_TENANT_ID" "$API/tenant/partners/$GIANG_PARTNER_ID/documents")
          require_status 'migrated legacy document read' 200 "$status"
          MIGRATED_DOWNLOAD_URL=$(jq -r '.[] | select(.storage=="private" and .kind=="identity_card_front") | .downloadUrl' /tmp/sec002-legacy-read-after.json)
          test -n "$MIGRATED_DOWNLOAD_URL" && test "$MIGRATED_DOWNLOAD_URL" != null
          status=$(curl -sS -o /tmp/sec002-migrated-download.bin -w '%{http_code}' "$MIGRATED_DOWNLOAD_URL")
          require_status 'migrated private copy is readable through short-lived grant' 200 "$status"
          cmp /tmp/sec002-legacy-valid.png /tmp/sec002-migrated-download.bin

          # Second apply is idempotent: no duplicate migration and canonical key stays identical.
          pnpm --filter=@booking/api migrate:partner-documents -- --apply >/tmp/sec002-migration-apply2.log
          grep -q '"migrated": 0' /tmp/sec002-migration-apply2.log
          cd apps/api
          GIANG_PARTNER_ID="$GIANG_PARTNER_ID" MIGRATED_KEY="$MIGRATED_KEY" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.ADMIN_DATABASE_URL } } });
          (async () => {
            const partner = await prisma.partner.findUniqueOrThrow({ where: { id: process.env.GIANG_PARTNER_ID } });
            if (partner.businessInfo?.identityCardFrontKey !== process.env.MIGRATED_KEY) {
              throw new Error('second apply changed canonical migration key');
            }
          })().finally(() => prisma.$disconnect());
          NODE
          cd ../..
          echo 'PASS migration second apply is idempotent'

          echo 'SEC-002 disposable runtime smoke: PASS'

      - name: Show sanitized API diagnostics on failure
        if: failure()
        run: |
          echo 'API process status:'
          if [ -f /tmp/sec002-api.pid ] && kill -0 "$(cat /tmp/sec002-api.pid)" 2>/dev/null; then
            echo 'running'
          else
            echo 'not running'
          fi
          echo 'Last API log messages (signed URLs/keys are not logged by the API):'
          tail -n 80 /tmp/sec002-api.log || true
