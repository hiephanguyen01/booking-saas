name: PR4 Schema Author

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-schema:
    if: github.event.pull_request.head.ref == 'feat/refund-allocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact schema delta
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/prisma/schema.prisma')
          s = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              '''enum RefundExecutionMode {\n  manual\n  automatic\n\n  @@map("refund_execution_mode")\n}\n''',
              '''enum RefundExecutionMode {\n  manual\n  automatic\n\n  @@map("refund_execution_mode")\n}\n\nenum RefundBatchStatus {\n  processing\n  manual_required\n  completed\n  failed\n\n  @@map("refund_batch_status")\n}\n''',
          )

          replace_once(
              '''  bookings                  Booking[]\n  payments                  Payment[]\n  gatewayConfigs            TenantGatewayConfig[]\n''',
              '''  bookings                  Booking[]\n  payments                  Payment[]\n  refundBatches             RefundBatch[]\n  gatewayConfigs            TenantGatewayConfig[]\n''',
          )

          replace_once(
              '''  payments            Payment[]\n  refunds             Refund[]\n  statusHistory       BookingStatusHistory[]\n''',
              '''  payments            Payment[]\n  refunds             Refund[]\n  refundBatches        RefundBatch[]\n  statusHistory       BookingStatusHistory[]\n''',
          )

          old_refund = '''model Refund {\n  id                   String              @id @default(uuid(7)) @db.Uuid\n  tenantId             String              @map("tenant_id") @db.Uuid\n  paymentId            String              @map("payment_id") @db.Uuid\n  bookingId            String              @map("booking_id") @db.Uuid\n  amount               BigInt\n  status               RefundStatus        @default(pending)\n  reason               String?\n  affectsBookingStatus Boolean             @default(true) @map("affects_booking_status")\n  gatewayRefundId      String?             @map("gateway_refund_id")\n  executionMode        RefundExecutionMode @default(manual) @map("execution_mode")\n  dueAt                DateTime?           @map("due_at") @db.Timestamptz(6)\n  completedAt          DateTime?           @map("completed_at") @db.Timestamptz(6)\n  evidence             Json?\n  createdAt            DateTime            @default(now()) @map("created_at") @db.Timestamptz(6)\n  updatedAt            DateTime            @updatedAt @map("updated_at") @db.Timestamptz(6)\n\n  payment    Payment            @relation(fields: [paymentId], references: [id], onDelete: Cascade)\n  booking    Booking            @relation(fields: [bookingId], references: [id], onDelete: Cascade)\n  settlement BookingSettlement?\n\n  @@index([tenantId])\n  @@index([paymentId])\n  @@index([bookingId])\n  @@map("refunds")\n}\n'''
          new_refund = '''model Refund {\n  id                   String              @id @default(uuid(7)) @db.Uuid\n  tenantId             String              @map("tenant_id") @db.Uuid\n  refundBatchId        String?             @map("refund_batch_id") @db.Uuid\n  paymentId            String              @map("payment_id") @db.Uuid\n  bookingId            String              @map("booking_id") @db.Uuid\n  amount               BigInt\n  status               RefundStatus        @default(pending)\n  reason               String?\n  affectsBookingStatus Boolean             @default(true) @map("affects_booking_status")\n  gatewayRefundId      String?             @map("gateway_refund_id")\n  executionMode        RefundExecutionMode @default(manual) @map("execution_mode")\n  dueAt                DateTime?           @map("due_at") @db.Timestamptz(6)\n  completedAt          DateTime?           @map("completed_at") @db.Timestamptz(6)\n  evidence             Json?\n  createdAt            DateTime            @default(now()) @map("created_at") @db.Timestamptz(6)\n  updatedAt            DateTime            @updatedAt @map("updated_at") @db.Timestamptz(6)\n\n  payment     Payment      @relation(fields: [paymentId], references: [id], onDelete: Cascade)\n  booking     Booking      @relation(fields: [bookingId], references: [id], onDelete: Cascade)\n  refundBatch RefundBatch? @relation(fields: [refundBatchId], references: [id], onDelete: Cascade)\n\n  @@index([tenantId])\n  @@index([paymentId])\n  @@index([bookingId])\n  @@index([refundBatchId])\n  @@index([bookingId, reason])\n  @@map("refunds")\n}\n\nmodel RefundBatch {\n  id                   String            @id @default(uuid(7)) @db.Uuid\n  tenantId             String            @map("tenant_id") @db.Uuid\n  bookingId            String            @map("booking_id") @db.Uuid\n  requestedAmount      BigInt            @map("requested_amount")\n  reason               String\n  affectsBookingStatus Boolean           @default(true) @map("affects_booking_status")\n  status               RefundBatchStatus @default(processing)\n  completedAt          DateTime?         @map("completed_at") @db.Timestamptz(6)\n  createdAt            DateTime          @default(now()) @map("created_at") @db.Timestamptz(6)\n  updatedAt            DateTime          @updatedAt @map("updated_at") @db.Timestamptz(6)\n\n  tenant  Tenant   @relation(fields: [tenantId], references: [id], onDelete: Cascade)\n  booking Booking  @relation(fields: [bookingId], references: [id], onDelete: Cascade)\n  refunds Refund[]\n\n  @@unique([tenantId, bookingId, reason])\n  @@index([tenantId, status, updatedAt])\n  @@map("refund_batches")\n}\n'''
          replace_once(old_refund, new_refund)

          replace_once(
              '''  refund            Refund?            @relation(fields: [refundId], references: [id], onDelete: SetNull)\n  dispute           SettlementDispute?\n''',
              '''  // Business refund reference: legacy Refund.id or batched RefundBatch.id.\n  // The database column is intentionally polymorphic and has no single-table FK.\n  dispute           SettlementDispute?\n''',
          )

          path.write_text(s)
          PY
          git diff --check
          git diff -- apps/api/prisma/schema.prisma
      - name: Commit schema and remove authoring workflow
        run: |
          rm .github/workflows/pr4-schema-author.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/prisma/schema.prisma .github/workflows/pr4-schema-author.yml
          git commit -m "feat(payments): model refund batches"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
