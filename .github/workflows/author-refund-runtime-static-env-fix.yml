name: Author Refund Runtime Static Env Fix

on:
  push:
    branches: [feat/refund-allocation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refund-allocation
      - name: Isolate static gate mock env
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/diag-refund-allocation-runtime.yml')
          text = p.read_text()
          old = "      - name: Current-repo static gate\n        run: |\n          pnpm test\n          pnpm turbo run lint typecheck build\n"
          new = "      - name: Current-repo static gate\n        env:\n          ALLOW_MOCK_PAYMENTS: 'false'\n        run: |\n          pnpm test\n          pnpm turbo run lint typecheck build\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected static gate block once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit diagnostic fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/diag-refund-allocation-runtime.yml
          git diff --cached --quiet && { echo 'No diagnostic change produced'; exit 1; }
          git commit -m 'ci(diag): isolate refund static-gate mock env'
          git push origin HEAD:feat/refund-allocation
