name: PR4 Task4 Author

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-task4:
    if: github.event.pull_request.head.ref == 'feat/refund-allocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply persistence delta
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          payment_repo = 'apps/api/src/modules/payments/infrastructure/repositories/prisma-payment.repository.ts'
          replace_once(
              payment_repo,
              '''    idempotencyKey: p.idempotencyKey,\n    paidAt: p.paidAt,\n  };''',
              '''    idempotencyKey: p.idempotencyKey,\n    paidAt: p.paidAt,\n    createdAt: p.createdAt,\n  };''',
          )
          replace_once(
              payment_repo,
              '''  async findSucceededByBooking(tx: PrismaTx, bookingId: string): Promise<PaymentRecord | null> {\n    const p = await tx.payment.findFirst({\n      where: { bookingId, status: 'succeeded' },\n      orderBy: { createdAt: 'desc' },\n    });\n    return p ? toRecord(p) : null;\n  }\n''',
              '''  async findSucceededByBooking(tx: PrismaTx, bookingId: string): Promise<PaymentRecord | null> {\n    const p = await tx.payment.findFirst({\n      where: { bookingId, status: 'succeeded' },\n      orderBy: { createdAt: 'desc' },\n    });\n    return p ? toRecord(p) : null;\n  }\n\n  async findSucceededRefundSources(tx: PrismaTx, bookingId: string): Promise<PaymentRecord[]> {\n    const rows = await tx.payment.findMany({\n      where: { bookingId, status: 'succeeded' },\n      orderBy: [{ createdAt: 'desc' }, { id: 'desc' }],\n    });\n    return rows.map(toRecord);\n  }\n\n  async findSecurityDepositSource(\n    tx: PrismaTx,\n    bookingId: string,\n  ): Promise<PaymentRecord | null> {\n    const payment = await tx.payment.findFirst({\n      where: { bookingId, status: 'succeeded', kind: { in: ['deposit', 'full'] } },\n      orderBy: [{ createdAt: 'asc' }, { id: 'asc' }],\n    });\n    return payment ? toRecord(payment) : null;\n  }\n''',
          )

          refund_repo = 'apps/api/src/modules/payments/infrastructure/repositories/prisma-refund.repository.ts'
          replace_once(
              refund_repo,
              '''    id: r.id,\n    tenantId: r.tenantId,\n    paymentId: r.paymentId,''',
              '''    id: r.id,\n    tenantId: r.tenantId,\n    refundBatchId: r.refundBatchId,\n    paymentId: r.paymentId,''',
          )
          replace_once(
              refund_repo,
              '''          tenantId,\n          paymentId: data.paymentId,''',
              '''          tenantId,\n          refundBatchId: data.refundBatchId ?? null,\n          paymentId: data.paymentId,''',
          )
          replace_once(
              refund_repo,
              '''  async existsForBooking(tx: PrismaTx, bookingId: string, reason: string): Promise<boolean> {\n    return (await tx.refund.count({ where: { bookingId, reason } })) > 0;\n  }\n\n  async findById''',
              '''  async existsForBooking(tx: PrismaTx, bookingId: string, reason: string): Promise<boolean> {\n    return (await tx.refund.count({ where: { bookingId, reason } })) > 0;\n  }\n\n  async reservedAmountForPayment(tx: PrismaTx, paymentId: string): Promise<bigint> {\n    const result = await tx.refund.aggregate({\n      where: { paymentId, status: { in: ['pending', 'manual_required', 'succeeded'] } },\n      _sum: { amount: true },\n    });\n    return result._sum.amount ?? 0n;\n  }\n\n  async findById''',
          )

          module = 'apps/api/src/modules/payments/infrastructure/http/payments.module.ts'
          replace_once(
              module,
              '''import { REFUND_POLICY_REPOSITORY } from '../../domain/ports/refund-policy-repository.port';\nimport { REFUND_REPOSITORY } from '../../domain/ports/refund-repository.port';''',
              '''import { REFUND_BATCH_REPOSITORY } from '../../domain/ports/refund-batch-repository.port';\nimport { REFUND_POLICY_REPOSITORY } from '../../domain/ports/refund-policy-repository.port';\nimport { REFUND_REPOSITORY } from '../../domain/ports/refund-repository.port';''',
          )
          replace_once(
              module,
              '''import { PrismaPaymentRepository } from '../repositories/prisma-payment.repository';\nimport { PrismaRefundPolicyRepository } from '../repositories/prisma-refund-policy.repository';''',
              '''import { PrismaPaymentRepository } from '../repositories/prisma-payment.repository';\nimport { PrismaRefundBatchRepository } from '../repositories/prisma-refund-batch.repository';\nimport { PrismaRefundPolicyRepository } from '../repositories/prisma-refund-policy.repository';''',
          )
          replace_once(
              module,
              '''    { provide: PAYMENT_METHOD_ROUTE_REPOSITORY, useClass: PrismaPaymentMethodRouteRepository },\n    { provide: REFUND_POLICY_REPOSITORY, useClass: PrismaRefundPolicyRepository },\n    { provide: REFUND_REPOSITORY, useClass: PrismaRefundRepository },''',
              '''    { provide: PAYMENT_METHOD_ROUTE_REPOSITORY, useClass: PrismaPaymentMethodRouteRepository },\n    { provide: REFUND_BATCH_REPOSITORY, useClass: PrismaRefundBatchRepository },\n    { provide: REFUND_POLICY_REPOSITORY, useClass: PrismaRefundPolicyRepository },\n    { provide: REFUND_REPOSITORY, useClass: PrismaRefundRepository },''',
          )

          Path('apps/api/src/modules/payments/infrastructure/repositories/prisma-refund-batch.repository.ts').write_text('''import { Injectable } from '@nestjs/common';\nimport { Prisma } from '@prisma/client';\nimport { PrismaService } from '../../../../shared/prisma/prisma.service';\nimport type { PrismaTx } from '../../../../shared/tenant-context/tenant-db.service';\nimport { RefundBatch } from '../../domain/entities/refund-batch.entity';\nimport type { RefundBatchState } from '../../domain/entities/refund-batch.entity';\nimport type {\n  IRefundBatchRepository,\n  RefreshRefundBatchResult,\n  RefundBatchRecord,\n} from '../../domain/ports/refund-batch-repository.port';\n\ntype Row = Prisma.RefundBatchGetPayload<Record<string, never>>;\n\nfunction toRecord(row: Row): RefundBatchRecord {\n  return {\n    id: row.id,\n    tenantId: row.tenantId,\n    bookingId: row.bookingId,\n    requestedAmount: row.requestedAmount,\n    reason: row.reason,\n    affectsBookingStatus: row.affectsBookingStatus,\n    status: row.status as RefundBatchState,\n    completedAt: row.completedAt,\n  };\n}\n\n@Injectable()\nexport class PrismaRefundBatchRepository implements IRefundBatchRepository {\n  constructor(private readonly prisma: PrismaService) {}\n\n  async findByBookingReason(\n    tx: PrismaTx,\n    bookingId: string,\n    reason: string,\n  ): Promise<RefundBatchRecord | null> {\n    const row = await tx.refundBatch.findFirst({ where: { bookingId, reason } });\n    return row ? toRecord(row) : null;\n  }\n\n  async create(\n    tx: PrismaTx,\n    tenantId: string,\n    data: {\n      bookingId: string;\n      requestedAmount: bigint;\n      reason: string;\n      affectsBookingStatus: boolean;\n    },\n  ): Promise<RefundBatchRecord> {\n    return toRecord(\n      await tx.refundBatch.create({\n        data: { tenantId, ...data },\n      }),\n    );\n  }\n\n  async refreshStatus(\n    tx: PrismaTx,\n    batchId: string,\n  ): Promise<RefreshRefundBatchResult | null> {\n    const batch = await tx.refundBatch.findUnique({ where: { id: batchId } });\n    if (!batch) return null;\n    const children = await tx.refund.findMany({\n      where: { refundBatchId: batchId },\n      select: { amount: true, status: true },\n    });\n    const next = RefundBatch.classify(batch.requestedAmount, children);\n\n    if (next === 'completed') {\n      const changed = await tx.refundBatch.updateMany({\n        where: { id: batchId, status: { not: 'completed' } },\n        data: { status: 'completed', completedAt: new Date() },\n      });\n      const current = await tx.refundBatch.findUnique({ where: { id: batchId } });\n      if (!current) return null;\n      return { batch: toRecord(current), transitionedToCompleted: changed.count === 1 };\n    }\n\n    if (batch.status !== 'completed' && batch.status !== next) {\n      await tx.refundBatch.updateMany({\n        where: { id: batchId, status: { not: 'completed' } },\n        data: { status: next },\n      });\n    }\n    const current = await tx.refundBatch.findUnique({ where: { id: batchId } });\n    if (!current) return null;\n    return { batch: toRecord(current), transitionedToCompleted: false };\n  }\n\n  async findCompletedNeedingRecovery(limit: number): Promise<RefundBatchRecord[]> {\n    const rows = await this.prisma.admin.$queryRaw<\n      Array<{\n        id: string;\n        tenantId: string;\n        bookingId: string;\n        requestedAmount: bigint;\n        reason: string;\n        affectsBookingStatus: boolean;\n        status: RefundBatchState;\n        completedAt: Date | null;\n      }>\n    >(Prisma.sql`\n      SELECT rb.id, rb.tenant_id AS "tenantId", rb.booking_id AS "bookingId",\n             rb.requested_amount AS "requestedAmount", rb.reason,\n             rb.affects_booking_status AS "affectsBookingStatus",\n             rb.status::text AS status, rb.completed_at AS "completedAt"\n      FROM refund_batches rb\n      JOIN bookings b ON b.id = rb.booking_id\n      LEFT JOIN booking_settlements bs ON bs.booking_id = rb.booking_id\n      WHERE rb.status = 'completed'::refund_batch_status\n        AND rb.affects_booking_status = true\n        AND (b.status <> 'refunded'::booking_status OR bs.refund_id IS DISTINCT FROM rb.id)\n      ORDER BY rb.updated_at, rb.id\n      LIMIT ${limit}`);\n    return rows;\n  }\n}\n''')
          PY
          git diff --check
      - name: Commit Task 4 and remove authoring workflow
        run: |
          rm .github/workflows/pr4-task4-author.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/payments/infrastructure/repositories/prisma-payment.repository.ts \
                  apps/api/src/modules/payments/infrastructure/repositories/prisma-refund.repository.ts \
                  apps/api/src/modules/payments/infrastructure/repositories/prisma-refund-batch.repository.ts \
                  apps/api/src/modules/payments/infrastructure/http/payments.module.ts \
                  .github/workflows/pr4-task4-author.yml
          git commit -m "feat(payments): persist refund allocation batches"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
