name: Agent Payment Routing Dashboard Patch

on:
  push:
    branches:
      - refactor/payment-provider-routing-separation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/payment-provider-routing-separation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dashboard patch
        run: python scripts/agent-payment-routing-dashboard.py
      - name: Commit patch and cleanup helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "refactor(dashboard): separate payment routing and refund policy"
          git push origin HEAD:refactor/payment-provider-routing-separation
