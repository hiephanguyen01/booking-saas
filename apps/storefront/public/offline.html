<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Không có kết nối · No connection</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card: #ffffff;
        --ink: #18181b;
        --muted: #6b7280;
        --border: #e4e4e7;
        --brand: #ffb020;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --card: #17171a;
          --ink: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font-family:
          'Plus Jakarta Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          ui-sans-serif,
          system-ui,
          sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.75rem;
        border: 1px solid var(--border);
        border-radius: 0.875rem;
        background: var(--card);
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 0.75rem;
      }
      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.625rem 0 0;
        font-size: 0.9375rem;
        color: var(--muted);
      }
      .en {
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }
      .en h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: var(--ink);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 1.5rem;
        padding: 0 1.75rem;
        border-radius: 0.5rem;
        background: var(--brand);
        color: #18181b;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="BookingOS" width="56" height="56" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>
        Không thể tải trang vì thiết bị không có kết nối mạng. Hãy kiểm tra Wi-Fi hoặc dữ liệu di
        động rồi thử lại.
      </p>
      <div class="en">
        <h2>You are offline</h2>
        <p>
          This page needs a network connection. Check your Wi-Fi or mobile data, then try again.
        </p>
      </div>
      <a href="/">Thử lại · Try again</a>
    </main>
  </body>
</html>
