services:
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3002}
    ports:
      - '${STOREFRONT_DOCKER_PORT:-3001}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379}
      SESSION_SECRET_CURRENT: ${SESSION_SECRET_CURRENT:?SESSION_SECRET_CURRENT is required}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - '${DASHBOARD_DOCKER_PORT:-3002}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      storefront: { condition: service_healthy }
      dashboard: { condition: service_healthy }
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${FRONTEND_PROXY_PORT:-8080}:80'
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
